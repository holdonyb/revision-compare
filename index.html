<script id="document-data" type="application/json">{"schema":2,"documentId":"748b62fd3daefab3e27a338c104e56ce93e713aebaf1699693e0ccdf61f5b2ae","title":"人工智能冲击下的“投资于人”建议","version":"数据保留 · 最小改动审稿版","created":"2026-09-13","rows":[{"id":1,"page":1,"heading":true,"section":"导言","subsection":"","original":"人工智能冲击下的\"投资于人\"建议","previous":"人工智能冲击下的“投资于人”建议","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能冲击下的\"投资于人\"建议"},{"id":2,"page":1,"heading":false,"section":"导言","subsection":"","original":"人工智能的发展，对人类整体而言具有里程碑式的正面意义。像蒸汽机、电力和计算机一样，它使社会能以更少的工作投入创造更大的经济产出和生活效用，让人类得以不断降低必要劳动的代价，以更少时间满足更多需要——这正是文明演进的基本路径。","previous":"人工智能的发展，对人类整体而言具有里程碑式的正面意义。像蒸汽机、电力和计算机一样，它使社会能以更少的工作投入创造更大的经济产出和生活效用，让人类得以不断降低必要劳动的代价，以更少时间满足更多需要——这正是文明演进的基本路径。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"人工智能的发展，对人类整体而言具有里程碑式的正面意义。像蒸汽机、电力和计算机一样，它使社会能以更少的工作投入创造更大的经济产出和生活效用，让人类得以不断降低必要劳动的代价，以更少时间满足更多需要——这正是文明演进的基本路径。"},{"id":3,"page":1,"heading":false,"section":"导言","subsection":"","original":"然而，技术本身并不自动兑现为民众福祉。同样的技术革命可以促进共同繁荣，也可以加剧贫富分化、激化社会矛盾，甚至侵蚀社会存续的根基；真正决定方向的，不是机器能做什么，而是新增产出和效率收益如何分配。如果普通人收入增加、工时缩短、生活更从容，人工智能就是全社会的福祉；如果收益集中于少数平台和个人，机器越能干，普通人的岗位、收入和希望反而越少。","previous":"然而，技术本身并不自动兑现为民众福祉。同样的技术革命可以促进共同繁荣，也可以加剧贫富分化、激化社会矛盾，甚至侵蚀社会存续的根基；真正决定方向的，不是机器能做什么，而是新增产出和效率收益如何分配。如果普通人收入增加、工时缩短、生活更从容，人工智能就是全社会的福祉；如果收益集中于少数平台和个人，机器越能干，普通人的岗位、收入和希望反而越少。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"然而，技术本身并不自动兑现为民众福祉。同样的技术革命可以促进共同繁荣，也可以加剧贫富分化、激化社会矛盾，甚至侵蚀社会存续的根基；真正决定方向的，不是机器能做什么，而是新增产出和效率收益如何分配。如果普通人收入增加、工时缩短、生活更从容，人工智能就是全社会的福祉；如果收益集中于少数平台和个人，机器越能干，普通人的岗位、收入和希望反而越少。"},{"id":4,"page":1,"heading":false,"section":"导言","subsection":"","original":"我国已经拥有世界领先的生产、建设和创新能力，民众却仍普遍感到工作时间长、生活压力大、婚育负担重，并没有过上与这种能力相匹配的生活。而人工智能的发展若不能配之以相应的分配制度改进，将会进一步加剧贫富分化、人口萎缩和经济困境。这些挑战，迫使我们更早回答发展的底层问题。","previous":"我国已经拥有世界领先的生产、建设和创新能力，民众却仍普遍感到工作时间长、生活压力大、婚育负担重，并没有过上与这种能力相匹配的生活。而人工智能的发展若不能配之以相应的分配制度改进，还可能进一步加剧贫富分化、人口萎缩和经济困境。这些挑战，迫使我们更早回答发展的底层问题。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国已经拥有世界领先的生产、建设和创新能力，民众却仍普遍感到工作时间长、生活压力大、婚育负担重，并没有过上与这种能力相匹配的生活。而人工智能的发展若不能配之以相应的分配制度改进，将会进一步加剧贫富分化、人口萎缩和经济困境。这些挑战，迫使我们更早回答发展的底层问题。"},{"id":5,"page":1,"heading":false,"section":"导言","subsection":"","original":"建议把\"投资于人\"进一步落实为对普通劳动者、养育家庭和全体国民的制度性投资，在保留多劳多得的同时，建立不完全依附雇佣关系的起点收入制度，并以大规模普惠养育金作为最现实的切入点。这一方案并非零散的福利补丁，而是可以同时回应经济下行、低生育危机和人工智能冲击的系统性制度安排，其本质是把技术进步转化为共同富裕的现实路径，使其成为增进民众福祉、促进人的全面发展的有力依托。","previous":"建议把“投资于人”进一步落实为对普通劳动者、养育家庭和全体国民的制度性投资，在保留多劳多得的同时，逐步探索不完全依附雇佣关系的起点收入制度，并以大规模普惠养育金作为最现实的切入点。这一方案并非零散的福利补丁，而是希望通过收益分享与养育成本分担，同时回应经济下行、低生育危机和人工智能冲击。其本质是把技术进步转化为共同富裕的现实路径，使社会不仅更有能力生产商品和服务，也更有能力保障人的生活、支持人的成长。","changes":[{"id":"C001","paragraph":5,"start":183,"end":183,"before":"","after":"\n\n这里需要打通的，是两层关系：社会生产能力提高，如何转化为普通人的收入与闲暇；养育的成果惠及整个社会，其成本又如何得到合理分担。起点收入着眼于共同成果的分享，养育金着眼于下一代成长成本的分担。","reason":"导言已并列提出起点收入与养育金，但没有交代为什么两者属于同一主线。只在段末补出“成果分享—成长成本分担”的关系，不改原来的政策力度和五部分结构。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"建议把\"投资于人\"进一步落实为对普通劳动者、养育家庭和全体国民的制度性投资，在保留多劳多得的同时，建立不完全依附雇佣关系的起点收入制度，并以大规模普惠养育金作为最现实的切入点。这一方案并非零散的福利补丁，而是可以同时回应经济下行、低生育危机和人工智能冲击的系统性制度安排，其本质是把技术进步转化为共同富裕的现实路径，使其成为增进民众福祉、促进人的全面发展的有力依托。\n\n这里需要打通的，是两层关系：社会生产能力提高，如何转化为普通人的收入与闲暇；养育的成果惠及整个社会，其成本又如何得到合理分担。起点收入着眼于共同成果的分享，养育金着眼于下一代成长成本的分担。"},{"id":6,"page":1,"heading":true,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"","original":"一、人工智能对就业的冲击：入口收窄","previous":"一、人工智能对就业的冲击：入口收窄","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"一、人工智能对就业的冲击：入口收窄"},{"id":7,"page":1,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"","original":"人工智能对就业的影响，目前主要不是一次性取消整个职业，而是接管职业内部容易标准化、文本化和流程化的任务，再将剩余职责合并给更少、更有经验的劳动者。宏观就业总量暂未明显下降，但普通劳动者已受到实质性冲击。","previous":"人工智能对就业的影响，目前值得警惕的不是一次性取消整个职业，而是接管职业内部容易标准化、文本化和流程化的任务，再将剩余职责合并给更少、更有经验的劳动者。即使宏观就业总量没有明显下降，普通劳动者也可能受到实质性冲击。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能对就业的影响，目前主要不是一次性取消整个职业，而是接管职业内部容易标准化、文本化和流程化的任务，再将剩余职责合并给更少、更有经验的劳动者。宏观就业总量暂未明显下降，但普通劳动者已受到实质性冲击。"},{"id":8,"page":1,"heading":true,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（一）替代机制：任务重组","original":"（一）替代机制：任务重组","previous":"（一）替代机制：任务重组","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（一）替代机制：任务重组"},{"id":9,"page":1,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（一）替代机制：任务重组","original":"北京大学国家发展研究院与智联招聘联合发布的《AI 大模型对我国劳动力市场潜在影响研究：2024》指出，\"大语言模型影响指数\"越高的职业，招聘岗位占比下滑越显著；编辑/翻译、客服/运营、销售/商务拓展等岗位受冲击最为突出，2022 年至2024 年上半年招聘量占比下降2-5个百分点以上。","previous":"北京大学国家发展研究院与智联招聘联合发布的《AI大模型对我国劳动力市场潜在影响研究：2024》指出，“大语言模型影响指数”较高的职业，招聘岗位占比下降，招聘要求提高；编辑、翻译、客服、运营、销售和商务拓展等岗位受到较大影响。","changes":[],"sourceIds":["S01"],"restoration":"","previousChanged":true,"chinaAnchors":["我国","北京大学","智联"],"numbers":["2024","2022","2024","2","5"],"suggested":"北京大学国家发展研究院与智联招聘联合发布的《AI 大模型对我国劳动力市场潜在影响研究：2024》指出，\"大语言模型影响指数\"越高的职业，招聘岗位占比下滑越显著；编辑/翻译、客服/运营、销售/商务拓展等岗位受冲击最为突出，2022 年至2024 年上半年招聘量占比下降2-5个百分点以上。"},{"id":10,"page":1,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（一）替代机制：任务重组","original":"上海科技大学教育、创新和可持续发展研究中心2026 年7 月发布《AI 时代的中国劳动力市场：从职业消失论到任务重组论》，覆盖1267 种职业、6.52 万项任务。基于国内线上招聘市场数据分析显示，33.2%的岗位任务组合具有较高机器替代可能，26.6%的招聘岗位落入\"机器可替代程度高、人的互补作用较弱\"的替代压力区；同时18.6%的招聘岗位由任务重组产生。","previous":"上海科技大学教育、创新和可持续发展研究中心2026年7月发布《AI时代的中国劳动力市场：从职业消失论到任务重组论》。报告基于国内线上招聘数据测算，33.2%的岗位属于高人工智能暴露任务组合，26.6%的招聘岗位落入“高暴露、低互补”的替代压力区。报告同时发现，任务重组也在产生新的复合型岗位。这些数字反映的是任务结构与潜在压力，不能直接等同于已经失去的工作。","changes":[],"sourceIds":["S02"],"restoration":"33.2%、26.6%和18.6%全部恢复在原位；它们是否来自相同样本期分别核对，不再因口径不同就删去任务重组这侧的数据。","previousChanged":true,"chinaAnchors":["中国","国内","上海科技大学"],"numbers":["2026","7","1267","6.52","33.2%","26.6%","18.6%"],"suggested":"上海科技大学教育、创新和可持续发展研究中心2026 年7 月发布《AI 时代的中国劳动力市场：从职业消失论到任务重组论》，覆盖1267 种职业、6.52 万项任务。基于国内线上招聘市场数据分析显示，33.2%的岗位任务组合具有较高机器替代可能，26.6%的招聘岗位落入\"机器可替代程度高、人的互补作用较弱\"的替代压力区；同时18.6%的招聘岗位由任务重组产生。"},{"id":11,"page":1,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（一）替代机制：任务重组","original":"从岗位特征看，压力最集中于任务可数字化表达、结果容易检验、责任边界清晰的岗位，如文书行政、客服、财务核算、基础图文内容和电话销售。相反，医疗、照护、设备运维、现场制造及需要情境判断、责任承担和跨角色协调的岗位，直接替代较小。","previous":"从岗位特征看，压力最集中于任务可数字化表达、结果容易检验、责任边界清晰的岗位，如文书行政、客服、财务核算、基础图文内容和电话销售。相反，医疗、照护、设备运维、现场制造及需要情境判断、责任承担和跨角色协调的岗位，直接替代较小。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"从岗位特征看，压力最集中于任务可数字化表达、结果容易检验、责任边界清晰的岗位，如文书行政、客服、财务核算、基础图文内容和电话销售。相反，医疗、照护、设备运维、现场制造及需要情境判断、责任承担和跨角色协调的岗位，直接替代较小。"},{"id":12,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（一）替代机制：任务重组","original":"从岗位门槛看，大模型相关岗位的准入要求明显抬升。上述北大-智联报告显示，自然语言处理岗位中，要求3-5 年工作经验的占比由31.9%上升至33.8%，要求5 年以上经验的占比由11.3%上升至14.1%。企业更偏好资深从业者，意味着岗位入口正在收窄。","previous":"从岗位门槛看，大模型相关岗位的准入要求明显抬升。上述北大—智联报告显示，自然语言处理岗位中，要求3—5年工作经验的占比由31.9%上升至33.8%，要求5年以上经验的占比由11.3%上升至14.1%。新技术创造岗位的同时，也可能抬高岗位门槛。","changes":[],"sourceIds":["S01"],"restoration":"","previousChanged":true,"chinaAnchors":["北大","智联"],"numbers":["3","5","31.9%","33.8%","5","11.3%","14.1%"],"suggested":"从岗位门槛看，大模型相关岗位的准入要求明显抬升。上述北大-智联报告显示，自然语言处理岗位中，要求3-5 年工作经验的占比由31.9%上升至33.8%，要求5 年以上经验的占比由11.3%上升至14.1%。企业更偏好资深从业者，意味着岗位入口正在收窄。"},{"id":13,"page":2,"heading":true,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"（二）行业渗透：后台到前台","previous":"（二）行业渗透：后台到前台","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（二）行业渗透：后台到前台"},{"id":14,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"【客服与后台运营】阿里巴巴智能客服体系对标准化咨询问题解决率可达80%以上，平台人工客服规模收缩，人力更多保留用于复杂投诉、VIP 等高价值服务场景。美国Salesforce 将全球客户支持团队由约9000 人缩减至5000 人，人工智能客服Agentforce 承担约一半客户交互量。甲骨文2026 财年员工由16.2 万人降至14.1 万人，降幅约13%；其监管文件明确提及，全业务线部署人工智能已经、并可能继续带来人员缩减。美国人力资源机构Challenger 统计，截至2026 年7 月，美国企业公告中明确将AI 列为原因的裁员规模达11.27 万人，占全部公告裁员的24%。","previous":"【客服与后台运营】智能客服正在接管大量标准化咨询，人工服务更多转向复杂投诉和需要责任判断的场景。甲骨文2026财年末员工约14.1万人，其监管文件也将人工智能应用列为可能影响人员配置的因素。美国人力资源机构Challenger统计，截至2026年7月，美国企业公告中明确将人工智能列为原因的裁员规模达11.27万人，占全部公告裁员的约24%。企业公告不是对技术净就业效应的完整测量，但表明这种调整已经进入实际经营决策。","changes":[],"sourceIds":["S03","S04","S05","S06"],"restoration":"撤回上一版对阿里巴巴80%、Salesforce约9000→5000及甲骨文16.2→14.1万的删减。保留“中国案例在前、海外对照在后”的原有布局；出处与因果口径单独校注，正文不再换成泛泛而谈。","previousChanged":true,"chinaAnchors":["阿里巴巴"],"numbers":["80%","9000","5000","2026","16.2","14.1","13%","2026","7","11.27","24%"],"suggested":"【客服与后台运营】阿里巴巴智能客服体系对标准化咨询问题解决率可达80%以上，平台人工客服规模收缩，人力更多保留用于复杂投诉、VIP 等高价值服务场景。美国Salesforce 将全球客户支持团队由约9000 人缩减至5000 人，人工智能客服Agentforce 承担约一半客户交互量。甲骨文2026 财年员工由16.2 万人降至14.1 万人，降幅约13%；其监管文件明确提及，全业务线部署人工智能已经、并可能继续带来人员缩减。美国人力资源机构Challenger 统计，截至2026 年7 月，美国企业公告中明确将AI 列为原因的裁员规模达11.27 万人，占全部公告裁员的24%。"},{"id":15,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"【金融柜面与行政流程】中国银行业协会数据显示，国内银行网点在2020 年达到22.7 万个的峰值后持续收缩，2024 年行业机构估算约为19 万个，银行业离柜业务率长期维持90%以上。机器人流程自动化在财务、人力资源、供应链领域调研应用率超过25%。","previous":"【金融柜面与行政流程】线上银行和流程自动化把相当一部分标准化业务从柜面转到系统，财务、人力资源和供应链中的重复流程，也逐步交由软件处理。这些变化早于本轮大模型发展，人工智能则进一步拓展了能够自动处理的任务范围。","changes":[],"sourceIds":["S07","S08"],"restoration":"撤回整段概括化处理。恢复中国银行网点22.7万、约19万、离柜90%以上与RPA25%以上，完整保留国内论据。两种网点数是否同口径，是待核事项，而不是删除数据的理由。","previousChanged":true,"chinaAnchors":["中国","国内"],"numbers":["2020","22.7","2024","19","90%","25%"],"suggested":"【金融柜面与行政流程】中国银行业协会数据显示，国内银行网点在2020 年达到22.7 万个的峰值后持续收缩，2024 年行业机构估算约为19 万个，银行业离柜业务率长期维持90%以上。机器人流程自动化在财务、人力资源、供应链领域调研应用率超过25%。"},{"id":16,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"【制造业产线】美的集团部分自有工厂2024 年机器人密度达到万人1200 台，部分黑灯车间实现高度自动化生产。富士康深圳厂区2010 年员工峰值约30 万人，2024 年行业估算约5 万人。国际机器人联合会（IFR）数据显示，2024 年中国新增工业机器人29.5 万台，占全球新增安装量54%，国内工业机器人保有量突破200 万台。","previous":"【制造业产线】制造业自动化仍在推进，部分“黑灯车间”已能以很少的人工干预组织生产。国际机器人联合会数据显示，2024年中国新增工业机器人29.5万台，占全球新增安装量的54%，国内工业机器人保有量突破200万台。机器人安装量本身不能换算为净失业人数，但说明越来越多生产任务正在改变对劳动的需求。","changes":[],"sourceIds":["S09","S10"],"restoration":"恢复美的每万人1200台、富士康深圳30万与5万人；IFR29.5万、54%和200万也保留。企业案例与行业总量各有作用，不用“黑灯车间正在发展”取代。","previousChanged":true,"chinaAnchors":["中国","国内","美的","富士康","深圳"],"numbers":["2024","1200","2010","30","2024","5","2024","29.5","54%","200"],"suggested":"【制造业产线】美的集团部分自有工厂2024 年机器人密度达到万人1200 台，部分黑灯车间实现高度自动化生产。富士康深圳厂区2010 年员工峰值约30 万人，2024 年行业估算约5 万人。国际机器人联合会（IFR）数据显示，2024 年中国新增工业机器人29.5 万台，占全球新增安装量54%，国内工业机器人保有量突破200 万台。"},{"id":17,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"【交通与出行服务】百度萝卜快跑2026 年第一季度完成320 万次全无人驾驶订单，3 月单周订单峰值超35 万次，截至4 月累计订单突破2200 万次；小马智行、文远知行、AutoX 等企业也已在广州、深圳、北京等地开展Robotaxi 商业化运营。","previous":"【交通与出行服务】百度披露，萝卜快跑2026年第一季度完成320万次全无人驾驶运营服务，3月单周峰值超过35万次，截至4月累计向公众提供的服务超过2200万次。人工智能正在从处理屏幕中的信息，扩展到道路等真实环境中的操作。","changes":[],"sourceIds":["S11"],"restoration":"恢复小马智行、文远知行、AutoX及广州、深圳、北京等原有国内场景；320万、35万、2200万不删。“订单”口径问题进入来源栏，待作者依据发布文本决定。","previousChanged":true,"chinaAnchors":["深圳","百度","萝卜快跑","小马智行","文远知行","AutoX"],"numbers":["2026","320","3","35","4","2200"],"suggested":"【交通与出行服务】百度萝卜快跑2026 年第一季度完成320 万次全无人驾驶订单，3 月单周订单峰值超35 万次，截至4 月累计订单突破2200 万次；小马智行、文远知行、AutoX 等企业也已在广州、深圳、北京等地开展Robotaxi 商业化运营。"},{"id":18,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（二）行业渗透：后台到前台","original":"上述案例说明：人工智能替代遵循\"后台标准化任务→前台复杂场景\"的梯度渗透规律；企业更倾向于冻结招聘、自然流失、职能合并等\"软性缩编\"。这意味着，仅仅观察裁员公告会低估冲击，招聘数量、初级岗位占比、工资总额更能捕捉结构性压力。","previous":"上述案例说明，自动化正从后台标准化任务向更多前台场景延伸，但各行业的落地速度仍受安全、责任、成本和现场条件制约。企业既可能直接裁员，也可能通过冻结招聘、自然流失和职能合并进行“软性缩编”。这意味着，仅仅观察裁员公告会低估部分结构性压力，招聘数量、初级岗位占比、工资总额也应受到关注。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"上述案例说明：人工智能替代遵循\"后台标准化任务→前台复杂场景\"的梯度渗透规律；企业更倾向于冻结招聘、自然流失、职能合并等\"软性缩编\"。这意味着，仅仅观察裁员公告会低估冲击，招聘数量、初级岗位占比、工资总额更能捕捉结构性压力。"},{"id":19,"page":2,"heading":true,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"（三）承压群体：青年与女性","previous":"（三）承压群体：青年与女性","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（三）承压群体：青年与女性"},{"id":20,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"从年龄维度看，青年是\"入口收窄\"的最大受害者。斯坦福大学数字经济实验室发现，美国22-25岁劳动者在高替代风险职业中的就业水平相对下降16%，有经验劳动者总体保持稳定或继续增长；2026 年进一步披露，该年龄段在人工智能高暴露职业中的就业仍以年均3.8%速度收缩。企业的核心调整方式不是立即解雇老员工，而是减少招聘新人。","previous":"从年龄维度看，青年是“入口收窄”的主要承压者。斯坦福大学数字经济实验室2026年8月更新的研究显示，截至2026年6月，美国22—25岁劳动者在人工智能高暴露职业中的就业规模，比按照低暴露职业同龄人就业增速推算的水平低约19%，有经验者未出现相同缺口。差异主要通过减少招聘新人，而非增加解雇形成。研究将其视为早期描述性信号，而非人工智能的独立因果效应，同时尚未发现全经济范围的广泛就业下降。总量稳定与新人承压，并不矛盾。","changes":[],"sourceIds":["S14"],"restoration":"不直接用更新版19%覆盖原稿16%和3.8%。保留原稿两个时间点，先要求论文版本和基线明确，再由作者选择统计版本。","previousChanged":true,"chinaAnchors":[],"numbers":["22","25","16%","2026","3.8%"],"suggested":"从年龄维度看，青年是\"入口收窄\"的最大受害者。斯坦福大学数字经济实验室发现，美国22-25岁劳动者在高替代风险职业中的就业水平相对下降16%，有经验劳动者总体保持稳定或继续增长；2026 年进一步披露，该年龄段在人工智能高暴露职业中的就业仍以年均3.8%速度收缩。企业的核心调整方式不是立即解雇老员工，而是减少招聘新人。"},{"id":21,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"在国内，北大-智联报告揭示了大模型岗位经验门槛抬升的趋势，上海科技大学的研究进一步显示，岗位收缩主要集中于月薪5000-8000 元、有1-3 年经验的入门和中端劳动者。过去新人通过\"练手任务\"积累经验，现在企业直接将这些任务交给人工智能，剩余工作交给资深员工。月薪1.2 万元以上、承担架构设计、复杂协调的岗位反而较快恢复。","previous":"在国内，北大—智联报告揭示了大模型岗位经验门槛抬升的趋势，上海科技大学的研究进一步显示，招聘收缩较集中于月薪5000—8000元、有1—3年经验的入门和中端劳动者，而部分高薪资深岗位需求回暖。过去新人通过“练手任务”积累经验，现在这些任务可以交给人工智能，剩余工作交给资深员工。","changes":[],"sourceIds":["S01","S02"],"restoration":"恢复月薪1.2万元以上和架构设计、复杂协调等信息，与5000—8000元、1—3年形成具体对照。","previousChanged":true,"chinaAnchors":["国内","北大","智联","上海科技大学"],"numbers":["5000","8000","1","3","1.2"],"suggested":"在国内，北大-智联报告揭示了大模型岗位经验门槛抬升的趋势，上海科技大学的研究进一步显示，岗位收缩主要集中于月薪5000-8000 元、有1-3 年经验的入门和中端劳动者。过去新人通过\"练手任务\"积累经验，现在企业直接将这些任务交给人工智能，剩余工作交给资深员工。月薪1.2 万元以上、承担架构设计、复杂协调的岗位反而较快恢复。"},{"id":22,"page":2,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"人工智能首先挤压的不是职业顶端，而是职业入口。企业减少的往往不是最资深、最昂贵的岗位，而是原本用于训练新人、积累经验的职位，青年劳动者因此更难获得进入职业体系的第一张门票。","previous":"人工智能在一些行业首先挤压的不是职业顶端，而是职业入口。企业减少的往往不是最资深、最昂贵的岗位，而是原本用于训练新人、积累经验的职位，青年劳动者因此更难获得进入职业体系的第一张门票。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能首先挤压的不是职业顶端，而是职业入口。企业减少的往往不是最资深、最昂贵的岗位，而是原本用于训练新人、积累经验的职位，青年劳动者因此更难获得进入职业体系的第一张门票。"},{"id":23,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"从性别维度看，女性暴露度显著更高。国际劳工组织2025 年评估显示，最高暴露等级岗位中女性就业占比4.7%，接近男性2.4%的两倍，主因是女性更多集中于文书、行政和后台支持岗位。","previous":"从性别维度看，女性的职业暴露度更高。国际劳工组织2025年评估显示，全球女性就业中有4.7%处于最高暴露等级，男性对应比例为2.4%，主要与女性较多集中于文书、行政和后台支持岗位有关。暴露度并不等于最终失业概率，却提示了需要重点关注的人群。","changes":[{"id":"C002","paragraph":23,"start":34,"end":65,"before":"最高暴露等级岗位中女性就业占比4.7%，接近男性2.4%的两倍","after":"女性就业中有4.7%处于最高暴露等级，接近男性对应比例2.4%的两倍","reason":"4.7%和2.4%的分母分别是全部女性就业、全部男性就业，而非“最高暴露岗位内部”的男女构成。两个数字均保留，只订正分母；ILO发布方摘要已核对。","kind":"口径订正","impact":"保留原主张","sources":["S12"]}],"sourceIds":["S12"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2025","4.7%","2.4%"],"suggested":"从性别维度看，女性暴露度显著更高。国际劳工组织2025 年评估显示，女性就业中有4.7%处于最高暴露等级，接近男性对应比例2.4%的两倍，主因是女性更多集中于文书、行政和后台支持岗位。"},{"id":24,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（三）承压群体：青年与女性","original":"从实际影响看，隐性冲击比显性失业更普遍。许多劳动者即使未被裁，也经历起薪受压、招聘门槛提高、职责合并和转岗成本上升；年轻人和文职女性资产缓冲较少，还可能承担更多家庭照护责任。替代压力区应被理解为需要提前干预的范围，而非等其转化为失业人口后再救助。","previous":"从实际影响看，许多劳动者即使未被裁，也可能经历起薪受压、招聘门槛提高、职责合并和转岗成本上升。对于资产缓冲较少、又承担家庭照护责任的人，这类变化同样会改变生活安排。替代压力区应被理解为需要提前干预的范围，而非等其转化为失业人口后再救助。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"从实际影响看，隐性冲击比显性失业更普遍。许多劳动者即使未被裁，也经历起薪受压、招聘门槛提高、职责合并和转岗成本上升；年轻人和文职女性资产缓冲较少，还可能承担更多家庭照护责任。替代压力区应被理解为需要提前干预的范围，而非等其转化为失业人口后再救助。"},{"id":25,"page":3,"heading":true,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（四）未来趋势：总量与入口","original":"（四）未来趋势：总量与入口","previous":"（四）未来趋势：总量与入口","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（四）未来趋势：总量与入口"},{"id":26,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（四）未来趋势：总量与入口","original":"世界经济论坛2023 年版《未来就业报告》预计，2023-2027 年全球约9200 万个岗位被替代、1.7 亿个新增，净增约7800 万个；2025 年版更新预测，到2030 年技术将影响当前就业总量约五分之一的工作时间。","previous":"世界经济论坛2025年版《未来就业报告》预计，在技术、人口、经济和绿色转型等多重趋势共同作用下，2025—2030年全球可能新增约1.7亿个岗位，同时约9200万个岗位被替代，净增约7800万个。这是多种因素共同作用的预测，并非人工智能单一因素的就业净效应。","changes":[{"id":"C003","paragraph":26,"start":0,"end":112,"before":"世界经济论坛2023 年版《未来就业报告》预计，2023-2027 年全球约9200 万个岗位被替代、1.7 亿个新增，净增约7800 万个；2025 年版更新预测，到2030 年技术将影响当前就业总量约五分之一的工作时间。","after":"世界经济论坛2025年版《未来就业报告》预计，2025—2030年，在技术、人口、经济和绿色转型等多重趋势共同作用下，全球约9200万个岗位被替代、1.7亿个岗位新增，净增约7800万个；岗位创造与消失合计涉及当前就业总量的22%。","reason":"9200万、1.7亿、7800万均保留。发布方将这组数字归于2025年版、2025—2030年；22%指岗位创造与消失占现有就业的比例，不是“五分之一工作时间”。这是版本、时期和统计对象订正，不是用别的国家替换中国证据。","kind":"口径订正","impact":"保留原主张","sources":["S13"]}],"sourceIds":["S13"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2023","2023","2027","9200","1.7","7800","2025","2030"],"suggested":"世界经济论坛2025年版《未来就业报告》预计，2025—2030年，在技术、人口、经济和绿色转型等多重趋势共同作用下，全球约9200万个岗位被替代、1.7亿个岗位新增，净增约7800万个；岗位创造与消失合计涉及当前就业总量的22%。"},{"id":27,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（四）未来趋势：总量与入口","original":"岗位总量净增与个体转换困难并存，是理解未来趋势的关键。被压缩的是行政、录入、客服等入门岗位，新增的更多是复合技术、现场服务和高责任岗位，二者并非同一批劳动者可以无成本转换。青年和女性群体，恰恰是从被压缩端向新增端跨越时障碍最多的人群。","previous":"岗位总量净增与个体转换困难并存，是理解未来趋势的关键。行政、录入、客服等岗位被压缩，技术、现场服务和其他领域出现新机会，二者并非同一批劳动者可以无成本转换。总量上的一个新岗位，并不能自动补偿另一个人失去的职业入口。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"岗位总量净增与个体转换困难并存，是理解未来趋势的关键。被压缩的是行政、录入、客服等入门岗位，新增的更多是复合技术、现场服务和高责任岗位，二者并非同一批劳动者可以无成本转换。青年和女性群体，恰恰是从被压缩端向新增端跨越时障碍最多的人群。"},{"id":28,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（四）未来趋势：总量与入口","original":"人工智能正由文本处理扩展至多模态和机器人，岗位重组速度还会提高。传统机器从研发到普及通常需要数年，劳动者还有转行窗口；人工智能却可在几天或几周内复制已标准化的新任务，甚至新行业刚形成，其基础工作便再次被自动化。岗位总量即使净增，也不能假定每个失岗者都能及时获得新工作——这次转换可能更快、入口更少、技能追赶更难。","previous":"人工智能正由文本处理扩展至多模态和机器人，岗位重组还可能加快。软件能力一旦形成，复制和传播的速度可以远快于劳动者完成一次职业转换，尽管实际部署仍需要组织调整，进入物理世界还受设备与安全条件限制。岗位总量即使净增，也不能假定每个失岗者都能及时获得新工作——转换可能更快，入口可能更少，技能追赶可能更难。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能正由文本处理扩展至多模态和机器人，岗位重组速度还会提高。传统机器从研发到普及通常需要数年，劳动者还有转行窗口；人工智能却可在几天或几周内复制已标准化的新任务，甚至新行业刚形成，其基础工作便再次被自动化。岗位总量即使净增，也不能假定每个失岗者都能及时获得新工作——这次转换可能更快、入口更少、技能追赶更难。"},{"id":29,"page":3,"heading":false,"section":"一、人工智能对就业的冲击：入口收窄","subsection":"（四）未来趋势：总量与入口","original":"未来五年更可能出现的并非全面失业，而是\"总量尚可、入口收窄、分化加剧、转换提速\"。","previous":"从目前的信号看，比全面失业更需要提前应对的，是“总量尚可、入口收窄、分化加剧、转换提速”。政策不必等到所有职业都受到冲击，才开始为普通人的收入与发展机会作准备。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"未来五年更可能出现的并非全面失业，而是\"总量尚可、入口收窄、分化加剧、转换提速\"。"},{"id":30,"page":3,"heading":true,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"","original":"二、人工智能冲击对经济社会的长期影响","previous":"二、人工智能冲击对经济社会的长期影响","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"二、人工智能冲击对经济社会的长期影响"},{"id":31,"page":3,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"","original":"从历史来看，技术进步取代旧工作的同时，社会往往能创造出新岗位，而未导致持续性危机。但人工智能的迭代速度远超人类学习速度：标准化新任务可在数天或数周内被复制替代，甚至新行业刚形成，其基础工作便再次自动化。劳动者尚未完成转行，市场所需技能又已变迁。这意味着历史经验未必适用，以\"劳动为主要收入来源\"的经济制度可能陷入长期困境。","previous":"从历史来看，技术进步取代旧工作的同时，社会往往能够创造新岗位。但新岗位是否足够多，与失去旧岗位的人能否及时获得收入，是两个问题。人工智能真正提出的挑战，不只是就业总量会如何变化，而是当劳动参与生产的方式改变时，普通人通过什么渠道分享增长的成果。","changes":[{"id":"C004","paragraph":31,"start":161,"end":161,"before":"","after":"\n\n新岗位是否足够多，与失去原有岗位的人能否及时获得收入，是两个问题。即使就业总量仍然增长，也不能假定每个普通人都能无成本地转入新的职业。","reason":"补足从历史总量增长转向个体转型困难的桥梁，使制度主张不依赖“AI必然造成全面失业”这一尚未确立的预测。原段的技术迭代分析不删。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"从历史来看，技术进步取代旧工作的同时，社会往往能创造出新岗位，而未导致持续性危机。但人工智能的迭代速度远超人类学习速度：标准化新任务可在数天或数周内被复制替代，甚至新行业刚形成，其基础工作便再次自动化。劳动者尚未完成转行，市场所需技能又已变迁。这意味着历史经验未必适用，以\"劳动为主要收入来源\"的经济制度可能陷入长期困境。\n\n新岗位是否足够多，与失去原有岗位的人能否及时获得收入，是两个问题。即使就业总量仍然增长，也不能假定每个普通人都能无成本地转入新的职业。"},{"id":32,"page":3,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"","original":"这在中国已见端倪：技术快速进步伴随就业形势日趋严峻，职场空前内卷，部分年轻人对稳定生活失去信心，进而推迟乃至放弃婚育。人工智能的发展是巨大成就，但若不与分配改革同步，其引发的结构性重塑可能对社会形成全方位的负面冲击。","previous":"技术快速进步并不意味着就业压力、职场内卷和婚育推迟都由人工智能造成。我国原有的需求不足、分配失衡和养育负担，已经影响年轻人对稳定生活的信心。人工智能若不与分配改革同步，就可能在这些薄弱环节上进一步施加压力。","changes":[{"id":"C005","paragraph":32,"start":0,"end":9,"before":"这在中国已见端倪：","after":"这一风险在中国需要格外重视：","reason":"本段同时谈现有需求、劳动制度和婚育压力，不能把这些现象本身当作AI已造成长期制度困境的直接证据。保留中国情境，只把“已经证明”改成“需要应对”。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"这一风险在中国需要格外重视：技术快速进步伴随就业形势日趋严峻，职场空前内卷，部分年轻人对稳定生活失去信心，进而推迟乃至放弃婚育。人工智能的发展是巨大成就，但若不与分配改革同步，其引发的结构性重塑可能对社会形成全方位的负面冲击。"},{"id":33,"page":3,"heading":true,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"（一）强化消费能力与生产能力的背离","previous":"（一）强化消费能力与生产能力的背离","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（一）强化消费能力与生产能力的背离"},{"id":34,"page":3,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"我国当前最大的困境并非供给不够，而是需求不足；这不是因为民众不愿消费，而是有真实消费需求的人群收入低迷、预期不稳。超低生育率使市场前景黯淡，房地产泡沫破裂更导致财富感知缩水；与此同时，包括人工智能在内的技术进步大幅提升了效率，收益却主要流向高技能者与平台，普通劳动者因劳动收入受压而更加窘迫。","previous":"我国当前突出的困境，并非普遍的供给不足，而是许多领域生产能力充足，有真实消费需求的人群却收入有限、预期不稳。超低生育率使长期市场前景承压，房地产调整也影响家庭财富感知；与此同时，包括人工智能在内的技术进步提高了效率，若收益主要流向少数技术与资产持有者，普通劳动者的处境未必随之改善。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国当前最大的困境并非供给不够，而是需求不足；这不是因为民众不愿消费，而是有真实消费需求的人群收入低迷、预期不稳。超低生育率使市场前景黯淡，房地产泡沫破裂更导致财富感知缩水；与此同时，包括人工智能在内的技术进步大幅提升了效率，收益却主要流向高技能者与平台，普通劳动者因劳动收入受压而更加窘迫。"},{"id":35,"page":3,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"我国拥有全球规模最大、体系最为完备的制造业体系与超大规模建设能力，并成为全球科技创新的关键力量。真正的挑战在于如何将这种强大的供给能力转化为有效需求——瓶颈在于居民收入与稳定预期，而人工智能可能加剧这一断裂。","previous":"我国拥有全球规模最大、体系最为完备的制造业体系与超大规模建设能力，并成为全球科技创新的关键力量。真正的挑战在于如何将这种强大的供给能力转化为有效需求——瓶颈在于居民收入与稳定预期，而人工智能可能加剧这一断裂。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国拥有全球规模最大、体系最为完备的制造业体系与超大规模建设能力，并成为全球科技创新的关键力量。真正的挑战在于如何将这种强大的供给能力转化为有效需求——瓶颈在于居民收入与稳定预期，而人工智能可能加剧这一断裂。"},{"id":36,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"2025 年全国居民人均工资性收入占可支配收入的56.6%，劳动仍是普通人最主要的收入来源；恰恰在这一收入层级，月薪5000—8000 元的普通岗位正面临最集中的人工智能替代风险。企业利用人工智能降低成本后，若新增收益主要转化为利润和资产估值，而非工资、就业或公共收入，便会出现生产能力持续上升与居民消费能力不足并存的现象：产出越丰富，有效需求反而越低迷。","previous":"2025年全国居民人均工资性收入占可支配收入的56.6%，工资仍是居民收入的重要来源。企业利用人工智能降低成本后，若新增收益主要转化为利润和资产估值，而没有充分通过工资、就业、价格下降或公共收入惠及普通家庭，就可能出现生产能力持续上升与居民消费能力不足并存的现象。\n\n技术收益并非只能通过工资分享，商品降价、资产收益和公共服务改善，同样可以提高生活水平。但对于缺少资产、主要依靠工资生活的人，失去收入之后，即使某些商品更便宜，也未必负担得起住房、医疗和照护。生产能力提高扩大的是社会可以实现的生活空间，分配制度决定普通人能否真正进入这种生活。","changes":[{"id":"C006","paragraph":36,"start":122,"end":134,"before":"而非工资、就业或公共收入","after":"而非工资、就业、价格下降或公共收入","reason":"技术收益也能通过降价传递。这里只补一个收入之外的分享渠道；56.6%、5000—8000元及中国家庭的论证全部保留，不再用泛论替代这些数据。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S02","S15"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2025","56.6%","5000","8000"],"suggested":"2025 年全国居民人均工资性收入占可支配收入的56.6%，劳动仍是普通人最主要的收入来源；恰恰在这一收入层级，月薪5000—8000 元的普通岗位正面临最集中的人工智能替代风险。企业利用人工智能降低成本后，若新增收益主要转化为利润和资产估值，而非工资、就业、价格下降或公共收入，便会出现生产能力持续上升与居民消费能力不足并存的现象：产出越丰富，有效需求反而越低迷。"},{"id":37,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"分配结构决定需求结构。普通家庭增加收入后，边际消费倾向更高，收入多用于食品、住房改善、教育、照护、交通和文化消费；极高收入者增加同等收入，更多转化为储蓄和资产配置。收入越集中，奢侈品与少数高端市场或许繁荣，支撑多数人生活的日常行业却需求萎靡，企业继而依靠降价、裁员和延长工时控制成本，消费不足与收入下降相互强化，形成恶性循环。","previous":"分配结构影响需求结构。手头拮据的普通家庭增加收入后，通常有更多需要立即满足的食品、住房改善、教育、照护、交通和文化需求；收入充裕者增加同等收入，则更可能用于储蓄和资产配置。储蓄能够支持投资，但若企业本已因市场不足而不愿扩大生产，资金积累就未必转化为新的需求。此时，收入过度集中可能使少数高端市场繁荣，大众生活行业却需求低迷，消费不足与收入下降相互强化。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"分配结构决定需求结构。普通家庭增加收入后，边际消费倾向更高，收入多用于食品、住房改善、教育、照护、交通和文化消费；极高收入者增加同等收入，更多转化为储蓄和资产配置。收入越集中，奢侈品与少数高端市场或许繁荣，支撑多数人生活的日常行业却需求萎靡，企业继而依靠降价、裁员和延长工时控制成本，消费不足与收入下降相互强化，形成恶性循环。"},{"id":38,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"对外经济方面，出口是近年不多的亮点，但所有出口最终都是为了进口——我们向海外出售商品和服务，是为了换回国内需要的资源、技术、产品和资产，而非永久积累顺差数字。贸易顺差本质上是本国劳动成果换成尚未消费的对外购买力，也可以理解为本国民众\"享受不及付出\"的差额；若顺差长期扩大，生产成果却未充分转化为国内消费，人民便是付出多、享受少。以出口弥补内需不足，只是将循环不畅的压力向外转移，并未根治分配失衡。","previous":"对外经济方面，出口的最终意义，是换回国内需要的资源、技术、产品和资产，而非永久积累顺差数字。顺差可以用于积累境外资产和应对未来需要，不能简单视为损失；但如果顺差长期扩大，劳动者的付出却没有充分转化为当期或未来的生活改善，就值得反思。依靠出口弥补内需不足，不能代替国内收入分配的改善。","changes":[{"id":"C007","paragraph":38,"start":198,"end":198,"before":"","after":"\n\n顺差也可以形成支持未来消费和发展的境外资产；关键在于这些当期与未来的权益，最终能否转化为民众的生活改善。","reason":"原段正确强调贸易应服务生活，但“享受不及付出”容易被理解为所有顺差都是损失。补一句跨期资产作用，不删除“世界工蜂”和改善内需的原立场。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["国内"],"numbers":[],"suggested":"对外经济方面，出口是近年不多的亮点，但所有出口最终都是为了进口——我们向海外出售商品和服务，是为了换回国内需要的资源、技术、产品和资产，而非永久积累顺差数字。贸易顺差本质上是本国劳动成果换成尚未消费的对外购买力，也可以理解为本国民众\"享受不及付出\"的差额；若顺差长期扩大，生产成果却未充分转化为国内消费，人民便是付出多、享受少。以出口弥补内需不足，只是将循环不畅的压力向外转移，并未根治分配失衡。\n\n顺差也可以形成支持未来消费和发展的境外资产；关键在于这些当期与未来的权益，最终能否转化为民众的生活改善。"},{"id":39,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（一）强化消费能力与生产能力的背离","original":"我国民众没有过上与生产和创造能力相匹配的生活，是产出没有充分循环到真正有需求的家庭。人工智能越能扩大供给，越需要同步提高普通人的支付能力；否则商品更加丰富不会自动带来生活改善，只会加重企业争夺有限需求的内卷，最终连生产能力本身也将因缺乏市场而萎缩。","previous":"我国民众没有过上与生产和创造能力相匹配的生活，一个重要原因是产出没有充分循环到真正有需求的家庭。人工智能越能扩大供给，越需要同步提高普通人的支付能力；否则商品更加丰富不会自动带来生活改善，企业反而可能陷入争夺有限需求的内卷，生产能力本身也会因缺乏市场而受到抑制。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国民众没有过上与生产和创造能力相匹配的生活，是产出没有充分循环到真正有需求的家庭。人工智能越能扩大供给，越需要同步提高普通人的支付能力；否则商品更加丰富不会自动带来生活改善，只会加重企业争夺有限需求的内卷，最终连生产能力本身也将因缺乏市场而萎缩。"},{"id":40,"page":4,"heading":true,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"（二）加剧财富集聚，衍生政治风险","previous":"（二）加剧财富集聚，衍生政治风险","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（二）加剧财富集聚，衍生政治风险"},{"id":41,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"随着通信和交通的提升，企业竞争呈现出强者愈强的马太效应。过去企业做到本地最好即可生存，如今可能要在某个领域做到全网名列前茅才行，这导致市场份额和利润向头部企业集中，大量企业难以存活，而存活下来的企业中的员工因担心失业会更加内卷。","previous":"随着通信和交通的发展，一些市场呈现出强者愈强的马太效应。过去企业做到本地最好即可生存，如今在某些数字化领域，可能要做到全网名列前茅才行。市场份额和利润向头部集中，处于竞争边缘的企业和劳动者则承受更大压力。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"随着通信和交通的提升，企业竞争呈现出强者愈强的马太效应。过去企业做到本地最好即可生存，如今可能要在某个领域做到全网名列前茅才行，这导致市场份额和利润向头部企业集中，大量企业难以存活，而存活下来的企业中的员工因担心失业会更加内卷。"},{"id":42,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"人工智能更以高固定成本、低边际复制和数据网络效应，更可能将收入财富集中推向极致。目前的初级岗位不断萎缩，而需要深度经验的职位相对稳定，正是这样趋势的体现。掌握技术和资产的人获得持续增值，工资受压的人却要用储蓄承担住房、教育和医疗支出。收入差距由此转化为财富差距、代际差距和地区差距，社会流动越来越依赖家庭起点。","previous":"人工智能的高固定投入、低边际复制成本和平台优势，可能进一步推动收益集中。竞争和技术普及也可能降低成本、帮助中小企业，结果并非只有一个方向。但若掌握技术和资产的人持续获得增值，而工资受压的人只能消耗储蓄承担住房、教育和医疗支出，收入差距就会转化为财富差距、代际差距和地区差距，社会流动越来越依赖家庭起点。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能更以高固定成本、低边际复制和数据网络效应，更可能将收入财富集中推向极致。目前的初级岗位不断萎缩，而需要深度经验的职位相对稳定，正是这样趋势的体现。掌握技术和资产的人获得持续增值，工资受压的人却要用储蓄承担住房、教育和医疗支出。收入差距由此转化为财富差距、代际差距和地区差距，社会流动越来越依赖家庭起点。"},{"id":43,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"历史上的王朝周期说明，土地与财富向少数人集中到一定程度，原有秩序便无法调节，往往以政治动荡、内外冲突乃至秩序重置为结局。人工智能推动的集中更多来自技术、资本和网络效应，即使简单打散财富也可能很快重新形成，因此更需要建立可持续的制度性调节。","previous":"历史上的土地兼并与王朝兴衰一再提示：财富过度集中而又缺乏有效调节，会侵蚀社会稳定的基础。人工智能推动的集中更多来自技术、资本和网络效应，即使一次性打散财富，也可能很快重新形成。因此，所需的不是周期性的秩序重置，而是可持续的制度性调节。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"历史上的王朝周期说明，土地与财富向少数人集中到一定程度，原有秩序便无法调节，往往以政治动荡、内外冲突乃至秩序重置为结局。人工智能推动的集中更多来自技术、资本和网络效应，即使简单打散财富也可能很快重新形成，因此更需要建立可持续的制度性调节。"},{"id":44,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"这不仅是经济问题，也是政治和制度问题。收入高度集中会使少数奢侈市场繁荣、大众生活行业萎缩，社会逐渐呈现贫富隔绝、需求不足、流动受阻的\"拉美化\"倾向，既加剧普通人的失落，也降低富裕群体的安全感。","previous":"这不仅是经济问题，也是政治和制度问题。若大众生活行业需求不足，普通人上升通道收窄，财富差距又不断固化，社会就容易走向贫富隔绝，既加剧普通人的失落，也降低富裕群体的安全感。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"这不仅是经济问题，也是政治和制度问题。收入高度集中会使少数奢侈市场繁荣、大众生活行业萎缩，社会逐渐呈现贫富隔绝、需求不足、流动受阻的\"拉美化\"倾向，既加剧普通人的失落，也降低富裕群体的安全感。"},{"id":45,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"社会主义制度强调人民是国家主人、发展为了人民、成果由人民共享；如果生产能力增强却没有带来普遍生活改善，就会削弱共同富裕的现实基础和制度认同。","previous":"社会主义制度强调人民是国家主人、发展为了人民、成果由人民共享；如果生产能力增强却没有带来普遍生活改善，就会削弱共同富裕的现实基础和制度认同。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"社会主义制度强调人民是国家主人、发展为了人民、成果由人民共享；如果生产能力增强却没有带来普遍生活改善，就会削弱共同富裕的现实基础和制度认同。"},{"id":46,"page":4,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（二）加剧财富集聚，衍生政治风险","original":"反过来看，这也正是社会主义制度能够体现优越性的领域。我国有统一市场、公共基础设施、数字支付和较强组织能力，可以用公开规则把宏观效率与微观分配连接起来，防止技术优势演化为少数人占有新增财富、多数人失去需求能力的局面，使公平成为长期效率和社会稳定的条件。","previous":"反过来看，这也正是社会主义制度能够体现优越性的领域。我国有统一市场、公共基础设施、数字支付和较强组织能力，可以用公开规则把宏观效率与微观分配连接起来，防止技术优势演化为少数人占有新增财富、多数人失去需求能力的局面，使公平成为长期效率和社会稳定的条件。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["我国"],"numbers":[],"suggested":"反过来看，这也正是社会主义制度能够体现优越性的领域。我国有统一市场、公共基础设施、数字支付和较强组织能力，可以用公开规则把宏观效率与微观分配连接起来，防止技术优势演化为少数人占有新增财富、多数人失去需求能力的局面，使公平成为长期效率和社会稳定的条件。"},{"id":47,"page":5,"heading":true,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"（三）恶化超低生育率危机","previous":"（三）恶化超低生育率危机","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（三）恶化超低生育率危机"},{"id":48,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"超低生育率是我国面临的最大危机。根据国家统计局数据，2025 年出生人口降至792 万，较2016年阶段性高点的1786 万，不到十年降幅高达55.7%。《育娲人口智库：中国百年历史人口报告2026》推算，这一规模仅为清末民初的一半左右，不到1963 年出生高峰的1/4。而人工智能的发展若不与分配改革同步，则会进一步强化这一危机。","previous":"超低生育率是我国面临的最大危机。国家统计局数据显示，2025年出生人口降至792万，与2016年的阶段性高点相比，已减少一半以上。人工智能若不与分配改革同步，还可能通过收入、时间和预期的变化，进一步强化这一危机。","changes":[],"sourceIds":["S16","S17"],"restoration":"恢复2016年1786万、降幅55.7%与育娲历史尺度比较；不再只写“减少一半以上”。精确数字和长时段对照是本段论证的一部分。","previousChanged":true,"chinaAnchors":["中国","我国","育娲","国家统计局"],"numbers":["2025","792","2016","1786","55.7%","2026","1963","1","4"],"suggested":"超低生育率是我国面临的最大危机。根据国家统计局数据，2025 年出生人口降至792 万，较2016年阶段性高点的1786 万，不到十年降幅高达55.7%。《育娲人口智库：中国百年历史人口报告2026》推算，这一规模仅为清末民初的一半左右，不到1963 年出生高峰的1/4。而人工智能的发展若不与分配改革同步，则会进一步强化这一危机。"},{"id":49,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"人工智能首先压缩的是职业入口。文档处理、数据录入、基础编程和标准化沟通看似技术含量不高，却是年轻人理解组织规则、建立责任信用和积累隐性经验的必要环节。企业大幅收缩这些岗位，造成应届生既无企业要求的经验，也无法获得第一份积累经验的工作，传统职业训练链条由此断裂。","previous":"人工智能在一些行业首先压缩的是职业入口。文档处理、数据录入、基础编程和标准化沟通看似技术含量不高，却往往也是年轻人理解组织规则、建立责任信用和积累隐性经验的环节。企业大幅收缩这些岗位，可能使应届生既无企业要求的经验，也无法获得第一份积累经验的工作，传统职业训练链条由此受到冲击。\n\n对一家企业而言，用人工智能完成基础任务，再招聘少数资深人员，可能是合理选择。但如果所有企业都不愿培养新人，未来的资深人员从哪里来？节省了当期用工成本，不等于培养人的成本已经消失。原来附着在初级岗位中的训练功能，需要通过新的方式承接，而不能只要求年轻人在没有入口的情况下先积累经验。","changes":[{"id":"C008","paragraph":49,"start":130,"end":130,"before":"","after":"\n\n对一家企业而言，省去新人培养、直接使用人工智能和资深员工，可能是合理选择。但若大家都不培养新人，未来的资深员工从哪里来？节省当期用工，不等于培养人的成本已经消失。","reason":"这是全文关键断点：从企业节约初级岗位，到社会仍需人才培养。用原文“职业入口”的语言补三句，并为后文真实岗位训练提供依据；不要求保留无价值任务。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能首先压缩的是职业入口。文档处理、数据录入、基础编程和标准化沟通看似技术含量不高，却是年轻人理解组织规则、建立责任信用和积累隐性经验的必要环节。企业大幅收缩这些岗位，造成应届生既无企业要求的经验，也无法获得第一份积累经验的工作，传统职业训练链条由此断裂。\n\n对一家企业而言，省去新人培养、直接使用人工智能和资深员工，可能是合理选择。但若大家都不培养新人，未来的资深员工从哪里来？节省当期用工，不等于培养人的成本已经消失。"},{"id":50,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"与此同时，企业可能一方面减少招聘，另一方面把更多职责合并给现有员工。2026 年上半年全国企业就业人员周平均工作时间仍达48.2 小时，高于法定标准。结果是部分人无工可做，另一部分人无暇生活，技术节省的时间没有返还给劳动者。","previous":"与此同时，企业可能一方面减少招聘，另一方面把更多职责合并给现有员工。国家统计局2026年7月发布的数据显示，全国企业就业人员周平均工作时间为48.2小时。部分人无工可做，另一部分人无暇生活，技术节省的时间没有充分返还给劳动者。","changes":[],"sourceIds":["S18"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2026","48.2"],"suggested":"与此同时，企业可能一方面减少招聘，另一方面把更多职责合并给现有员工。2026 年上半年全国企业就业人员周平均工作时间仍达48.2 小时，高于法定标准。结果是部分人无工可做，另一部分人无暇生活，技术节省的时间没有返还给劳动者。"},{"id":51,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"没有工作的人因缺少稳定收入不敢养育孩子；有工作的人因岗位不安全、劳动时间过长也无力照护；女性又同时承受高暴露文职岗位风险和较多家庭照护责任。当年轻人对努力能否换来稳定生活产生怀疑后，消费、购房、结婚和生育都会延后。技术冲击遂从就业市场传导到家庭形成，消费和生育同时受到压制。","previous":"没有工作的人因缺少稳定收入不敢养育孩子；有工作的人因岗位不安全、劳动时间过长也无力照护；女性又同时承受高暴露文职岗位风险和较多家庭照护责任。当年轻人对努力能否换来稳定生活产生怀疑后，消费、购房、结婚和生育都会延后。技术冲击遂从就业市场传导到家庭形成，消费和生育同时受到压制。\n\n养育孩子又是一项持续十几年乃至更久的承诺。家庭关心的不只是今年能收入多少，还包括未来失去工作时能否继续承担住房、教育和照护。一笔收入可以缓解眼前的困难，一项可信的长期制度才能改变家庭对未来风险的判断。","changes":[{"id":"C009","paragraph":51,"start":137,"end":137,"before":"","after":"\n\n养育又是一项持续十几年乃至更久的承诺。家庭不只要看今年收入多少，还要看未来失去工作时能否继续承担这份责任。因此，稳定的长期支持，比一次性的收入增加更能改变家庭对风险的判断。","reason":"说明为何收入保障需要可预期、为何养育不能只靠临时补贴。属于对家庭长期决策的机制分析，不冒充已测得的政策效果。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"没有工作的人因缺少稳定收入不敢养育孩子；有工作的人因岗位不安全、劳动时间过长也无力照护；女性又同时承受高暴露文职岗位风险和较多家庭照护责任。当年轻人对努力能否换来稳定生活产生怀疑后，消费、购房、结婚和生育都会延后。技术冲击遂从就业市场传导到家庭形成，消费和生育同时受到压制。\n\n养育又是一项持续十几年乃至更久的承诺。家庭不只要看今年收入多少，还要看未来失去工作时能否继续承担这份责任。因此，稳定的长期支持，比一次性的收入增加更能改变家庭对风险的判断。"},{"id":52,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"人口萎缩会压低未来需求和投资预期。孩子减少，意味着住房、教育、消费和基础设施的预期使用者减少，企业因看不到市场而减少投资；但若低生育率不能逆转，人口将面临加速萎缩。在这一趋势下，规模效应趋于弱化，需求与供给的匹配效率会下降，创新能力会大打折扣，人均GDP 增速相对人口稳定情形会更低；与此同时，许多医院、学校、商场、小区、公共设施都将难以为继，整体效率乃至民众生活质量会随之下降。人口萎缩削弱的是市场规模、专业分工和社会复杂度——若人口只有现在的十分之一，理发、快递等日常服务或可按比例存在，高铁、航天、大型科研平台和完整产业链等依赖规模与复杂协作的体系却难以维持。","previous":"持续的人口萎缩还会影响未来需求和投资预期。孩子减少，意味着未来许多住房、教育、消费和基础设施的使用者减少，企业可能因看不到市场而减少投资。人口收缩不是所有经济困难的唯一原因，但长期低生育会削弱规模效应，增加维持公共服务和复杂分工的成本。人口若只剩现在的十分之一，理发、快递等日常服务或可在一定条件下按比例存在，高铁、航天、大型科研平台和完整产业链等体系却不能简单同比缩小，原有生活方式的维持会更加困难。","changes":[],"sourceIds":["S19"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人口萎缩会压低未来需求和投资预期。孩子减少，意味着住房、教育、消费和基础设施的预期使用者减少，企业因看不到市场而减少投资；但若低生育率不能逆转，人口将面临加速萎缩。在这一趋势下，规模效应趋于弱化，需求与供给的匹配效率会下降，创新能力会大打折扣，人均GDP 增速相对人口稳定情形会更低；与此同时，许多医院、学校、商场、小区、公共设施都将难以为继，整体效率乃至民众生活质量会随之下降。人口萎缩削弱的是市场规模、专业分工和社会复杂度——若人口只有现在的十分之一，理发、快递等日常服务或可按比例存在，高铁、航天、大型科研平台和完整产业链等依赖规模与复杂协作的体系却难以维持。"},{"id":53,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（三）恶化超低生育率危机","original":"生育率能否回升至人口更替水平，直接影响社会经济可持续发展、民众生活质量与国家综合国力。庞大人口既是市场纵深、人才储备、税基与国防动员能力的基础，也是语言、习俗、知识、家庭记忆与价值观念代际接续的载体。就中华文明来看，长期低生育率事关民族能否生生不息、文明能否绵延不绝的根本性问题。","previous":"生育率能否回升至人口更替水平，直接影响社会经济可持续发展、民众生活质量与国家综合国力。庞大人口既是市场纵深、人才储备、税基与国防动员能力的基础，也是语言、习俗、知识、家庭记忆与价值观念代际接续的载体。就中华文明来看，长期低生育率事关民族能否生生不息、文明能否绵延不绝的根本性问题。","changes":[],"sourceIds":["S19"],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"生育率能否回升至人口更替水平，直接影响社会经济可持续发展、民众生活质量与国家综合国力。庞大人口既是市场纵深、人才储备、税基与国防动员能力的基础，也是语言、习俗、知识、家庭记忆与价值观念代际接续的载体。就中华文明来看，长期低生育率事关民族能否生生不息、文明能否绵延不绝的根本性问题。"},{"id":54,"page":5,"heading":true,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（四）消解人的价值，侵蚀社会认同","original":"（四）消解人的价值，侵蚀社会认同","previous":"（四）消解人的价值，侵蚀社会认同","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（四）消解人的价值，侵蚀社会认同"},{"id":55,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（四）消解人的价值，侵蚀社会认同","original":"生育本质上是希望的投射。年轻人不愿生育，反映的是对未来的普遍焦虑——当努力难以换来稳定生活，职业入口持续收窄，劳动时间过长而收入预期不稳，组建家庭和养育后代便从自然选择变为高风险决策。","previous":"生育在很大程度上是希望的投射。对不少年轻人而言，当努力难以换来稳定生活，职业入口持续收窄，劳动时间过长而收入预期不稳，组建家庭和养育后代便从可以承担的生活选择，变为难以承受的长期风险。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"生育本质上是希望的投射。年轻人不愿生育，反映的是对未来的普遍焦虑——当努力难以换来稳定生活，职业入口持续收窄，劳动时间过长而收入预期不稳，组建家庭和养育后代便从自然选择变为高风险决策。"},{"id":56,"page":5,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（四）消解人的价值，侵蚀社会认同","original":"在现有制度下，工作同时提供收入、身份、尊严和被需要的感觉；当收入几乎完全依附雇佣关系时，一个人失去工作，很容易把\"暂时不被企业使用\"理解为\"自己没有价值\"。若越来越多人感到自己随时可能被抛弃，技术进步便被体验为\"越发展越痛苦\"，社会对未来的信心和对共同体的认同也随之侵蚀。","previous":"在现有制度下，工作同时提供收入、身份、尊严和被需要的感觉；当收入几乎完全依附雇佣关系时，一个人失去工作，很容易把“暂时不被企业使用”理解为“自己没有价值”。若越来越多人感到自己随时可能被抛弃，技术进步便被体验为“越发展越痛苦”，社会对未来的信心和对共同体的认同也随之侵蚀。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"在现有制度下，工作同时提供收入、身份、尊严和被需要的感觉；当收入几乎完全依附雇佣关系时，一个人失去工作，很容易把\"暂时不被企业使用\"理解为\"自己没有价值\"。若越来越多人感到自己随时可能被抛弃，技术进步便被体验为\"越发展越痛苦\"，社会对未来的信心和对共同体的认同也随之侵蚀。"},{"id":57,"page":6,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（四）消解人的价值，侵蚀社会认同","original":"把技术进步的成果普遍转化为体面生活，不只是扩大内需的经济政策，也是巩固国家认同、避免社会分化、维护长期政治稳定的基础工程。保障民众分享共同生产能力，并不是在劳动之外额外施舍一种价值，而是承认人的价值原本就不止于工资。人民作为国家主人和共同体成员，应当在有无岗位、处于人生何种阶段时，都拥有基本的经济参与权和生活尊严。","previous":"把技术进步的成果普遍转化为体面生活，不只是扩大内需的经济政策，也是巩固国家认同、避免社会分化、维护长期政治稳定的基础工程。保障民众分享共同生产能力，并不是在劳动之外额外施舍一种价值，而是承认人的价值原本就不止于工资。人民作为国家主人和共同体成员，应当在有无岗位、处于人生何种阶段时，都拥有基本的经济参与权和生活尊严。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"把技术进步的成果普遍转化为体面生活，不只是扩大内需的经济政策，也是巩固国家认同、避免社会分化、维护长期政治稳定的基础工程。保障民众分享共同生产能力，并不是在劳动之外额外施舍一种价值，而是承认人的价值原本就不止于工资。人民作为国家主人和共同体成员，应当在有无岗位、处于人生何种阶段时，都拥有基本的经济参与权和生活尊严。"},{"id":58,"page":6,"heading":false,"section":"二、人工智能冲击对经济社会的长期影响","subsection":"（四）消解人的价值，侵蚀社会认同","original":"为了维持形式上的就业而制造大量低效工作，并非出路。这不过是把机器节省的时间重新浪费掉，让一部分人看起来有事可做，却不能真正增加生活价值。技术进步本来应使人有更多时间陪伴、养育、学习、创造和参与社会，而不是让失业者失去尊严、在职者更加忙碌。若效率越高，普通人反而越担心失业、越不敢消费和生育，民众便会把共同生产能力的增强理解为与自己无关，社会认同随之瓦解。制度需要证明：机器越能干，人的生活越有保障，人的价值越能充分展开。","previous":"为了维持形式上的就业而制造大量低效工作，并非出路。这不过是把机器节省的时间重新浪费掉，让一部分人看起来有事可做，却不能真正增加生活价值。技术进步本来应使人有更多时间陪伴、养育、学习、创造和参与社会，而不是让失业者失去尊严、在职者更加忙碌。若效率越高，普通人反而越担心失业、越不敢消费和生育，民众便会把共同生产能力的增强理解为与自己无关，社会认同随之瓦解。制度需要证明：机器越能干，人的生活越有保障，人的价值越能充分展开。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"为了维持形式上的就业而制造大量低效工作，并非出路。这不过是把机器节省的时间重新浪费掉，让一部分人看起来有事可做，却不能真正增加生活价值。技术进步本来应使人有更多时间陪伴、养育、学习、创造和参与社会，而不是让失业者失去尊严、在职者更加忙碌。若效率越高，普通人反而越担心失业、越不敢消费和生育，民众便会把共同生产能力的增强理解为与自己无关，社会认同随之瓦解。制度需要证明：机器越能干，人的生活越有保障，人的价值越能充分展开。"},{"id":59,"page":6,"heading":true,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"","original":"三、人工智能迫使我们更深刻认识发展的底层逻辑","previous":"三、人工智能迫使我们更深刻认识发展的底层逻辑","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"三、人工智能迫使我们更深刻认识发展的底层逻辑"},{"id":60,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"","original":"人工智能并未违背人的价值、人口、劳动、效率和分配的基本规律，而是将这些问题推至极端情形，迫使我们穿透习惯性观念，回答更底层的逻辑：经济为何发展，技术为谁服务，人民如何分享共同创造的社会产出。","previous":"人工智能并未违背人的价值、人口、劳动、效率和分配的基本规律，而是将这些问题推至极端情形，迫使我们穿透习惯性观念，回答更底层的逻辑：经济为何发展，技术为谁服务，人民如何分享共同创造的社会产出。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"人工智能并未违背人的价值、人口、劳动、效率和分配的基本规律，而是将这些问题推至极端情形，迫使我们穿透习惯性观念，回答更底层的逻辑：经济为何发展，技术为谁服务，人民如何分享共同创造的社会产出。"},{"id":61,"page":6,"heading":true,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"（一）人是目的，而非手段","previous":"（一）人是目的，而非手段","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（一）人是目的，而非手段"},{"id":62,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"人工智能取代工作，让很多人觉得人的价值被消解，实际上是将手段错当成了目的。工作本身是人类为获取生存、繁衍与消费满足所对应的生活效用，所付出的代价；在生活水准不变的前提下，这一代价越低越好。倘若仅因劳动需求收缩便判定人的价值随之丧失，从社会整体来看无疑是本末倒置。","previous":"人工智能取代工作，让很多人觉得人的价值被消解，实际上是将手段错当成了目的。就满足既定生活需要所必需的劳动而言，工作是获得生活效用所付出的代价；在生活水准不变的前提下，这一代价越低越好。劳动当然也可以带来创造、成就和交往，但不能仅因市场对某类劳动的需求收缩，就判定从事这种劳动的人失去了价值。","changes":[{"id":"C010","paragraph":62,"start":37,"end":72,"before":"工作本身是人类为获取生存、繁衍与消费满足所对应的生活效用，所付出的代价","after":"就满足既定生活需要所必需的劳动而言，工作是获得生活效用所付出的代价","reason":"“工作本身只是代价”与前文工作带来身份、尊严、创造的描述有张力。限定为必要劳动，保留降低劳动代价的核心判断。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能取代工作，让很多人觉得人的价值被消解，实际上是将手段错当成了目的。就满足既定生活需要所必需的劳动而言，工作是获得生活效用所付出的代价；在生活水准不变的前提下，这一代价越低越好。倘若仅因劳动需求收缩便判定人的价值随之丧失，从社会整体来看无疑是本末倒置。"},{"id":63,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"洗衣机让人少洗衣，汽车让人少走路，人工智能让人少做重复脑力劳动——都是同一条文明进步的道路。机器能够完成更多工作，就社会整体而言，不是人变得多余，而应意味着人可以更少地工作，获得更多闲暇和更高收入。伴随技术日趋成熟，过去需要一小时完成的任务，今后借助技术一分钟便可实现，由此释放出的时间恰恰是文明进步的成果，公共政策应更多着眼于单位必要劳动所能创造的生活效用、民众实际可支配闲暇时长与家庭照护保障质量，而非依靠延长工时去维系表面上的充分就业。","previous":"洗衣机让人少洗衣，汽车让人少走路，人工智能让人少做重复脑力劳动——都是同一条文明进步的道路。机器能够完成更多工作，就社会整体而言，不是人变得多余，而应意味着人可以更少地工作，获得更多闲暇和更高收入。伴随技术日趋成熟，过去需要一小时完成的任务，今后借助技术一分钟便可实现，由此释放出的时间恰恰是文明进步的成果，公共政策应更多着眼于单位必要劳动所能创造的生活效用、民众实际可支配闲暇时长与家庭照护保障质量，而非依靠延长工时去维系表面上的充分就业。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"洗衣机让人少洗衣，汽车让人少走路，人工智能让人少做重复脑力劳动——都是同一条文明进步的道路。机器能够完成更多工作，就社会整体而言，不是人变得多余，而应意味着人可以更少地工作，获得更多闲暇和更高收入。伴随技术日趋成熟，过去需要一小时完成的任务，今后借助技术一分钟便可实现，由此释放出的时间恰恰是文明进步的成果，公共政策应更多着眼于单位必要劳动所能创造的生活效用、民众实际可支配闲暇时长与家庭照护保障质量，而非依靠延长工时去维系表面上的充分就业。"},{"id":64,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"即便从纯粹经济角度看，人的价值也远不止于劳动供给，更在于消费需求。所有工作的目的最终都是为了满足消费需求，消费是比供给更为底层的驱动力。当前经济困境的核心，并非生产不足，而是有效需求匮乏——商品生产出来却卖不出去。这在中国尤为突出，经济发展的短板在于需求端而非生产端；真正需要担心的不是有人\"不劳而获\"，而是普通群体是否拥有足够收入形成有效消费、分享发展成果。","previous":"即便从纯粹经济角度看，人的作用也远不止于劳动供给，还在于消费需求。生产最终是为了满足人的需要，不能把生产本身当作目的。对于产出充足而有效需求不足的领域，首先需要担心的，不是普通人是否获得了工资之外的收入，而是他们是否拥有足够的支付能力，能够分享发展成果。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"即便从纯粹经济角度看，人的价值也远不止于劳动供给，更在于消费需求。所有工作的目的最终都是为了满足消费需求，消费是比供给更为底层的驱动力。当前经济困境的核心，并非生产不足，而是有效需求匮乏——商品生产出来却卖不出去。这在中国尤为突出，经济发展的短板在于需求端而非生产端；真正需要担心的不是有人\"不劳而获\"，而是普通群体是否拥有足够收入形成有效消费、分享发展成果。"},{"id":65,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"人工智能归根结底是为人类服务，但服务什么、如何服务，取决于人群的消费实践。自然界从来不缺乏强大的力量，真正需要的是服务于人类、满足人类需求、实现人类愿望的能力。未来人工智能到底是应该去制造更完美的电子产品，还是提供更优质的旅游服务，抑或创作更动人的艺术品，都需要靠人类的消费来引导。在这个意义上，消费本身就是对生产体系和技术方向发出最为具体的指令。","previous":"人工智能归根结底是为人类服务，但服务什么、如何服务，取决于人群的消费实践。自然界从来不缺乏强大的力量，真正需要的是服务于人类、满足人类需求、实现人类愿望的能力。未来人工智能到底是应该去制造更完美的电子产品，还是提供更优质的旅游服务，抑或创作更动人的艺术品，都需要靠人类的消费来引导。在这个意义上，消费本身就是对生产体系和技术方向发出最为具体的指令。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["美的"],"numbers":[],"suggested":"人工智能归根结底是为人类服务，但服务什么、如何服务，取决于人群的消费实践。自然界从来不缺乏强大的力量，真正需要的是服务于人类、满足人类需求、实现人类愿望的能力。未来人工智能到底是应该去制造更完美的电子产品，还是提供更优质的旅游服务，抑或创作更动人的艺术品，都需要靠人类的消费来引导。在这个意义上，消费本身就是对生产体系和技术方向发出最为具体的指令。"},{"id":66,"page":6,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"从更底层的逻辑看，人不只是经济发展的工具，更是基因多样性的承载者、文化与语言的传承者，乃至孕育杰出人才的人口基数的支撑者，还是亲友的陪伴者和他们人生意义的加持者。归根结底，人是目的，而非手段。人工智能不是要求我们否定劳动，而是迫使我们更深刻理解：劳动价格只能衡量市场需要，不能衡量一个生命的全部价值。","previous":"从更底层的逻辑看，人不只是经济发展的工具，更是基因多样性的承载者、文化与语言的传承者，乃至孕育杰出人才的人口基数的支撑者，还是亲友的陪伴者和他们人生意义的加持者。归根结底，人是目的，而非手段。人工智能不是要求我们否定劳动，而是迫使我们更深刻理解：劳动价格只能衡量市场需要，不能衡量一个生命的全部价值。\n\n但人的价值也不能再用消费多少、能否贡献数据或将来缴纳多少税来衡量。一个暂时没有工作、不能形成高经济回报的人，同样值得获得基本生活保障。支持人的发展，首先因为人的生活本身值得改善；扩大消费、促进创新和增强国力，是与之相联系的社会收益，而非一个人获得尊重的先决条件。","changes":[{"id":"C011","paragraph":66,"start":150,"end":150,"before":"","after":"\n\n人的价值也不能再用消费多少、能否贡献数据来衡量。扩大需求、促进创新和增强国力，是改善人的生活所带来的社会收益，而不应成为一个人获得基本保障的先决条件。","reason":"本节由劳动价值转向消费和人口价值，容易把人从劳动工具重新变为消费工具。补清价值原则与经济收益的先后关系；不删除人口、文化和亲情的原有论证。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"从更底层的逻辑看，人不只是经济发展的工具，更是基因多样性的承载者、文化与语言的传承者，乃至孕育杰出人才的人口基数的支撑者，还是亲友的陪伴者和他们人生意义的加持者。归根结底，人是目的，而非手段。人工智能不是要求我们否定劳动，而是迫使我们更深刻理解：劳动价格只能衡量市场需要，不能衡量一个生命的全部价值。\n\n人的价值也不能再用消费多少、能否贡献数据来衡量。扩大需求、促进创新和增强国力，是改善人的生活所带来的社会收益，而不应成为一个人获得基本保障的先决条件。"},{"id":67,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"这也要求重新审视教育的意义。人工智能不会使教育失去意义，而会把重点从记忆标准答案和重复程序，转向认知框架、好奇心、审美、责任、判断、合作与亲密关系能力。应减少可被机器替代的训练，把时间还给真实项目和社会生活。","previous":"这也要求重新审视教育的意义。人工智能不会使教育失去意义，而会使认知框架、好奇心、审美、责任、判断、合作与亲密关系能力更加重要。应在扎实的基础学习之上减少机械重复，把更多时间还给真实项目和社会生活，而不是把基础知识本身一并省去。","changes":[{"id":"C012","paragraph":67,"start":76,"end":88,"before":"应减少可被机器替代的训练","after":"应在扎实的基础学习之上减少机械重复的训练","reason":"能被机器处理的基础知识仍可能是人的判断力所需。只限定“应减少”的训练类型，避免被读成跳过基础教育；保留真实项目与社会生活的方向。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"这也要求重新审视教育的意义。人工智能不会使教育失去意义，而会把重点从记忆标准答案和重复程序，转向认知框架、好奇心、审美、责任、判断、合作与亲密关系能力。应在扎实的基础学习之上减少机械重复的训练，把时间还给真实项目和社会生活。"},{"id":68,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（一）人是目的，而非手段","original":"因此，真正意义上的投资于人，不应局限于开展职业技能培训、迫使劳动者追赶机器，而应推动人与人工智能形成良性协同，拓展人的发展边界与选择空间，助力人的全面发展，使技术进步真正服务于人的多元需求。这需要落实为对居民收入水平、可支配闲暇时间、家庭照护支持的制度性保障，既是应对技术变革结构性冲击的现实要求，也是守护人类文明赓续、维系社会内在活力的根本基石。","previous":"因此，真正意义上的投资于人，不应局限于开展职业技能培训、迫使劳动者追赶机器，而应推动人与人工智能形成良性协同，拓展人的发展边界与选择空间，助力人的全面发展，使技术进步真正服务于人的多元需求。这需要落实为对居民收入水平、可支配闲暇时间、家庭照护支持的制度性保障，既是应对技术变革结构性冲击的现实要求，也是守护人类文明赓续、维系社会内在活力的根本基石。\n\n社会不能只奖励已经形成、能够立即出售的能力，却把这些能力形成之前的成本和风险，主要留给个人和家庭。“投资于人”既要使当前劳动者有机会成长和转换，也要让下一代有条件出生并得到良好养育。","changes":[{"id":"C013","paragraph":68,"start":174,"end":174,"before":"","after":"\n\n社会不能只奖励已经形成、能够立即出售的能力，却把这些能力形成之前的成本和风险，主要留给个人和家庭。","reason":"将“投资于人”从能力培训拓展到能力形成的投入责任，为下一小节人口与养育衔接。原来关于收入、闲暇、照护的三个支点原封不动。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"因此，真正意义上的投资于人，不应局限于开展职业技能培训、迫使劳动者追赶机器，而应推动人与人工智能形成良性协同，拓展人的发展边界与选择空间，助力人的全面发展，使技术进步真正服务于人的多元需求。这需要落实为对居民收入水平、可支配闲暇时间、家庭照护支持的制度性保障，既是应对技术变革结构性冲击的现实要求，也是守护人类文明赓续、维系社会内在活力的根本基石。\n\n社会不能只奖励已经形成、能够立即出售的能力，却把这些能力形成之前的成本和风险，主要留给个人和家庭。"},{"id":69,"page":7,"heading":true,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"（二）人工智能时代，人口规模更为重要","previous":"（二）人工智能时代，人口规模更为重要","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（二）人工智能时代，人口规模更为重要"},{"id":70,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"人工智能可能大量取代工作，让很多人误以为人口不再重要。这种观点不仅否定了人的价值，在现实层面更是完全错误的。实际上，在人工智能时代，人口规模比以往任何时期都更为重要。当前人工智能实力最强的两个国家正是美国与中国，这并非偶然：两国拥有全球最大的有效人口规模，能够供给海量的数据、应用场景与人才规模。反观德国、日本这类传统工业强国，在人工智能赛道上近乎缺位，根源便在于其人口规模不足以支撑高密度的创新迭代。","previous":"人工智能可能大量取代工作，让很多人误以为人口不再重要。这混淆了完成某项生产所需的劳动人数，与一个社会维持发展所需的人口基础。机器减少的是生产的代价，并不减少生活本身的价值。人口规模对于市场纵深、专业分工、人才供给和创新机会的意义，不会因为机器更能干而消失；在依赖大规模应用和复杂协作的领域，还可能更加突出。","changes":[{"id":"C014","paragraph":70,"start":164,"end":200,"before":"在人工智能赛道上近乎缺位，根源便在于其人口规模不足以支撑高密度的创新迭代","after":"在部分前沿大模型领域的影响力与其传统工业实力并不相称，人口与市场规模可能是其中的重要条件","reason":"原段的中美、德日比较保留；但“近乎缺位”与“根源便在于”分别需要国家整体能力和单因素因果证据。建议仅收窄这两项断言。此处会改变论断强度，需作者确认，不能作为一般润色自动通过。","kind":"观点调整","impact":"需作者确认","sources":["S20"]}],"sourceIds":["S20"],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"人工智能可能大量取代工作，让很多人误以为人口不再重要。这种观点不仅否定了人的价值，在现实层面更是完全错误的。实际上，在人工智能时代，人口规模比以往任何时期都更为重要。当前人工智能实力最强的两个国家正是美国与中国，这并非偶然：两国拥有全球最大的有效人口规模，能够供给海量的数据、应用场景与人才规模。反观德国、日本这类传统工业强国，在部分前沿大模型领域的影响力与其传统工业实力并不相称，人口与市场规模可能是其中的重要条件。"},{"id":71,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"人工智能的深度依赖人类原始经验与持续反馈。《自然》2024 年发表的研究表明，模型若反复使用前代模型生成的合成数据训练，会遭遇模型崩溃：每一代迭代都会丢失原始数据分布中的低概率信息，多代之后输出逐渐偏离真实分布，最终退化为无意义内容。这意味着合成数据可以整理和放大已有信息，却无法无限替代人的真实体验。大语言模型学习的是人类语言、知识和交往留下的记录。人口越多，人际联系、专业社群和小众需求越丰富，交流网络形成的数据种类与纵深就越大；人口萎缩下，社会交往关系的衰减速度会快于人口数量的下滑，边缘语言、冷门知识和小众行业最先流失参与者，人工智能所能理解和服务的世界也会随之收窄。","previous":"人工智能的发展也依赖人类原始经验与持续反馈。《自然》2024年发表的研究表明，在其研究的递归训练条件下，反复以模型生成的数据替代原始数据，可能导致模型逐步丢失原始分布中的信息，出现“模型崩溃”。这并非说合成数据不能使用，而是说明不能把模型自身的循环输出，简单当作真实经验的无限替代。\n大语言模型学习的是人类语言、知识和交往留下的记录。较大的人口规模，在教育、交流和发展机会得到保障的条件下，能够支持更多专业社群、小众需求和生活实践。若参与者持续减少，一些边缘语言、冷门知识和小众行业便更难延续。人口的意义不在于机械增加数据量，而在于维持一个丰富、活跃、不断产生新经验的社会。","changes":[{"id":"C015","paragraph":71,"start":39,"end":67,"before":"模型若反复使用前代模型生成的合成数据训练，会遭遇模型崩溃","after":"在论文研究的递归训练条件下，模型反复使用前代模型生成的数据替代原始数据，可能遭遇模型崩溃","reason":"将结论限定在原稿所引论文的递归替代条件，不把它扩大为任何合成数据训练都失败。2024年、《自然》以及后续真实经验的论证均保留；论文链接是原有资料线索，本轮未重新逐页复核。","kind":"口径订正","impact":"保留原主张","sources":["S21"]}],"sourceIds":["S21"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2024"],"suggested":"人工智能的深度依赖人类原始经验与持续反馈。《自然》2024 年发表的研究表明，在论文研究的递归训练条件下，模型反复使用前代模型生成的数据替代原始数据，可能遭遇模型崩溃：每一代迭代都会丢失原始数据分布中的低概率信息，多代之后输出逐渐偏离真实分布，最终退化为无意义内容。这意味着合成数据可以整理和放大已有信息，却无法无限替代人的真实体验。大语言模型学习的是人类语言、知识和交往留下的记录。人口越多，人际联系、专业社群和小众需求越丰富，交流网络形成的数据种类与纵深就越大；人口萎缩下，社会交往关系的衰减速度会快于人口数量的下滑，边缘语言、冷门知识和小众行业最先流失参与者，人工智能所能理解和服务的世界也会随之收窄。"},{"id":72,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"消费者的每一次选择，都在向生产体系与人工智能传递真实的需求信号；脱离真实的个体与多元的生活实践，人工智能的发展就会变成无的放矢。2026 年OpenRouter 平台数据显示中国模型周调用量连续15 周超过美国，庞大的用户基数和丰富的应用场景为技术迭代构筑了独特的数据优势。","previous":"消费者的每一次选择，都在向生产体系与人工智能传递真实的需求信号；脱离真实的个体与多元的生活实践，人工智能的发展就容易无的放矢。庞大的市场与丰富的应用场景，是技术迭代的重要条件，但这种优势只有转化为民众的实际需求和参与，才能充分发挥作用。","changes":[],"sourceIds":["S22"],"restoration":"恢复OpenRouter连续15周的具体平台观察。其代表范围与人口因果解释留待核对，不用“市场和应用很重要”替代数据。","previousChanged":true,"chinaAnchors":["中国"],"numbers":["2026","15"],"suggested":"消费者的每一次选择，都在向生产体系与人工智能传递真实的需求信号；脱离真实的个体与多元的生活实践，人工智能的发展就会变成无的放矢。2026 年OpenRouter 平台数据显示中国模型周调用量连续15 周超过美国，庞大的用户基数和丰富的应用场景为技术迭代构筑了独特的数据优势。"},{"id":73,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"人工智能的发展深度依托人才规模。更多的人才，能够支撑更多的技术探索路径，更大的创新突破机会。人群内部智商与努力程度的分布具备稳定性，在社会技术发展水平大体相当的条件下，人口规模是决定高端人才总供给最核心的变量，十亿级人口社会所能涌现的达到特定能力层级的人才，是三亿级人口社会难以企及的。美国依托全球人才虹吸效应积淀起雄厚的顶尖研发人才储备，其人工智能顶尖人才中华人占比接近半数，本质上也是借力更大范围的人口基数；我国依托大规模理工科教育体系培育出体量可观的工程师队伍，能够支撑大模型训练、算法调优以及海量场景的产业化验证，拓宽前沿方向的试错边界，推动算法与算力优势切实转化为成熟可用的技术产品，加速技术成果从实验室走向产业应用。","previous":"人工智能的发展同样依托人才规模。更多的人才，可以支撑更多的技术探索路径，增加创新突破的机会。在教育、健康和发展机会大体相当的条件下，更大的人口基数意味着更大的人才潜力。美国能够吸引全球人才，我国拥有大规模理工科教育体系，这都说明人才来源不能只看少数明星人物，而要看其背后的培养基础。人口不能代替教育和制度，教育与制度也不能凭空创造已经没有出生的下一代。","changes":[],"sourceIds":["S23"],"restoration":"恢复“华人接近半数”及我国工程师培养、产业化验证的具体论证。人才口径需核查，但不能直接删掉量化依据。","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"人工智能的发展深度依托人才规模。更多的人才，能够支撑更多的技术探索路径，更大的创新突破机会。人群内部智商与努力程度的分布具备稳定性，在社会技术发展水平大体相当的条件下，人口规模是决定高端人才总供给最核心的变量，十亿级人口社会所能涌现的达到特定能力层级的人才，是三亿级人口社会难以企及的。美国依托全球人才虹吸效应积淀起雄厚的顶尖研发人才储备，其人工智能顶尖人才中华人占比接近半数，本质上也是借力更大范围的人口基数；我国依托大规模理工科教育体系培育出体量可观的工程师队伍，能够支撑大模型训练、算法调优以及海量场景的产业化验证，拓宽前沿方向的试错边界，推动算法与算力优势切实转化为成熟可用的技术产品，加速技术成果从实验室走向产业应用。"},{"id":74,"page":7,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"人工智能技术迭代极快，技术积累的领先窗口被急剧压缩。真正决定长期竞争力的，是持续的大规模应用场景、人才供给和资金投入。这些无不高度依赖人口规模。直到几年前，我国出生人口超过整个西方之和，如今却已低于西方；按现有低生育率趋势，仅需一两代人时间，中国出生人口将少于美国。这意味着我们将彻底失去对美国的人力资源优势，且尚未计入移民对美国人力资本的倍增效应。若相对人口颓势不改，中国在人工智能领域被边缘化只是时间问题。","previous":"人口并非决定人工智能竞争力的唯一因素，科研组织、资本、开放交流和产业条件同样重要，不能把某国的领先或落后简单归结为人口多少。但若长期低生育使后续世代不断缩小，人才供给、市场规模和公共服务的支撑条件也会随之改变。我们不能把今天形成的人口与产业优势，当作不需要维护便能永久存在的禀赋。","changes":[],"sourceIds":["S19"],"restoration":"恢复原稿的人口相对变化及时间尺度，作为作者推演待补假设；不再把整段改成抽象的“优势需要维护”。","previousChanged":true,"chinaAnchors":["中国","我国"],"numbers":[],"suggested":"人工智能技术迭代极快，技术积累的领先窗口被急剧压缩。真正决定长期竞争力的，是持续的大规模应用场景、人才供给和资金投入。这些无不高度依赖人口规模。直到几年前，我国出生人口超过整个西方之和，如今却已低于西方；按现有低生育率趋势，仅需一两代人时间，中国出生人口将少于美国。这意味着我们将彻底失去对美国的人力资源优势，且尚未计入移民对美国人力资本的倍增效应。若相对人口颓势不改，中国在人工智能领域被边缘化只是时间问题。"},{"id":75,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（二）人工智能时代，人口规模更为重要","original":"生育比教育更为基础：教育决定一个人可以发展得多好，生育决定未来有没有这个人。维护人口不仅为了未来消费规模和工作人口乃至人才规模，更关乎当代民众福祉、国家综合实力和中华文明永续——人口稳定才能支撑高密度公共服务、全产业链优势、技术迭代和文化传承。将提升生育率至更替水平作为国家长期战略核心，不仅是维持经济社会可持续发展的需要，更是守住文明、国力和现代生活方式的基础。","previous":"生育比教育更为基础：教育决定一个人可以发展得多好，生育决定未来有没有这个人。维护人口不仅为了未来消费规模和工作人口乃至人才规模，更关乎当代民众福祉、国家综合实力和中华文明永续。将生育率持续回升至更替水平作为国家长期战略目标，是维护经济社会可持续发展的需要；实现这一目标，应当靠降低养育负担、改善生活条件和扩大真实选择，而不是要求家庭为人口数字承担无法承受的代价。\n\n眼前一些岗位不足，与长期人口萎缩，并不矛盾。前者涉及当前的任务分工和收入分配，后者涉及二十年后乃至更久的社会构成。不能因为眼前就业困难，就把少生孩子当作解决办法；也不能因为未来需要人口，就忽视今天年轻人的处境。机器可以替代某些劳动，却不能替代孩子成长、家庭形成和社会代际延续本身。\n\n养育的成果惠及整个社会，时间、金钱和职业机会成本却首先由家庭承担。对社会有长期价值的事情，未必是每个家庭在现有条件下都负担得起的事情。支持养育，就是使这部分成本得到更合理的社会分担。起点收入着眼于共同成果如何分享，养育金着眼于下一代的成长成本如何分担，二者由此连接起来。","changes":[{"id":"C016","paragraph":75,"start":182,"end":182,"before":"","after":"\n\n眼前一些岗位不足，与长期人口萎缩并不矛盾。前者涉及当前的任务分工和收入分配，后者涉及下一代的社会构成。养育的成果惠及整个社会，时间、金钱和职业机会成本却首先由家庭承担；让这一成本得到合理分担，正是从分享共同成果走向支持养育的制度依据。","reason":"这是AI替代与人口支持之间最需要补出的推理。保留“生育比教育更为基础”及国家长期目标，仅补时间尺度和成本承担关系，不改写整个人口章节。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S19"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"生育比教育更为基础：教育决定一个人可以发展得多好，生育决定未来有没有这个人。维护人口不仅为了未来消费规模和工作人口乃至人才规模，更关乎当代民众福祉、国家综合实力和中华文明永续——人口稳定才能支撑高密度公共服务、全产业链优势、技术迭代和文化传承。将提升生育率至更替水平作为国家长期战略核心，不仅是维持经济社会可持续发展的需要，更是守住文明、国力和现代生活方式的基础。\n\n眼前一些岗位不足，与长期人口萎缩并不矛盾。前者涉及当前的任务分工和收入分配，后者涉及下一代的社会构成。养育的成果惠及整个社会，时间、金钱和职业机会成本却首先由家庭承担；让这一成本得到合理分担，正是从分享共同成果走向支持养育的制度依据。"},{"id":76,"page":8,"heading":true,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","previous":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排"},{"id":77,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"无论是生育支持还是居民收入提升，常会遇到\"钱从哪里来\"的现实诘问。但从底层逻辑看，一个社会真正的财富不是账面货币，而是背后的生产、建设和创造能力，以及将这种能力转化为民众福祉的制度框架。我国拥有强大的生产、建设和创新能力，却有众多家庭感受\"手里没钱\"，其本质是共同生产能力未充分转化为居民可支配权益。缺乏这种转化机制，生产能力再强也只是沉睡的资产，无法形成有效需求与经济循环。","previous":"无论是生育支持还是居民收入提升，常会遇到“钱从哪里来”的现实诘问。从底层逻辑看，一个社会真正的财富不是账面货币，而是背后的生产、建设和创造能力，以及将这种能力转化为民众福祉的制度框架。我国拥有强大的生产、建设和创新能力，却仍有众多家庭感受“手里没钱”，反映出生产能力尚未充分转化为居民可支配权益。\n\n但有生产能力，不等于财政可以不计成本地派发收入。钱代表着对真实资源的支配权，给一部分人增加这种权利，需要说明对应的公共收入、支出调整或债务安排。真正的问题不是能否找到一种没有任何人承担成本的发钱办法，而是现有与新增产出怎样分配，能够使民众生活更好，也使生产、创新和养育更有后劲。","changes":[{"id":"C017","paragraph":77,"start":188,"end":188,"before":"","after":"\n\n但生产能力充足，不等于每项支出都没有成本。钱代表对真实资源的支配权，扩大普通家庭的权益，仍须说明由哪些公共收入、支出调整或跨期安排来支持。改革要回答的，不是怎样让成本凭空消失，而是怎样分担成本，能使生产、生活和养育都更有后劲。","reason":"原文从真实财富走向发钱，中间缺少谁承担支配权变化。补清筹资与真实资源是两个约束，不否认中国供给能力，也不把财政谨慎替换成全文主旨。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"无论是生育支持还是居民收入提升，常会遇到\"钱从哪里来\"的现实诘问。但从底层逻辑看，一个社会真正的财富不是账面货币，而是背后的生产、建设和创造能力，以及将这种能力转化为民众福祉的制度框架。我国拥有强大的生产、建设和创新能力，却有众多家庭感受\"手里没钱\"，其本质是共同生产能力未充分转化为居民可支配权益。缺乏这种转化机制，生产能力再强也只是沉睡的资产，无法形成有效需求与经济循环。\n\n但生产能力充足，不等于每项支出都没有成本。钱代表对真实资源的支配权，扩大普通家庭的权益，仍须说明由哪些公共收入、支出调整或跨期安排来支持。改革要回答的，不是怎样让成本凭空消失，而是怎样分担成本，能使生产、生活和养育都更有后劲。"},{"id":78,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"这一矛盾有多重表现。大量有消费意愿的群体缺乏收入保障与稳定预期，即便拥有一定收入也倾向于谨慎储蓄，由此抑制消费、阻滞循环。超低生育率拉低了发展预期，房地产泡沫破裂收缩了财富感知，人工智能的收益分化则进一步加剧了普通劳动者的收入压力——三者相互交织，共同放大了有效需求不足的问题。人工智能更会放大马太效应：技术供给越是强大，分配制度越需要及时将产出导向真正有需求的普通群体；否则产能充足而商品滞销，有真实需求的民众因收入匮乏无力购买，经济循环便陷入停滞。","previous":"这一矛盾有多重表现。大量有消费意愿的群体缺乏收入保障与稳定预期，即便拥有一定收入也倾向于谨慎储蓄，由此抑制消费、阻滞循环。超低生育率拉低了发展预期，房地产泡沫破裂收缩了财富感知，人工智能的收益分化则进一步加剧了普通劳动者的收入压力——三者相互交织，共同放大了有效需求不足的问题。人工智能更会放大马太效应：技术供给越是强大，分配制度越需要及时将产出导向真正有需求的普通群体；否则产能充足而商品滞销，有真实需求的民众因收入匮乏无力购买，经济循环便陷入停滞。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"这一矛盾有多重表现。大量有消费意愿的群体缺乏收入保障与稳定预期，即便拥有一定收入也倾向于谨慎储蓄，由此抑制消费、阻滞循环。超低生育率拉低了发展预期，房地产泡沫破裂收缩了财富感知，人工智能的收益分化则进一步加剧了普通劳动者的收入压力——三者相互交织，共同放大了有效需求不足的问题。人工智能更会放大马太效应：技术供给越是强大，分配制度越需要及时将产出导向真正有需求的普通群体；否则产能充足而商品滞销，有真实需求的民众因收入匮乏无力购买，经济循环便陷入停滞。"},{"id":79,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"这一困境在对外经济中同样显著。我国依托庞大人口基数、完备产业链与长期知识积淀，产出大量高性价比高技术产品，为全球作出重要贡献。但出口的根本目的在于进口，贸易顺差积累的外汇对应的是境外商品、资源、技术与资产，应当用来换回国内发展所需。若企业长期陷入低价竞争、劳动者未能充分分享收益，民众便容易沦为只承担生产付出、难以享受成果的\"世界工蜂\"，出口沦为顺差数字的累积，而非生活水平的提升。顺差若未转化为本国民众的进口消费与生活改善，便背离了生产与贸易的初衷。","previous":"这一困境在对外经济中同样值得重视。我国依托庞大人口基数、完备产业链与长期知识积淀，产出大量高性价比产品，为全球作出重要贡献。若企业长期陷入低价竞争、劳动者未能充分分享收益，民众便容易沦为只承担生产付出、难以享受成果的“世界工蜂”。出口和境外资产积累，都应最终服务于当期或未来的生活改善，而非成为脱离民生的数字目标。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国","国内"],"numbers":[],"suggested":"这一困境在对外经济中同样显著。我国依托庞大人口基数、完备产业链与长期知识积淀，产出大量高性价比高技术产品，为全球作出重要贡献。但出口的根本目的在于进口，贸易顺差积累的外汇对应的是境外商品、资源、技术与资产，应当用来换回国内发展所需。若企业长期陷入低价竞争、劳动者未能充分分享收益，民众便容易沦为只承担生产付出、难以享受成果的\"世界工蜂\"，出口沦为顺差数字的累积，而非生活水平的提升。顺差若未转化为本国民众的进口消费与生活改善，便背离了生产与贸易的初衷。"},{"id":80,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"我国庞大的经济体量是对技术进步的核心优势，由此孕育的技术领先企业拥有其他国家难以比拟的成长空间和竞争实力。但这也使马太效应更加突出——技术领先企业的收益能够直接惠及的人群，在全国人口中占比相对有限。若不主动调节，收入和财富会自然向顶部聚集，底部群体则被甩出循环。这意味着我们需要更加有效的分配机制，通过国家调节抬高起点、对冲分化，将技术进步的红利导向普通劳动者和养育家庭。","previous":"我国庞大的经济体量是对技术进步的核心优势，由此孕育的技术领先企业拥有其他国家难以比拟的成长空间和竞争实力。但这也使马太效应更加突出——技术领先企业的收益能够直接惠及的人群，在全国人口中占比相对有限。若不主动调节，收入和财富会自然向顶部聚集，底部群体则被甩出循环。这意味着我们需要更加有效的分配机制，通过国家调节抬高起点、对冲分化，将技术进步的红利导向普通劳动者和养育家庭。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国庞大的经济体量是对技术进步的核心优势，由此孕育的技术领先企业拥有其他国家难以比拟的成长空间和竞争实力。但这也使马太效应更加突出——技术领先企业的收益能够直接惠及的人群，在全国人口中占比相对有限。若不主动调节，收入和财富会自然向顶部聚集，底部群体则被甩出循环。这意味着我们需要更加有效的分配机制，通过国家调节抬高起点、对冲分化，将技术进步的红利导向普通劳动者和养育家庭。"},{"id":81,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"韩国2026 年提出\"国民分红\"构想，拟将AI 半导体产业带来的超额税收部分回馈全民，参照挪威主权财富基金模式，用于青年创业、农村基本收入或老龄年金等。但这一安排仍属临时性的财政调剂，缺乏与就业市场、人口结构联动的自动调节机制，尚未形成可预期的制度框架。","previous":"社会整体生产能力也并非完全由当期雇佣关系创造。公共教育、基础研究、基础设施、法律秩序以及历代知识积累，都是企业经营和技术创新得以展开的条件。私人投资和创新应当获得回报，公共投入也应形成相应的公共收益。把这部分收益以公共服务和基础收入等方式回馈民众，是共同发展的应有之义。","changes":[],"sourceIds":["S24"],"restoration":"恢复韩国2026年国民分红案例及原有比较；政策状态与评价依据列入校注，不用一般公共投入论述替代。","previousChanged":true,"chinaAnchors":[],"numbers":["2026"],"suggested":"韩国2026 年提出\"国民分红\"构想，拟将AI 半导体产业带来的超额税收部分回馈全民，参照挪威主权财富基金模式，用于青年创业、农村基本收入或老龄年金等。但这一安排仍属临时性的财政调剂，缺乏与就业市场、人口结构联动的自动调节机制，尚未形成可预期的制度框架。"},{"id":82,"page":8,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（三）财富源自生产能力，更源自将其转化为福祉的制度安排","original":"我国需要的不是这种一事一议的应急补丁，而是系统性的制度安排。本文后续建议将起点收入与养育金嵌入基本经济制度，使其随生产效率、就业状况和生育水平自动调整，让全体国民作为共同生产能力的所有者，获得基础性的收益分享，成为技术进步普惠共享的稳定通道。这需要国家发挥调节职能，运用超长期国债、合理信用扩张等工具抬高底层群体收益，提升全民发展起点，让经济循环服务于人的生活诉求。唯有普通民众拥有可支配收入、敢于消费，经济循环才能顺畅运转，带动各领域步入良性发展。","previous":"我国需要的不是一事一议的应急补丁，而是稳定、可预期的制度安排。可以通过公共资产收益、依法筹集的税收和支出结构调整，逐步建立基础性的收益分享，并使其随生产效率和可持续财力提高而完善。国债与合理信用扩张可以在必要时用于跨期安排，但不能代替长期收入来源，也不能把同一笔公共收益重复承诺给多个用途。","changes":[{"id":"C018","paragraph":82,"start":225,"end":225,"before":"","after":"\n\n国债可以分担跨期成本，但仍需长期偿付来源；同一笔公共收益，也不能重复承诺给不同用途。","reason":"保留超长期国债和信用扩张工具，只补不能用融资名称代替成本分担的条件。没有替作者选择税率、债务规模或删除其制度愿景。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"我国需要的不是这种一事一议的应急补丁，而是系统性的制度安排。本文后续建议将起点收入与养育金嵌入基本经济制度，使其随生产效率、就业状况和生育水平自动调整，让全体国民作为共同生产能力的所有者，获得基础性的收益分享，成为技术进步普惠共享的稳定通道。这需要国家发挥调节职能，运用超长期国债、合理信用扩张等工具抬高底层群体收益，提升全民发展起点，让经济循环服务于人的生活诉求。唯有普通民众拥有可支配收入、敢于消费，经济循环才能顺畅运转，带动各领域步入良性发展。\n\n国债可以分担跨期成本，但仍需长期偿付来源；同一笔公共收益，也不能重复承诺给不同用途。"},{"id":83,"page":9,"heading":true,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"（四）需要形成中国自己的方案","previous":"（四）需要形成中国自己的方案","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["中国"],"numbers":[],"suggested":"（四）需要形成中国自己的方案"},{"id":84,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"长期以来，中国在公共政策领域存在一种\"好学生心态\"——许多热门议题如人口爆炸、平权运动、气候变化，多源自西方叙事，我们习惯于亦步亦趋。但人工智能冲击、超低生育率和超大规模经济的分配问题，在中国更为突出，甚至为中国所独有。这要求我们不能简单参照西方现成方案，必须把思想实验推进为符合自身发展逻辑与制度条件的现实实践。","previous":"长期以来，中国在公共政策领域存在一种“好学生心态”，习惯于在国外已经形成的议题和方案中寻找答案。但人工智能冲击、超低生育率和超大规模经济的分配问题，在中国有自身的紧迫性与具体条件。这要求我们既认真借鉴国外经验，又不能等待现成答案，必须把思想实验推进为符合自身发展逻辑与制度条件的现实探索。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"长期以来，中国在公共政策领域存在一种\"好学生心态\"——许多热门议题如人口爆炸、平权运动、气候变化，多源自西方叙事，我们习惯于亦步亦趋。但人工智能冲击、超低生育率和超大规模经济的分配问题，在中国更为突出，甚至为中国所独有。这要求我们不能简单参照西方现成方案，必须把思想实验推进为符合自身发展逻辑与制度条件的现实实践。"},{"id":85,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"西方相关探索不足以直接移植。瑞士2016 年举行全球唯一一次全民基本收入公投，76.9%反对、23.1%支持，提案被否决。反对声音集中于政府负担过重、警惕福利主义侵蚀个人自由，以及担忧\"强大到足以给予一切的政府，也强大到能夺走一切\"。美国OpenResearch 对3000 名低收入者开展定向试验，1000 人连续三年每月领取1000 美元，结果显示受领者每周少工作约1.3 小时、就业率低约2 个百分点，部分教育和育儿投入有所改善，但整体人力资本和就业质量变化有限。","previous":"国外相关探索提供了经验，也提出了警示。瑞士2016年的全民基本收入公投未获通过。美国OpenResearch对3000名低收入者开展定向试验，其中1000人连续三年每月领取1000美元，其发布的研究结果显示，受领者平均每周少工作约1.3小时，就业概率比对照组低约2个百分点，整体就业质量的改善有限。这说明收入支持确实会改变劳动选择，不能预先保证它只有收益而没有代价。","changes":[{"id":"C019","paragraph":85,"start":24,"end":38,"before":"全球唯一一次全民基本收入公投","after":"全民基本收入公投","reason":"“全球唯一”不影响本段论证，却需穷尽核验所有公投。保留瑞士案例、2016年、76.9%与23.1%的结果，以及美国试验的全部数字，仅建议去掉这个排他修饰。","kind":"措辞","impact":"保留原主张","sources":[]}],"sourceIds":["S25","S26"],"restoration":"恢复瑞士公投76.9%与23.1%，以及美国试验的全部规模与效应数字。新建议只涉及“全球唯一”这个修饰。","previousChanged":true,"chinaAnchors":[],"numbers":["2016","76.9%","23.1%","3000","1000","1000","1.3","2"],"suggested":"西方相关探索不足以直接移植。瑞士2016 年举行全民基本收入公投，76.9%反对、23.1%支持，提案被否决。反对声音集中于政府负担过重、警惕福利主义侵蚀个人自由，以及担忧\"强大到足以给予一切的政府，也强大到能夺走一切\"。美国OpenResearch 对3000 名低收入者开展定向试验，1000 人连续三年每月领取1000 美元，结果显示受领者每周少工作约1.3 小时、就业率低约2 个百分点，部分教育和育儿投入有所改善，但整体人力资本和就业质量变化有限。"},{"id":86,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"这类试验的局限性在于：瑞士社会保障完善，民众担忧的是财富稀释而非生存困境；美国试验则属定向、限期的小规模样本，既非普惠也非动态，无法验证与就业市场、人口结构联动的制度设计。更深层的是意识形态差异——西方传统将政府视为负面力量，联想到集体化与福利依赖；但我国制度实践中，政府主导的医保、低保等安排已证明可以增进全民福祉，关键在于政府是否有效作为。","previous":"这类试验是限期、定向和小规模的，不能直接代表全国长期制度的全部效果，尤其无法完整反映筹资负担、物价、企业投资与公共服务的变化。但试验规模有限，也不意味着其结果可以忽略。无论采取何种制度，都要正面回答：谁得到支持，谁承担成本，哪些服务仍然供给不足，以及收入保障会怎样影响劳动与创新。","changes":[{"id":"C020","paragraph":86,"start":172,"end":172,"before":"","after":"\n\n小规模试验不能代表全国长期制度，也不意味着其代价可以忽略。筹资负担、必要服务供给和劳动选择，仍应在中国自己的探索中一并检验。","reason":"原文强调海外试验不能直接移植，观点保留。补充“不能代表”不等于“无需回应”，让对国外试验的讨论转化为中国方案需要检验的事项。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S26"],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"这类试验的局限性在于：瑞士社会保障完善，民众担忧的是财富稀释而非生存困境；美国试验则属定向、限期的小规模样本，既非普惠也非动态，无法验证与就业市场、人口结构联动的制度设计。更深层的是意识形态差异——西方传统将政府视为负面力量，联想到集体化与福利依赖；但我国制度实践中，政府主导的医保、低保等安排已证明可以增进全民福祉，关键在于政府是否有效作为。\n\n小规模试验不能代表全国长期制度，也不意味着其代价可以忽略。筹资负担、必要服务供给和劳动选择，仍应在中国自己的探索中一并检验。"},{"id":87,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"中国民众是最勤劳的群体，我国的突出矛盾不是民众工作意愿不足，而是劳动付出没有换来与生产能力相匹配的生活。因此，制度设计不应把防止\"躺平\"置于首位，而应先看社会效率是否提高、普通人是否生活得更好。起点收入保留多劳多得，并可在劳动力短缺时自动降低分配比例；当产出充足、岗位不足时，真正需要担心的是普通人没有收入，而不是少数人选择减少低价值劳动。","previous":"中国民众的突出困难，不是工作意愿不足，而是劳动付出没有换来与生产能力相匹配的生活。因此，制度设计不应把防止“躺平”置于首位，而应先看社会效率是否提高、普通人是否生活得更好。减少无效加班、增加照护和学习时间，本来就可以是发展的成果。但必要的生产和服务仍需有人完成，若出现短缺，也必须通过合理报酬、工作条件、技术改进和培训加以解决。保障与激励应当共同设计，不能只强调其中一面。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国","我国"],"numbers":[],"suggested":"中国民众是最勤劳的群体，我国的突出矛盾不是民众工作意愿不足，而是劳动付出没有换来与生产能力相匹配的生活。因此，制度设计不应把防止\"躺平\"置于首位，而应先看社会效率是否提高、普通人是否生活得更好。起点收入保留多劳多得，并可在劳动力短缺时自动降低分配比例；当产出充足、岗位不足时，真正需要担心的是普通人没有收入，而不是少数人选择减少低价值劳动。"},{"id":88,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"这一探索涉及社会基本经济制度的深层调整。如果不论贡献多少收入都完全相同，社会会失去激励；但如果少数人占有几乎全部新增财富，多数人没有稳定收入，经济同样无法持续。前者损害短期效率，后者摧毁需求、婚育、信任和长期投资。真正的公平不是简单平均，更不是赢者通吃，而是使全社会长期人均福祉和创新能力最大化的分配。","previous":"这一探索涉及社会基本经济制度的深层调整。如果不论贡献多少收入都完全相同，社会会失去激励；但如果少数人占有几乎全部新增财富，多数人没有稳定收入，经济同样无法持续。前者损害短期效率，后者摧毁需求、婚育、信任和长期投资。真正的公平不是简单平均，更不是赢者通吃，而是使全社会长期人均福祉和创新能力最大化的分配。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"这一探索涉及社会基本经济制度的深层调整。如果不论贡献多少收入都完全相同，社会会失去激励；但如果少数人占有几乎全部新增财富，多数人没有稳定收入，经济同样无法持续。前者损害短期效率，后者摧毁需求、婚育、信任和长期投资。真正的公平不是简单平均，更不是赢者通吃，而是使全社会长期人均福祉和创新能力最大化的分配。"},{"id":89,"page":9,"heading":false,"section":"三、人工智能迫使我们更深刻认识发展的底层逻辑","subsection":"（四）需要形成中国自己的方案","original":"我国是社会主义国家，人民是国家主人，也应在经济意义上成为共同生产能力的受益者。中国应当先行探索，使技术越进步，普通人越能生活得体面。基于上述分析，我们需要一种既能保留市场激励、又能普惠共享技术红利的制度安排——这就是\"起点收入\"构想。","previous":"我国是社会主义国家，人民是国家主人，也应在经济意义上成为共同生产能力的受益者。中国应当先行探索，使技术越进步，普通人越能生活得体面。基于上述分析，我们需要一种既能保留市场激励、又能普惠共享技术红利的制度安排——这就是“起点收入”构想。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国","我国"],"numbers":[],"suggested":"我国是社会主义国家，人民是国家主人，也应在经济意义上成为共同生产能力的受益者。中国应当先行探索，使技术越进步，普通人越能生活得体面。基于上述分析，我们需要一种既能保留市场激励、又能普惠共享技术红利的制度安排——这就是\"起点收入\"构想。"},{"id":90,"page":9,"heading":true,"section":"四、起点收入的基本构想","subsection":"","original":"四、起点收入的基本构想","previous":"四、起点收入的基本构想","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"四、起点收入的基本构想"},{"id":91,"page":9,"heading":false,"section":"四、起点收入的基本构想","subsection":"","original":"人工智能冲击、低生育危机与分配失衡多重叠加，亟需跳出传统福利思维，建立不完全依附雇佣关系的分配制度。本节提出\"起点收入\"的基本构想，旨在为全体国民建立基于共同所有权的收益分享机制，使技术进步的红利自动流向每一个社会成员。","previous":"人工智能冲击、低生育危机与分配失衡多重叠加，要求我们探索不完全依附当前雇佣关系的分配制度。本节提出“起点收入”的基本构想，旨在使全体国民拥有一份稳定、可预期的基础分享权益，并使这种权益随着社会生产能力和公共财力的提高而逐步充实。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能冲击、低生育危机与分配失衡多重叠加，亟需跳出传统福利思维，建立不完全依附雇佣关系的分配制度。本节提出\"起点收入\"的基本构想，旨在为全体国民建立基于共同所有权的收益分享机制，使技术进步的红利自动流向每一个社会成员。"},{"id":92,"page":9,"heading":true,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"（一）核心理念与制度定位","previous":"（一）核心理念与制度定位","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（一）核心理念与制度定位"},{"id":93,"page":9,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"起点收入的核心特征是普惠性——所有国民都有份，金额原则上相同。这里\"起点\"既指每个国民的人生起点，也指整个社会的分配起点。它不是低保式的兜底救济，而是基于国民共同所有权的权益分配：每位国民都是国家发展共同体的天然主体，理应共享社会整体生产能力的增值红利。","previous":"起点收入的核心特征是普惠性——所有国民都有份，基础金额原则上相同。这里“起点”既指每个国民的人生起点，也指整个社会的分配起点。它不是只有失去工作或陷入贫困后才能获得的救济，而是承认每位国民都是国家发展共同体的主体，应当在不同人生阶段分享共同发展的成果。\n\n所谓共同分享，并不是说每位国民已经对所有私人企业拥有同等股权，更不是否定合法财产权。它需要通过公共资产收益、税收和预算等明确制度，把共同发展原则转化为实际权益。普惠的是领取资格，最终净受益则还要看筹资方式：高收入者可以领取同样的起点收入，同时通过税制承担更多成本。","changes":[{"id":"C021","paragraph":93,"start":127,"end":127,"before":"","after":"\n\n这一分享权益需要通过明确的公共收益和分配规则落实，并非预设每位国民已经对所有私人企业拥有同等股权。","reason":"“共同所有权”是原文的重要概念，保留不替换。但需要区分制度主张与已存在的私人产权事实；补一句落实路径和边界。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"起点收入的核心特征是普惠性——所有国民都有份，金额原则上相同。这里\"起点\"既指每个国民的人生起点，也指整个社会的分配起点。它不是低保式的兜底救济，而是基于国民共同所有权的权益分配：每位国民都是国家发展共同体的天然主体，理应共享社会整体生产能力的增值红利。\n\n这一分享权益需要通过明确的公共收益和分配规则落实，并非预设每位国民已经对所有私人企业拥有同等股权。"},{"id":94,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"起点收入与西方\"全民基本收入\"（UBI）有本质区别。UBI 通常由财政税收筹资，属于再分配范畴；起点收入则依托货币数字化技术，将收益分享嵌入经济交易环节，使分配与生产同步发生。技术前提是货币数字化：每个国民在支付平台拥有独立户头，由本人或监护人支配，中国开发的数字货币体系可作为初始演化平台。","previous":"起点收入与通常所说的“全民基本收入”（UBI），在普惠、个人领取和不以就业为前提等方面基本相通。本文着重讨论的是，如何把收益分享与经济运行、公共收益和人的长期发展连接起来。它可以借助数字支付实现便利、透明的发放，其资金来源和权益依据仍需通过财政与法律制度落实。每个国民可拥有独立的公共收益账户，由本人或监护人依法支配，数字人民币或具备同等能力的支付体系都可承担执行功能。","changes":[{"id":"C022","paragraph":94,"start":20,"end":62,"before":"有本质区别。UBI 通常由财政税收筹资，属于再分配范畴；起点收入则依托货币数字化技术","after":"在本文所强调的运行机制上有所区别。起点收入着重依托货币数字化技术","reason":"支付方式并不能单独决定是否属于再分配。保留数字货币、中国平台与交易联动构想，但不让技术方式承担与UBI“本质不同”的全部论证。属于制度定位调整，需作者确认。","kind":"制度选择","impact":"需作者确认","sources":["S27"]}],"sourceIds":["S27"],"restoration":"","previousChanged":true,"chinaAnchors":["中国","数字货币"],"numbers":[],"suggested":"起点收入与西方\"全民基本收入\"（UBI）在本文所强调的运行机制上有所区别。起点收入着重依托货币数字化技术，将收益分享嵌入经济交易环节，使分配与生产同步发生。技术前提是货币数字化：每个国民在支付平台拥有独立户头，由本人或监护人支配，中国开发的数字货币体系可作为初始演化平台。"},{"id":95,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"起点收入的关键机制有两个：","previous":"起点收入的关键机制有两个：","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"起点收入的关键机制有两个："},{"id":96,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"第一，通过支付平台实时派发。如果将支付平台视为经济活动的基础信用体系，这相当于将收入分配嵌入货币发行环节。具体来说，就是要求任何一笔交易的增值按比例自动派发到每位国民的户头。假设派发比例为6%，销售一台电脑的增值是2000 元，销售者获得1880 元，剩余的120 元在交易结算时自动分割汇入全国每个人的户头。若所有交易增值都按相同比例派发，相当于GDP 的6%作为起点收入普惠全民。","previous":"第一，使收益分享嵌入日常经济运行。可以研究从明确核算的增加值或其他公共收入中，按既定规则划出一部分，进入公共分享账户，再定期发放。为便于说明，暂以6%为例：某一生产销售环节形成2000元增加值，其中120元进入分享账户，剩余1880元仍在原有分配中安排。实际采用何种比例，应结合收入来源、分担方式与公共支出需要确定。\n\n这120元不是凭空产生的，也不能直接称为企业利润分成，因为增加值中还包含劳动报酬等项目。其最终负担由谁承担，会受到价格、工资、利润和市场竞争的影响。若用这一安排替代部分现有税收，必须交代原有公共支出怎样继续供资；若属于新增提取，就应承认存在新增负担，并判断这种负担是否合理。\n\n增加值也不能只凭一笔支付金额自动识别。实际实施需要与会计、税务和国民经济核算衔接，避免把交易额当作增加值、重复提取或漏计。只有在口径一致、覆盖充分的假设下，对全部增加值划转6%，才大体对应国内生产总值的6%。不能仅对某一种支付方式提取，否则同一经济活动会因结算方式不同而承担不同负担。\n\n如果人工智能的新增收益更多体现为利润和资本收入，公共筹资也应适应这种变化，避免仍主要依赖劳动收入来承担分享成本。可以将公共资产的可分配收益、合理的资本收入税收与其他公共收入结合起来，让资金来源随收入结构变化而调整。其着眼点是分享真实收益，而不是仅因企业使用了人工智能就加以惩罚。","changes":[{"id":"C023","paragraph":96,"start":40,"end":52,"before":"收入分配嵌入货币发行环节","after":"收入分配嵌入交易结算环节","reason":"后面的2000元增加值、1880元与120元分配例子发生在结算，不必同时发行新货币。只改环节名称，保留6%和全部金额。","kind":"口径订正","impact":"保留原主张","sources":[]},{"id":"C024","paragraph":96,"start":192,"end":192,"before":"","after":"\n\n实际操作中，增加值还需要与会计、税务核算衔接，不能直接把支付金额当作增加值。这120元来自原有收入权利的重新安排，其负担可能反映在利润、工资或价格中，应与现有税收一并考虑。","reason":"6%例子有解释力，应完整保留。补足两个遗漏：支付额不等于增加值；120元不是无成本新增资金。把困难讲清楚，而非撤去具体计算。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S28"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["6%","2000","1880","120","6%"],"suggested":"第一，通过支付平台实时派发。如果将支付平台视为经济活动的基础信用体系，这相当于将收入分配嵌入交易结算环节。具体来说，就是要求任何一笔交易的增值按比例自动派发到每位国民的户头。假设派发比例为6%，销售一台电脑的增值是2000 元，销售者获得1880 元，剩余的120 元在交易结算时自动分割汇入全国每个人的户头。若所有交易增值都按相同比例派发，相当于GDP 的6%作为起点收入普惠全民。\n\n实际操作中，增加值还需要与会计、税务核算衔接，不能直接把支付金额当作增加值。这120元来自原有收入权利的重新安排，其负担可能反映在利润、工资或价格中，应与现有税收一并考虑。"},{"id":97,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"第二，派发比例与就业市场动态挂钩，而非固定。在货币数字化前提下，平台可实时记录所有人的工资收入以反映就业市场形势，实时调整派发比例。就业市场工资走低，说明劳动力供大于求，系统逐步上调派发比例；工资走高，说明劳动力供小于求，系统逐步下调派发比例。实行之初，派发比例可从零开始逐步上调，直到整体工资开始显著上涨，之后随工资变化实时调整。","previous":"第二，发放水平随经济条件逐步调整，但基本保障应保持稳定。技术进步、公共收益增长，可以为提高基础分享水平创造条件；就业冲击加重时，也需要增加转型支持。但不能只看到在岗者平均工资上涨，就认定所有人的处境改善。低薪者退出就业后，平均工资也可能上升，收入处境却更差。\n\n因此，应当区分相对稳定的基础金额、随可持续公共收益变化的分红，以及应对失业和转岗的阶段性支持。调整时综合考察实际收入、就业人数、劳动参与、职业入口、物价和财政承受能力，设定观察期、调整幅度和上下限。不能为了短期推动更多人求职，就随意削减已经承诺的基本生活保障。","changes":[{"id":"C025","paragraph":97,"start":166,"end":166,"before":"","after":"\n\n工资仍是重要信号，但不能只看在岗者平均工资：低薪者退出就业，也会把平均数抬高。动态调整应同时参考实际工资、就业人数和劳动参与等指标，设定观察期、调整幅度及基本保障底线，再检验反馈是否稳定。","reason":"不沿用上一版将单一机制整体替换为三层制度的做法。保留工资联动和动态调整，只提出平均数构成偏差、时滞和底线约束；如何组合指标仍由作者决定。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S29"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"第二，派发比例与就业市场动态挂钩，而非固定。在货币数字化前提下，平台可实时记录所有人的工资收入以反映就业市场形势，实时调整派发比例。就业市场工资走低，说明劳动力供大于求，系统逐步上调派发比例；工资走高，说明劳动力供小于求，系统逐步下调派发比例。实行之初，派发比例可从零开始逐步上调，直到整体工资开始显著上涨，之后随工资变化实时调整。\n\n工资仍是重要信号，但不能只看在岗者平均工资：低薪者退出就业，也会把平均数抬高。动态调整应同时参考实际工资、就业人数和劳动参与等指标，设定观察期、调整幅度及基本保障底线，再检验反馈是否稳定。"},{"id":98,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"作为再分配机制，起点收入与增值税有相似之处，但再分配过程由市场决定，而非特定机构主导。实施中应从经济活动增量切入，比如只适用于数字货币平台上的交易，降低对现有体系的冲击；原则上替代部分税务功能，而非给市场主体增加额外税负。","previous":"数字化的价值，在于依照公开规则核算、发放和审计，而不是代替公共决策。收益来源、分享比例和调整条件仍需依法确定，算法只能执行授权，不能自行决定哪些人的生活保障应当减少。应从规模可控、收支清楚的安排开始，逐步积累经验，而不是把整个分配体系一次性交给自动调节。","changes":[{"id":"C026","paragraph":98,"start":22,"end":42,"before":"但再分配过程由市场决定，而非特定机构主导","after":"但具体派发可以按预先确定的公开规则执行，减少逐项审批","reason":"市场价格提供信号，派发比例与权利规则仍须公共决策授权。把“无需机构决定”改为“减少个案审批”，保留原文希望降低任意干预的意图。","kind":"制度选择","impact":"需作者确认","sources":[]},{"id":"C027","paragraph":98,"start":57,"end":73,"before":"比如只适用于数字货币平台上的交易","after":"比如先在核算清楚、规模可控的范围试点，并借助数字货币平台执行","reason":"只按支付渠道征收会使同一经济活动因结算方式不同而负担不同，并诱导绕开平台。保留渐进试点，不把数字支付本身当作税基。","kind":"制度选择","impact":"需作者确认","sources":[]},{"id":"C028","paragraph":98,"start":111,"end":111,"before":"","after":"\n\n若替代现有税收，须交代相应公共支出如何继续获得资金；若新增提取，则应明确实际分担，而不能仅凭自动划转就认为没有额外负担。","reason":"原句“替代税务功能、不增加税负”并非不可能，但需要支出与收入对接。补条件，不把作者的收入提取方案擅自改成另一种税制。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["数字货币"],"numbers":[],"suggested":"作为再分配机制，起点收入与增值税有相似之处，但具体派发可以按预先确定的公开规则执行，减少逐项审批。实施中应从经济活动增量切入，比如先在核算清楚、规模可控的范围试点，并借助数字货币平台执行，降低对现有体系的冲击；原则上替代部分税务功能，而非给市场主体增加额外税负。\n\n若替代现有税收，须交代相应公共支出如何继续获得资金；若新增提取，则应明确实际分担，而不能仅凭自动划转就认为没有额外负担。"},{"id":99,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（一）核心理念与制度定位","original":"按当前经济发展水平，若每个增值环节派发6%，相当于每人每月约420 元，五口之家月均2100元。实际金额随技术水平和生产效率提升而增加。目前全球普遍实施的免费基础教育，就是一种类似的普惠性制度。古人难以想象今天每个孩童都享有免费教育，但免费教育在各国普及，不仅没让社会不堪重负，反而促进了巨大进步。起点收入只是把这种托底从免费基础教育扩展到民众基本生活保障。","previous":"以人均年度产出10万元、其中6%能够实际用于全民分享为例，平均每人每月约500元，五口之家约2500元。这只是规模测算，实际金额取决于可筹集收入、其他公共支出和领取人数，不能把全部产出都当作可以直接派发的现金。普惠基础教育提供了一个启示：面向所有人的基础保障，并不必然与发展对立，也可能成为发展条件的一部分。但现金保障与教育服务各有作用，不能因此相互替代。","changes":[{"id":"C029","paragraph":99,"start":0,"end":9,"before":"按当前经济发展水平","after":"按原稿采用的测算基数","reason":"保留每月420元、五口之家2100元，不再用假设10万元人均产出的500元替换。420元在6%下反推人均年产出约8.4万元；请作者补该基数的统计年度，再决定是否更新。","kind":"口径订正","impact":"保留原主张","sources":["S28"]}],"sourceIds":["S28"],"restoration":"撤回上一版自行换成假设人均产出10万元、每月500元、五口之家2500元的做法。恢复420/2100，单独核对对应年份与基数。","previousChanged":true,"chinaAnchors":[],"numbers":["6%","420","2100"],"suggested":"按原稿采用的测算基数，若每个增值环节派发6%，相当于每人每月约420 元，五口之家月均2100元。实际金额随技术水平和生产效率提升而增加。目前全球普遍实施的免费基础教育，就是一种类似的普惠性制度。古人难以想象今天每个孩童都享有免费教育，但免费教育在各国普及，不仅没让社会不堪重负，反而促进了巨大进步。起点收入只是把这种托底从免费基础教育扩展到民众基本生活保障。"},{"id":100,"page":10,"heading":true,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"（二）制度优势与运行逻辑","previous":"（二）制度优势与运行逻辑","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（二）制度优势与运行逻辑"},{"id":101,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"起点收入机制具有多重制度优势，能够在保留市场效率的同时实现普惠共享：","previous":"在筹资合理、公共服务得到保障的前提下，起点收入可以从以下几个方面改善现有分配：","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"起点收入机制具有多重制度优势，能够在保留市场效率的同时实现普惠共享："},{"id":102,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【避免通货膨胀】派发的每笔钱都来自经济体系创造的商品和服务，是已创造的价值，不会引发通胀。可进一步把平台上所有账户总额实时归整为固定数量的货币单元，让每个账户金额以占比形式表现，使价格和收入只有相对价值意义。","previous":"【以真实产出为基础】起点收入是对已有或新增产出支配权的安排，而不是单纯靠增加货币数量创造财富。这有助于明确资源约束，却不能保证没有价格压力。收入流向普通家庭后，消费的数量与结构都可能改变；住房、托育或医疗供给不足时，就需要同时扩大供给，不能只增加现金去竞争有限资源。","changes":[{"id":"C030","paragraph":102,"start":0,"end":8,"before":"【避免通货膨胀】","after":"【以真实产出为基础】","reason":"“避免通胀”是一个需要额外条件的效果承诺，而本段直接能说明的是资金与产出相联系。改小标题避免把会计来源当作价格稳定的证明。","kind":"逻辑补充","impact":"保留原主张","sources":[]},{"id":"C031","paragraph":102,"start":38,"end":44,"before":"不会引发通胀","after":"但仍须考虑新增购买力与住房、托育、医疗等具体供给是否匹配","reason":"来自既有价值，并不保证需求结构变化后没有价格压力。仅替换保证性结论，与原文第五部分“不能只用现金竞价有限资源”的说法对齐。","kind":"逻辑补充","impact":"保留原主张","sources":[]},{"id":"C032","paragraph":102,"start":104,"end":104,"before":"","after":"\n\n这种计价方式即使可行，也只能改变货币单位的表示，不能替代对相对价格与真实供求的调节。","reason":"原来的账户总额固定、占比计价构想不直接删除，而作为思想实验保留；补明改计价单位不能自行消除真实物价与分配压力。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【以真实产出为基础】派发的每笔钱都来自经济体系创造的商品和服务，是已创造的价值，但仍须考虑新增购买力与住房、托育、医疗等具体供给是否匹配。可进一步把平台上所有账户总额实时归整为固定数量的货币单元，让每个账户金额以占比形式表现，使价格和收入只有相对价值意义。\n\n这种计价方式即使可行，也只能改变货币单位的表示，不能替代对相对价格与真实供求的调节。"},{"id":103,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【平衡就业市场】企业招不到员工时，工资上涨压低派发比例，将更多人推向就业市场；工资停滞时，派发比例逐步提高。就业市场成为匹配劳动力供需的决定性因素，不受最低工资制等扭曲。","previous":"【改善就业选择】基本生活不再完全取决于是否立即找到工作，劳动者就有更多时间学习、转岗、照护家人，也有条件拒绝严重损害健康和尊严的低效劳动。企业仍需用合理工资和工作条件吸引员工。起点收入不宜被用来替代最低工资、加班报酬等劳动保护，否则公共支持可能反而补贴了低报酬用工。","changes":[{"id":"C033","paragraph":103,"start":74,"end":84,"before":"不受最低工资制等扭曲","after":"同时与最低工资、加班报酬等劳动保护相衔接","reason":"原文的劳动保护建议要求兑现加班报酬，此处却把最低工资只当作扭曲。两者需一致：公共收入不应成为雇主压低工资的理由。修改涉及制度选择，交作者决定。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S29"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【平衡就业市场】企业招不到员工时，工资上涨压低派发比例，将更多人推向就业市场；工资停滞时，派发比例逐步提高。就业市场成为匹配劳动力供需的决定性因素，同时与最低工资、加班报酬等劳动保护相衔接。"},{"id":104,"page":10,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【人人有份，多劳多得】低保和失业救济以失去工作或收入低于门槛为前提，牺牲高收入者补偿低收入者，有人甚至因不愿失去福利而放弃工作。起点收入派发对象是所有国民，婴幼儿、学生、上班族、不工作者、企业主都人人有份。实行起点收入后，人们依然有动力工作，工作所得是额外收入，激励机制依然有效且上不封顶。起点收入与就业市场挂钩，能确保企业招到员工，不会让懒惰拖累社会发展。","previous":"【人人有份，多劳多得】起点收入的发放对象是所有国民，婴幼儿、学生、上班族、不工作者、企业主都人人有份。人们不会仅因开始工作就失去这笔基础收入，工作所得仍然增加可支配资源，有利于减少资格门槛造成的激励扭曲。但筹资环节的税负、其他福利的退出规则也会影响激励，必须一并考虑，而不能仅凭“人人有份”就保证劳动供给不受影响。","changes":[{"id":"C034","paragraph":104,"start":157,"end":178,"before":"能确保企业招到员工，不会让懒惰拖累社会发展","after":"可以根据劳动力供求调整，但仍需观察对劳动投入和必要服务的实际影响","reason":"人人有份保留了增加劳动所得的激励，却不足以保证所有岗位都有人应聘。只替换绝对保证，保留普惠、多劳多得、上不封顶及原有制度特色。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【人人有份，多劳多得】低保和失业救济以失去工作或收入低于门槛为前提，牺牲高收入者补偿低收入者，有人甚至因不愿失去福利而放弃工作。起点收入派发对象是所有国民，婴幼儿、学生、上班族、不工作者、企业主都人人有份。实行起点收入后，人们依然有动力工作，工作所得是额外收入，激励机制依然有效且上不封顶。起点收入与就业市场挂钩，可以根据劳动力供求调整，但仍需观察对劳动投入和必要服务的实际影响。"},{"id":105,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【维持市场机制】起点收入能维持社会有效需求，通过价格机制由市场满足，商家优胜劣汰的竞争得以维持。起点收入源自交易增加值，不直接增加企业经营成本，该赚钱的企业依然赚钱，只是全民参与利润分成。","previous":"【维持市场机制】起点收入通过提高支付能力支持有效需求，商品和服务仍主要由市场通过价格和竞争提供。该赚钱的企业仍然有盈利空间，创新与投资仍然应当获得回报。分享比例应兼顾企业发展的需要与居民消费的需要，使市场既有创造财富的动力，也有承接产出的需求。","changes":[{"id":"C035","paragraph":105,"start":48,"end":93,"before":"起点收入源自交易增加值，不直接增加企业经营成本，该赚钱的企业依然赚钱，只是全民参与利润分成","after":"起点收入源自交易增加值，实际负担仍需合理分担；分享比例应为企业保留盈利和创新空间，同时使全民能够分享新增成果","reason":"增加值不只是利润，且提取并非没有经济负担。具体矛盾已在6%例子中说明，本处只修正对应结论，不另换抽象公平口号。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【维持市场机制】起点收入能维持社会有效需求，通过价格机制由市场满足，商家优胜劣汰的竞争得以维持。起点收入源自交易增加值，实际负担仍需合理分担；分享比例应为企业保留盈利和创新空间，同时使全民能够分享新增成果。"},{"id":106,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【节省人力物力】相比基于税务和财政的全民基本收入，在支付平台上实现的起点收入更加公平透明，去除遴选过程，既消除权力寻租，又避免受益者背负\"社会负担者\"的尴尬。","previous":"【节省人力物力】普惠发放可以减少反复核查收入资格的手续，也有助于减轻受益者的污名感。支付平台使到账和审计更加便捷，规则公开、账户安全、申诉渠道和线下服务则为公平执行提供保障。","changes":[{"id":"C036","paragraph":106,"start":52,"end":59,"before":"既消除权力寻租","after":"既减少资格审批中的寻租空间","reason":"“去除遴选”可减少特定环节的寻租，不意味着账户管理和资金分配已不存在权力风险。限定环节，保留普惠发放的原有优势。","kind":"措辞","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【节省人力物力】相比基于税务和财政的全民基本收入，在支付平台上实现的起点收入更加公平透明，去除遴选过程，既减少资格审批中的寻租空间，又避免受益者背负\"社会负担者\"的尴尬。"},{"id":107,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【促进共同体意识】起点收入是国民作为国家主体直接享有的经济发展成果，可强化国家认同，消弭地域差别，促进人口流动。","previous":"【促进共同体意识】起点收入使国民能够直接感受到自己是经济发展成果的分享者。全国统一的基础规则，有助于减少因地域和就业身份造成的保障落差，促进人口流动与共同体认同，但不能以此替代地区间公共服务的改善。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【促进共同体意识】起点收入是国民作为国家主体直接享有的经济发展成果，可强化国家认同，消弭地域差别，促进人口流动。"},{"id":108,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"【可扩展性】除起点收入外，国民还有工资收入和投资收益。工资和投资收入也可按比例部分派发给全民，比例按收入获得者的年收入采取累进制，避免收入过度集中。对起点收入的使用可做出限制：用于消费的比例设定下限，保底生活水平，确保市场内需规模；用于投资的比例设定上限，控制风险。这些限制也可与宏观经济指标挂钩，为避免经济失衡提供负反馈机制。","previous":"【可扩展性】除起点收入外，国民仍有工资收入和投资收益。可以通过累进税制等方式调节收入过度集中，在统一基础金额之上，另行安排儿童、残障者和照护者等群体所需的支持。基本分享与特殊需要分开核算，才能既保留普惠性，又不把不同处境的人简单同等对待。","changes":[{"id":"C037","paragraph":108,"start":164,"end":164,"before":"","after":"\n\n若对用途设置限制，应说明必要性与适用范围，保留领取者安排基本生活的自主权，不宜把普惠分享演变为对日常消费的细密管制。","reason":"本段限制消费与投资，和前文拓展选择空间有张力。不静默删除作者的控制设想，而补一个需要共同接受的自主性边界。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"【可扩展性】除起点收入外，国民还有工资收入和投资收益。工资和投资收入也可按比例部分派发给全民，比例按收入获得者的年收入采取累进制，避免收入过度集中。对起点收入的使用可做出限制：用于消费的比例设定下限，保底生活水平，确保市场内需规模；用于投资的比例设定上限，控制风险。
