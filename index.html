这些限制也可与宏观经济指标挂钩，为避免经济失衡提供负反馈机制。\n\n若对用途设置限制，应说明必要性与适用范围，保留领取者安排基本生活的自主权，不宜把普惠分享演变为对日常消费的细密管制。"},{"id":109,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"派发比例还可与年龄、居住地等极少数特征挂钩，反映社会偏好和政策取向。若担忧人口萎缩，发放金额可向婴幼儿倾斜，直至生育率升至更替水平。派发比例也可与交易类型挂钩，比如对实体行业规定比金融行业更低的派发承担比例，提升实体企业相对金融企业的收益。若将发放对象从个人扩展到各级政府和组织，起点收入可实现税收和财政功能，整合养老金、低保、失业救济、扶贫、最低工资等诸多福利项目。","previous":"起点收入原则上应由领取者自主安排，不能一面强调人的选择，另一面又普遍规定其必须消费多少、可以储蓄多少。面向儿童的资金可以依法加强监护与使用保障，面向特定公共服务的补助也可以定向安排，但不宜由此扩展为对所有人日常生活的细密控制。","changes":[{"id":"C038","paragraph":109,"start":184,"end":184,"before":"","after":"\n\n制度衔接应分别处理既有缴费权益和特殊困难群体的额外需要，不能把统一发放等同于取消所有差异化保障。","reason":"普惠现金与缴费养老金、残障支持具有不同依据。保留整合方向，要求说明哪些权益不能因整合被冲销。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"派发比例还可与年龄、居住地等极少数特征挂钩，反映社会偏好和政策取向。若担忧人口萎缩，发放金额可向婴幼儿倾斜，直至生育率升至更替水平。派发比例也可与交易类型挂钩，比如对实体行业规定比金融行业更低的派发承担比例，提升实体企业相对金融企业的收益。若将发放对象从个人扩展到各级政府和组织，起点收入可实现税收和财政功能，整合养老金、低保、失业救济、扶贫、最低工资等诸多福利项目。\n\n制度衔接应分别处理既有缴费权益和特殊困难群体的额外需要，不能把统一发放等同于取消所有差异化保障。"},{"id":110,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（二）制度优势与运行逻辑","original":"长远来看，起点收入机制可逐步演化为公共决策体系。将派发比例与就业市场工资走势挂钩，是一种平衡社会整体工作投入和消费需求偏好的优化机制。扩展到起点收入的派发和使用规则变更上，可让利益分配充分反映社会偏好和集体智慧。当然，这需要更坚实的技术基础和深入的理论探讨。","previous":"长远来看，公开、稳定的收益分享可以与公共服务和社会保障逐步衔接，减少重复手续。但养老金中的缴费权益、失业保险中的风险保障，以及特殊困难群体的额外需要，都有各自依据，不能因为建立了普惠现金，就一并取消。起点收入应当增加人的保障与选择，而不是以制度整合之名降低已经获得的保障。","changes":[{"id":"C039","paragraph":110,"start":129,"end":129,"before":"","after":"\n\n规则的形成与变更仍须经过公共决策，技术系统负责执行和公开核算，而不能自行决定分配权利。","reason":"“演化为公共决策体系”容易混淆偏好信号、集体授权和程序执行。保留远景探索，补清算法的权限边界。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"长远来看，起点收入机制可逐步演化为公共决策体系。将派发比例与就业市场工资走势挂钩，是一种平衡社会整体工作投入和消费需求偏好的优化机制。扩展到起点收入的派发和使用规则变更上，可让利益分配充分反映社会偏好和集体智慧。当然，这需要更坚实的技术基础和深入的理论探讨。\n\n规则的形成与变更仍须经过公共决策，技术系统负责执行和公开核算，而不能自行决定分配权利。"},{"id":111,"page":11,"heading":true,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"（三）现实意义与长远价值","previous":"（三）现实意义与长远价值","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（三）现实意义与长远价值"},{"id":112,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"起点收入给下限托底，能从根本上消除过大的贫富差距，不仅让贫困底层，也让中间阶层乃至富裕阶层都能直接分享经济发展果实。在当下中国，中间阶层是社会中流砥柱，人数众多，关注社会公平。相比对底层的扶贫，普惠性的起点收入能造福更多民众，给全体民众更多安全感。若起点收入能确保所有人拥有基本尊严和像样的生活，人们也就没有后顾之忧，社会将成为各阶层和谐发展、共同进步的平台。","previous":"起点收入给下限托底，可以改善底层群体和中间阶层的安全感，使更多人直接分享经济发展成果。它抬高的是全体成员的发展起点，与调节资产集中、改善教育机会和缩小地区差异等制度相互配合。贫富差距越大，越需要让普通人获得不随一次失业便消失的生活依托。","changes":[{"id":"C040","paragraph":112,"start":10,"end":24,"before":"能从根本上消除过大的贫富差距","after":"有助于缩小过大的贫富差距","reason":"现金托底直接抬高收入下限，但不等于自动消除资产、教育、地域等差距。只改效果强度，原段中间阶层和全民安全感的论证保留。","kind":"措辞","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"起点收入给下限托底，有助于缩小过大的贫富差距，不仅让贫困底层，也让中间阶层乃至富裕阶层都能直接分享经济发展果实。在当下中国，中间阶层是社会中流砥柱，人数众多，关注社会公平。相比对底层的扶贫，普惠性的起点收入能造福更多民众，给全体民众更多安全感。若起点收入能确保所有人拥有基本尊严和像样的生活，人们也就没有后顾之忧，社会将成为各阶层和谐发展、共同进步的平台。"},{"id":113,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"起点收入提升最短板，而非削平最长板。若起点收入足以维持日常生活，人们更容易按真正兴趣主动工作，而非迫于压力被动工作。在人工智能时代，更多工作需要创造力，而多劳多得、上不封顶的正面激励机制，特别是从事自己真正有兴趣的工作，对激发创造力更为有效。免除了失去生计的恐惧，人们更可能去从事自己真正感兴趣的工作，更有自主性也更能发挥创造力。创新创业过程具有天然不确定性，起点收入的托底让失败者的生计得到基本保证，可提升个体风险承受力，孕育社会的进取精神。","previous":"起点收入提升最短板，而非削平最长板。若基础收入能够减轻失去生计的恐惧，人们就更有条件按兴趣主动工作，而非完全迫于压力被动工作。创新创业具有天然不确定性，托底安排可以提高个人承受失败的能力，为进取和创造留下空间。能否真正形成更多创新，还取决于教育、机会和市场环境；但让失败不等于生活崩溃，本身就是值得争取的改善。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"起点收入提升最短板，而非削平最长板。若起点收入足以维持日常生活，人们更容易按真正兴趣主动工作，而非迫于压力被动工作。在人工智能时代，更多工作需要创造力，而多劳多得、上不封顶的正面激励机制，特别是从事自己真正有兴趣的工作，对激发创造力更为有效。免除了失去生计的恐惧，人们更可能去从事自己真正感兴趣的工作，更有自主性也更能发挥创造力。创新创业过程具有天然不确定性，起点收入的托底让失败者的生计得到基本保证，可提升个体风险承受力，孕育社会的进取精神。"},{"id":114,"page":11,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"当前主流经济制度中，工作是获得收入的主要前提。在此分配机制下，经济和社会政策最关心的，与其说是提高经济产出让所有人过得更好，不如说是维持就业体系，让人们通过忙碌的工作换取经济产出，而工作本身是否有益于社会，并非直接考量。甚至可以说，维持人们勉强可以接受的分配机制，催生了很多无效甚至有害的工作。","previous":"当前主流经济制度中，工作仍是多数人获得收入的主要前提。因而，经济和社会政策容易把维持就业形式放在首位，让人们通过忙碌换取产出，却未必充分追问这些工作是否真正增进生活价值。建立基础分享，不是放弃就业，而是使社会能够更从容地淘汰低效任务，同时保留真实的成长、创造和参与机会。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"当前主流经济制度中，工作是获得收入的主要前提。在此分配机制下，经济和社会政策最关心的，与其说是提高经济产出让所有人过得更好，不如说是维持就业体系，让人们通过忙碌的工作换取经济产出，而工作本身是否有益于社会，并非直接考量。甚至可以说，维持人们勉强可以接受的分配机制，催生了很多无效甚至有害的工作。"},{"id":115,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"全民起点收入机制将分派比例与就业市场挂钩，为社会提供了优化平衡整体工作时间和社会产出的机制。若人们整体希望牺牲更多闲暇换取更大经济产出，会不满足于起点收入而去寻找工作，增加就业市场劳动力供给，拉低平均工资水平，从而推升起点收入分派比例，形成新的均衡。相对于一次性全国统一调整作息制度，起点收入机制提供了一种连续、实时、双向、自反馈的工作时间调整模式。","previous":"当一部分人选择减少市场劳动、增加照护和学习，不能仅凭工时下降就认定政策失败。但必要产出能否维持、关键服务有无短缺、成本由谁承担，也必须同时观察。现金能够改善生活底线，却不能包办身份、交往和成就感。社区服务、职业训练、科研文化和公共参与，仍需为人们提供真实的事情可做。","changes":[{"id":"C041","paragraph":115,"start":175,"end":175,"before":"","after":"\n\n上述过程能否形成稳定均衡，还取决于企业需求、价格变化和调整时滞，不能只凭工资与派发比例方向相反便认定反馈必然有效。","reason":"保留原来的连续、自反馈构想及其思想实验，不再换成无关论述。把稳定性作为需验证的问题明示，避免把方向判断当作已经证明的系统性质。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S29"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"全民起点收入机制将分派比例与就业市场挂钩，为社会提供了优化平衡整体工作时间和社会产出的机制。若人们整体希望牺牲更多闲暇换取更大经济产出，会不满足于起点收入而去寻找工作，增加就业市场劳动力供给，拉低平均工资水平，从而推升起点收入分派比例，形成新的均衡。相对于一次性全国统一调整作息制度，起点收入机制提供了一种连续、实时、双向、自反馈的工作时间调整模式。\n\n上述过程能否形成稳定均衡，还取决于企业需求、价格变化和调整时滞，不能只凭工资与派发比例方向相反便认定反馈必然有效。"},{"id":116,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"在最极端情况下，假设人类所有工作都被人工智能取代，人类无需劳作就可享用各种商品和服务。这本来是天大的好事，但在目前以工作作为分配前提的制度下，所有人都将因没有工作而失去收入，反而变得赤贫。上述思想实验说明，当人类社会充分接近全能人工智能状态时，当下以劳动作为收入前提的分配制度就将趋于失效。","previous":"在最极端的思想实验中，假设人类需要的各种商品和服务都可由机器提供，人类无需承担原有的生产劳动。这本来意味着极大的富裕，但劳动收入消失，并不等于所有人的收入都消失。机器及相关资产的所有者仍可能获得收益，真正面临被排除风险的，是既没有劳动收入、又没有足够资产权益的人。","changes":[{"id":"C042","paragraph":116,"start":71,"end":93,"before":"所有人都将因没有工作而失去收入，反而变得赤贫","after":"没有劳动收入、又缺少资产收益和其他分享权益的人，就可能被排除在富裕之外","reason":"工作消失直接对应劳动收入消失，资产所有者仍可能有收益。这是思想实验中的逻辑遗漏，不是反对起点收入；修正后反而更明确需要解决谁的分享权。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S30"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"在最极端情况下，假设人类所有工作都被人工智能取代，人类无需劳作就可享用各种商品和服务。这本来是天大的好事，但在目前以工作作为分配前提的制度下，没有劳动收入、又缺少资产收益和其他分享权益的人，就可能被排除在富裕之外。上述思想实验说明，当人类社会充分接近全能人工智能状态时，当下以劳动作为收入前提的分配制度就将趋于失效。"},{"id":117,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（三）现实意义与长远价值","original":"但在起点收入机制下，社会转换将变得非常自然。随着越来越多工作被人工智能取代，就业市场工资水平不断下降，自动推升起点收入发放比例。假设所有工作都被机器取代，就业市场工资降为零，增加值将100%派发给所有公民。这样的结局是合理的，因为在机器取代所有工作的场景中，所有人的贡献都是一样的，也就是零。在起点收入制度下，人工智能的充分发展，或许能最终促使人类回归更基本的意义，即生存、繁衍和对美好生活的追求。","previous":"这个思想实验说明，当产出越来越不依赖当期劳动时，社会必须更清楚地安排收益分享权，而不是仅靠工资把生产与生活连接起来。起点收入提供的是一种可能方向：随着可供分享的公共收益增加，使每个人的基本生活不再依赖企业是否需要其即时劳动。至于分享达到何种水平，取决于生产条件、产权安排和公共选择，不能从工资下降直接推导出来。即使机器承担了全部生产任务，照护、创造和社会参与仍然具有价值。人工智能的充分发展，应当使人更有能力追求生存、繁衍与美好生活。","changes":[{"id":"C043","paragraph":117,"start":64,"end":146,"before":"假设所有工作都被机器取代，就业市场工资降为零，增加值将100%派发给所有公民。这样的结局是合理的，因为在机器取代所有工作的场景中，所有人的贡献都是一样的，也就是零。","after":"假设所有工作都被机器取代，在扣除生产维护和公共需要后，可供个人消费的成果也可以研究由全体公民100%分享。但这一安排取决于产权和分配制度，不能由工资降为零自动推出；人的照护、创造和社会参与，更不能因此被视为没有价值。","reason":"保留100%作为极端思想实验中的制度选项，不再从“工资为零”推出“贡献均为零、自动全额派发”。补出生产维护、产权和非市场贡献三个必要前提。本处改动实质较大，必须作者逐项确认。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S30"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["100%"],"suggested":"但在起点收入机制下，社会转换将变得非常自然。随着越来越多工作被人工智能取代，就业市场工资水平不断下降，自动推升起点收入发放比例。假设所有工作都被机器取代，在扣除生产维护和公共需要后，可供个人消费的成果也可以研究由全体公民100%分享。但这一安排取决于产权和分配制度，不能由工资降为零自动推出；人的照护、创造和社会参与，更不能因此被视为没有价值。在起点收入制度下，人工智能的充分发展，或许能最终促使人类回归更基本的意义，即生存、繁衍和对美好生活的追求。"},{"id":118,"page":12,"heading":true,"section":"四、起点收入的基本构想","subsection":"（四）中国优势与审慎推进","original":"（四）中国优势与审慎推进","previous":"（四）中国优势与审慎推进","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["中国"],"numbers":[],"suggested":"（四）中国优势与审慎推进"},{"id":119,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（四）中国优势与审慎推进","original":"决定社会发展水平和民众生活质量的最终因素是生产和创造能力。中国有强大的制造、建造能力以及日益增强的创造力，民众理应过上与这种能力相匹配的生活。起点收入机制在保持正面激励机制的前提下，让全民更直接享受社会发展成果。由于派发比例与就业市场挂钩，劳动和需求的偏好在社会范围内自然平衡，随着生产效率提升，派发比例也会水涨船高。","previous":"决定社会发展水平和民众生活质量的根本条件，是生产和创造能力，以及将其转化为生活改善的制度。中国有强大的制造、建造能力和日益增强的创造力，民众理应过上与这种能力相匹配的生活。起点收入的探索，应在保留正面激励的同时，使全民更加直接地分享社会发展成果。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"决定社会发展水平和民众生活质量的最终因素是生产和创造能力。中国有强大的制造、建造能力以及日益增强的创造力，民众理应过上与这种能力相匹配的生活。起点收入机制在保持正面激励机制的前提下，让全民更直接享受社会发展成果。由于派发比例与就业市场挂钩，劳动和需求的偏好在社会范围内自然平衡，随着生产效率提升，派发比例也会水涨船高。"},{"id":120,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（四）中国优势与审慎推进","original":"这不仅可消除贫困，也可确保社会基本内需，让经济政策回归提升有效产出、减少无效劳动的初衷。通过保就业来维持勉强分配制度不再必要，养育后代付出的代价能更好得以体现。加上发放金额可向孩童倾斜，生育率提升到更替水平以上可以期待。","previous":"这一方向有助于改善基本需求和长期预期，使经济政策更多回到提高有效产出、减少无效劳动的初衷。向儿童和养育家庭增加支持，也可以使养育付出的代价得到更充分体现。但收入只是影响家庭选择的条件之一，不能保证提高派发比例就必然使生育率达到更替水平。","changes":[{"id":"C044","paragraph":120,"start":93,"end":109,"before":"生育率提升到更替水平以上可以期待","after":"可以为生育率回升至更替水平创造更好的条件","reason":"现金支持改善养育条件，不等于已证明能达到特定生育水平。保留更替水平目标，仅避免把目标当作机制的保证结果。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"这不仅可消除贫困，也可确保社会基本内需，让经济政策回归提升有效产出、减少无效劳动的初衷。通过保就业来维持勉强分配制度不再必要，养育后代付出的代价能更好得以体现。加上发放金额可向孩童倾斜，可以为生育率回升至更替水平创造更好的条件。"},{"id":121,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（四）中国优势与审慎推进","original":"中国实行起点收入有独特优势：主体民族占绝对多数，血缘、文化、语言高度一致，共同体意识强；社会主义制度强调人民共享发展成果；数字货币和移动支付技术成熟，为自动派发提供技术基础；民众勤劳程度高，对\"躺平\"担忧相对较小。","previous":"中国探索起点收入具有自身条件：社会主义制度强调人民共享发展成果，统一市场、公共基础设施和组织能力有利于形成全国性安排，数字支付可以降低执行成本。共同体认同为普惠分享提供了基础，但制度的正当性仍应体现在规则公平、财务可持续和民众实际受益上。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国","数字货币"],"numbers":[],"suggested":"中国实行起点收入有独特优势：主体民族占绝对多数，血缘、文化、语言高度一致，共同体意识强；社会主义制度强调人民共享发展成果；数字货币和移动支付技术成熟，为自动派发提供技术基础；民众勤劳程度高，对\"躺平\"担忧相对较小。"},{"id":122,"page":12,"heading":false,"section":"四、起点收入的基本构想","subsection":"（四）中国优势与审慎推进","original":"但历史经验表明，改变人类基本模式的宏大设计，若缺乏审慎，可能带来灾难。乌托邦理想国、低效计划经济、严厉计划生育皆是教训。因此，起点收入目前只是引发讨论的思想实验，而非现实政策建议。这并不妨碍现在就开始尝试：以财政或发行国债方式向全民派发一定金额的基本收入，可作为起点——既是对国民抗疫付出的补偿，也是保障民生、恢复经济的有效途径，更能积累实现起点收入的经验和教训。长远来看，这不仅是应对经济波动的权宜之计，更是理顺经济关系、促进社会可持续发展、维持中华文明薪火相传的可能出路。","previous":"历史经验表明，改变基本经济关系的宏大设计，若缺乏审慎，可能造成严重后果。因此，完整的起点收入体系仍是需要论证和检验的制度构想，不宜立即整体推行。这并不妨碍现在就开始规模适当、资金明确的探索，尤其是优先改善养育支持和转型保障。在全国推开之前，应比较现金与公共服务的不同组合，观察劳动、物价和企业行为，检验在经济增长不及预期时能否维持承诺。审慎不是等待问题自行解决，而是把改革分解为能够承担责任的步骤。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"但历史经验表明，改变人类基本模式的宏大设计，若缺乏审慎，可能带来灾难。乌托邦理想国、低效计划经济、严厉计划生育皆是教训。因此，起点收入目前只是引发讨论的思想实验，而非现实政策建议。这并不妨碍现在就开始尝试：以财政或发行国债方式向全民派发一定金额的基本收入，可作为起点——既是对国民抗疫付出的补偿，也是保障民生、恢复经济的有效途径，更能积累实现起点收入的经验和教训。长远来看，这不仅是应对经济波动的权宜之计，更是理顺经济关系、促进社会可持续发展、维持中华文明薪火相传的可能出路。"},{"id":123,"page":12,"heading":true,"section":"五、以养育金为切入点的具体建议","subsection":"","original":"五、以养育金为切入点的具体建议","previous":"五、以养育金为切入点的具体建议","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"五、以养育金为切入点的具体建议"},{"id":124,"page":12,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"","original":"起点收入是面向未来的制度构想，需要探索和逐步完善。但在当下，我们亟需能够立即启动、快速见效的政策抓手。基于前述分析，大规模普惠养育金是最现实、最紧迫的切入点——它既能直接回应超低生育危机，又能带动内需、缓解就业压力，并为起点收入制度积累经验。","previous":"起点收入是面向未来的制度构想，需要探索和逐步完善。但在当下，超低生育与养育负担已不容等待。大规模普惠养育金应当成为最现实、最紧迫的切入点：它既支持已经出生的孩子，也帮助有生育意愿的家庭承担长期责任，并能为普惠发放、稳定承诺和成本分担积累经验。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"起点收入是面向未来的制度构想，需要探索和逐步完善。但在当下，我们亟需能够立即启动、快速见效的政策抓手。基于前述分析，大规模普惠养育金是最现实、最紧迫的切入点——它既能直接回应超低生育危机，又能带动内需、缓解就业压力，并为起点收入制度积累经验。"},{"id":125,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"","original":"政策目标不是阻止机器替代低效任务，而是建立一套随生产能力、就业和人口变化自动调整的分配与积累机制，把效率提高转化为全民基础收入、养育能力、公共服务、闲暇时间和新的就业入口。以下建议分别从养育支持、公共服务、劳动制度和治理体系入手，回应前述经济、人口与社会风险。本质是把技术进步转化为共同富裕的现实路径——让发展成果由全体人民共享。","previous":"政策目标不是阻止机器替代低效任务，而是把效率提高转化为居民收入、养育能力、公共服务、闲暇时间和新的职业入口。养育支持并不取代对失业青年、转岗劳动者和其他困难群体的保障；现金、服务和职业机会各有作用，需要共同推进。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"政策目标不是阻止机器替代低效任务，而是建立一套随生产能力、就业和人口变化自动调整的分配与积累机制，把效率提高转化为全民基础收入、养育能力、公共服务、闲暇时间和新的就业入口。以下建议分别从养育支持、公共服务、劳动制度和治理体系入手，回应前述经济、人口与社会风险。本质是把技术进步转化为共同富裕的现实路径——让发展成果由全体人民共享。"},{"id":126,"page":13,"heading":true,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"（一）以大规模普惠养育金作为最现实的切入点","previous":"（一）以大规模普惠养育金作为最现实的切入点","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（一）以大规模普惠养育金作为最现实的切入点"},{"id":127,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"起点收入最现实、也是最好的切入点，是先向养育家庭大规模发放普惠养育金。让生育养育成为有收入的社会劳动，既能把共同生产成果送到消费需求最强的家庭，也能直接回应人口和文明延续危机，更能使部分劳动者主动退出过度竞争的劳动力市场，缓解\"内卷\"、增加家庭时间。","previous":"起点收入最现实的切入点，是先向养育家庭大规模发放普惠养育金。儿童不能依靠自己的劳动保障生活，养育又使家庭承担持续的时间、金钱与职业机会成本，因而具有优先获得公共支持的充分理由。让生育养育成为有收入、有尊严的社会劳动，既能把共同生产成果送到有实际需要的家庭，也能使人口和文明延续所需的投入得到更合理的分担。\n\n这种支持不是用补贴购买出生人口，也不是鼓励女性退出职业体系。它应使愿意生育的人不因经济和职业代价而被迫放弃，使选择照护的人获得保障，也使希望继续就业的人有托育和职业衔接条件。不生育者同样享有基本保障，社会共同承担养育成本，并不意味着每个人必须作出相同的生活选择。","changes":[{"id":"C045","paragraph":127,"start":125,"end":125,"before":"","after":"\n\n养育的长期收益超出家庭，而成本首先由家庭承担，这使养育支持具有优先的公共理由。选择照护的人应获得保障，希望继续就业的人也应有托育与职业衔接条件；不能把退出职业体系当作支持生育的默认结果。","reason":"不删除“有收入的社会劳动”和缓解内卷的作者立场。补清为何优先，以及支持养育不等于默认让女性离职，回应前文女性同时承担就业与照护风险的判断。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"起点收入最现实、也是最好的切入点，是先向养育家庭大规模发放普惠养育金。让生育养育成为有收入的社会劳动，既能把共同生产成果送到消费需求最强的家庭，也能直接回应人口和文明延续危机，更能使部分劳动者主动退出过度竞争的劳动力市场，缓解\"内卷\"、增加家庭时间。\n\n养育的长期收益超出家庭，而成本首先由家庭承担，这使养育支持具有优先的公共理由。选择照护的人应获得保障，希望继续就业的人也应有托育与职业衔接条件；不能把退出职业体系当作支持生育的默认结果。"},{"id":128,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"建议把养育金逐步提高至GDP 的2%—5%，形成稳定、持续、可预期的国家制度：第一孩每月1000元，第二孩每月2000 元，第三孩及以上每月3000 元，持续至16 周岁；也可在出生时一次性发放10 万元，或与长期按月支付组合。地方可按生活成本适度加码。","previous":"建议把普惠养育金作为国家长期投入的重点，逐步向GDP的2%—5%这一规模区间推进，并据此开展分阶段预算测算，形成稳定、持续、可预期的制度。具体方案可考虑第一孩每月1000元，第二孩每月2000元，第三孩及以上每月3000元，持续至16周岁；也可比较出生时一次性发放10万元，或与长期按月支付相结合的方案。地方可按生活成本适度加码。\n\n具体方案必须分别列明覆盖年龄、孩次、已有儿童与新增出生的过渡安排，不能把上述几种选择未经核算就全部叠加。儿童基础保障应体现平等发展需要，多孩家庭的额外支持则应说明对应的养育负担和政策目标。支出占GDP的比例是讨论投入力度的尺度，不能替代按实际受益人数计算的年度预算。","changes":[{"id":"C046","paragraph":128,"start":127,"end":127,"before":"","after":"\n\n上述标准需要结合覆盖年龄、孩次、已有儿童与新增出生的过渡安排逐年核算。一次性与按月方案是可比较的选择，不能未经测算便全部叠加。","reason":"GDP的2%—5%、1000/2000/3000元、16周岁、10万元全部保留。只补预算需哪些人数与覆盖口径，避免把几个备选方案重复算作同一承诺。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S31"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2%","5%","1000","2000","3000","16","10"],"suggested":"建议把养育金逐步提高至GDP 的2%—5%，形成稳定、持续、可预期的国家制度：第一孩每月1000元，第二孩每月2000 元，第三孩及以上每月3000 元，持续至16 周岁；也可在出生时一次性发放10 万元，或与长期按月支付组合。地方可按生活成本适度加码。\n\n上述标准需要结合覆盖年龄、孩次、已有儿童与新增出生的过渡安排逐年核算。一次性与按月方案是可比较的选择，不能未经测算便全部叠加。"},{"id":129,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"现金之外，应按子女数量累进减免个人所得税和个人社会保险缴费，第二孩相关负担减半，第三孩及以上原则上免除；家庭照护婴幼儿的时间可折算社会保险缴费年限。同步增加育儿家庭保障性住房，降低住房与教育资源绑定形成的不确定性。","previous":"现金之外，可按子女数量研究累进减免个人所得税和个人社会保险缴费，在合理限额内，对第二孩、第三孩及以上家庭分别给予更大支持。低收入家庭没有足够税额可以抵扣的，应以现金或可退还抵免方式受益，避免支持主要落到较高收入者身上。照护婴幼儿期间的社会保险权益，可通过财政代缴或补助予以衔接，不能只减缴费而不补足相应权益。同步增加育儿家庭保障性住房，降低住房与教育资源绑定形成的不确定性。","changes":[{"id":"C047","paragraph":129,"start":107,"end":107,"before":"","after":"\n\n对没有足够税额可以抵扣的低收入家庭，应另以现金或可退还抵免等方式给予相应支持；减免社会保险缴费，也须衔接相应的权益和资金来源。","reason":"保留第二孩减半、第三孩及以上原则免除等原始政策参数。新增两项原文遗漏：无税可减的家庭如何受益、社保少缴后权益如何补足；不擅自另加限额替换原案。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S32"],"restoration":"恢复原稿二孩减半、三孩及以上免除的明确政策力度，不以笼统的“更大支持”代替；公平与权益条件以独立增补呈现。","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"现金之外，应按子女数量累进减免个人所得税和个人社会保险缴费，第二孩相关负担减半，第三孩及以上原则上免除；家庭照护婴幼儿的时间可折算社会保险缴费年限。同步增加育儿家庭保障性住房，降低住房与教育资源绑定形成的不确定性。\n\n对没有足够税额可以抵扣的低收入家庭，应另以现金或可退还抵免等方式给予相应支持；减免社会保险缴费，也须衔接相应的权益和资金来源。"},{"id":130,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"养育金可由中央财政、超长期人口特别国债、政策性金融和国家人口发展基金独立滚动核算。人的出生到进入完整经济循环需要二十年以上，不能只按当期财政消费评价。以养育金切入后，可逐步把普惠分配扩展到其他国民，使起点收入从理念变成可运行的基础经济制度。","previous":"养育金应由中央财政承担基础责任，地方适度加码，并可研究设立国家人口发展基金进行独立核算。人的出生到进入完整经济循环需要二十年以上，不能只按当期消费评价。必要的超长期人口特别国债可以用于跨期安排，但必须列明偿付来源，不能把未来孩子可能创造的税收当作已经兑现的收入。政策性金融更适合支持有相应偿付安排的托育等设施建设，不宜被用来掩盖长期现金承诺的财政成本。","changes":[{"id":"C048","paragraph":130,"start":120,"end":120,"before":"","after":"\n\n长期价值需要长期投入，但并不意味着没有当期支出和未来偿付。国债应明确偿付安排，基金应公开收支，政策性金融则需对应适合融资的项目，不能用工具名称代替资金来源。","reason":"保留中央财政、人口特别国债、政策性金融和人口基金四个工具。说明它们不是四笔已存在的钱，修复资金论证，不把大力度养育支持改成财政保守主张。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S33"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"养育金可由中央财政、超长期人口特别国债、政策性金融和国家人口发展基金独立滚动核算。人的出生到进入完整经济循环需要二十年以上，不能只按当期财政消费评价。以养育金切入后，可逐步把普惠分配扩展到其他国民，使起点收入从理念变成可运行的基础经济制度。\n\n长期价值需要长期投入，但并不意味着没有当期支出和未来偿付。国债应明确偿付安排，基金应公开收支，政策性金融则需对应适合融资的项目，不能用工具名称代替资金来源。"},{"id":131,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（一）以大规模普惠养育金作为最现实的切入点","original":"应明确把总和生育率尽快、持续回升至更替水平作为国家长期目标，而不能满足于降幅收窄。建议2027—2028 年先建立全国统一养育金底线，2029—2030 年根据出生人口、养育负担和物价把支出提高至GDP 的3%左右；若生育率仍无明显回升，再向5%推进。任何现金承诺至少稳定延续至儿童成年，避免短期试点削弱家庭预期。","previous":"我国2025年已经建立面向3周岁以下婴幼儿的育儿补贴制度，国家基础标准为每孩每年3600元。下一步不是从零起步，而是在这一基础上明显提标、扩大覆盖年龄，并使家庭能够相信支持不会因短期政策变化而中断。建议2027—2028年重点完善统一发放和中央地方分担机制，逐步扩大支持；2029—2030年在充分核算的基础上，研究向更大投入规模推进。\n\n应明确把总和生育率持续回升至更替水平作为国家长期目标，不能满足于降幅收窄。但若生育没有明显回升，还要查明住房、工时、托育和职业风险等障碍，而不只是增加现金。评价同时关注儿童生活、家庭负担和生育计划的实现程度，区分出生数量变化与育龄人口规模变化。已经作出的支持承诺，应覆盖承诺的养育期限；从16周岁进一步延长至成年所需资金，也应提前纳入预算，使家庭能够据此安排长期生活。","changes":[{"id":"C049","paragraph":131,"start":41,"end":66,"before":"建议2027—2028 年先建立全国统一养育金底线","after":"我国2025年已建立育儿补贴制度，国家基础标准为3周岁以下婴幼儿每孩每年3600元。建议2027—2028年在此基础上提高全国统一养育金底线并扩大覆盖年龄","reason":"国家医保局转载的2025年实施方案明确已有制度。保留中国案例与2027—2028年规划，将“首次建立”改成提标扩围；新增3600元是已核到的中国政策事实，不拿国外制度替换。","kind":"口径订正","impact":"保留原主张","sources":["S35"]},{"id":"C050","paragraph":131,"start":157,"end":157,"before":"","after":"\n\n若生育率未明显回升，还应同时辨别住房、工时、托育和职业风险的约束，并把儿童生活改善与生育目标分别评价。","reason":"原文3%到5%的投入路径保留为作者建议。补充效果不佳时不只是加现金，还要查其他障碍，且不能因出生数不变就否定儿童生活改善。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S31","S34","S35"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["2027","2028","2029","2030","3%","5%"],"suggested":"应明确把总和生育率尽快、持续回升至更替水平作为国家长期目标，而不能满足于降幅收窄。我国2025年已建立育儿补贴制度，国家基础标准为3周岁以下婴幼儿每孩每年3600元。建议2027—2028年在此基础上提高全国统一养育金底线并扩大覆盖年龄，2029—2030 年根据出生人口、养育负担和物价把支出提高至GDP 的3%左右；若生育率仍无明显回升，再向5%推进。任何现金承诺至少稳定延续至儿童成年，避免短期试点削弱家庭预期。\n\n若生育率未明显回升，还应同时辨别住房、工时、托育和职业风险的约束，并把儿童生活改善与生育目标分别评价。"},{"id":132,"page":13,"heading":true,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"（二）把公共服务、教育和人本产业结合起来","previous":"（二）把公共服务、教育和人本产业结合起来","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（二）把公共服务、教育和人本产业结合起来"},{"id":133,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"现金收入解决家庭支付能力，公共服务解决家庭时间和风险。建议由政府主导增加0—3 岁普惠托育，与产假结束衔接；逐步实现3—6 岁学前教育普惠免费，并把基本公共教育覆盖至高中阶段。托育、学校和医疗设施应按提升生育率的目标保留冗余，不能只按当前出生人口机械压缩。","previous":"现金收入解决家庭支付能力，公共服务解决家庭时间和风险。建议由政府主导增加0—3岁普惠托育，与产假结束衔接；在现有学前教育保障基础上，逐步扩大普惠免费范围，并加强高中阶段的基本公共教育保障。托育、学校和医疗设施应兼顾人口现状与生育支持目标，保留必要的调整空间，不能只按当期出生人口机械压缩，也不宜脱离实际需求盲目建设。","changes":[],"sourceIds":["S36"],"restoration":"恢复0—3岁、3—6岁和高中阶段的明确范围；现行进度可校注核对，不删成不带年龄与范围的概括。","previousChanged":true,"chinaAnchors":[],"numbers":["0","3","3","6"],"suggested":"现金收入解决家庭支付能力，公共服务解决家庭时间和风险。建议由政府主导增加0—3 岁普惠托育，与产假结束衔接；逐步实现3—6 岁学前教育普惠免费，并把基本公共教育覆盖至高中阶段。托育、学校和医疗设施应按提升生育率的目标保留冗余，不能只按当前出生人口机械压缩。"},{"id":134,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"按全国约三分之一婴幼儿存在明确或潜在托育需求估算，若先形成约1000 万个普惠托位，并按每个托位配置0.3—0.4 名保育、卫生和管理人员，可直接形成约300 万—400 万个以人为核心、难被人工智能替代的稳定岗位，同时支持女性就业和家庭生育。","previous":"以形成1000万个普惠托位作为规模测算情景，若每个托位平均需要0.3—0.4名保育、卫生和管理人员，对应约300万—400万人的服务人员配置。这是服务总量的测算，并不等于净新增就业。实际建设应依据分地区、分年龄的入托需求、人员标准和现有供给逐步推进，使增加托位真正转化为家庭用得上、负担得起的照护。","changes":[{"id":"C051","paragraph":134,"start":70,"end":107,"before":"可直接形成约300 万—400 万个以人为核心、难被人工智能替代的稳定岗位","after":"对应约300万—400万人的服务人员配置，属于以人为核心、难被人工智能完全替代的工作","reason":"三分之一需求、1000万托位、0.3—0.4和300—400万均保留。乘法算出的是服务人员总配置，不是相对现有供给的净新增就业；只订正结论对象。","kind":"口径订正","impact":"保留原主张","sources":["S37"]}],"sourceIds":["S37"],"restoration":"保留三分之一需求、1000万托位、0.3—0.4人员配置与300—400万结果，建议只区分总量配置和净新增。","previousChanged":true,"chinaAnchors":[],"numbers":["1000","0.3","0.4","300","400"],"suggested":"按全国约三分之一婴幼儿存在明确或潜在托育需求估算，若先形成约1000 万个普惠托位，并按每个托位配置0.3—0.4 名保育、卫生和管理人员，对应约300万—400万人的服务人员配置，属于以人为核心、难被人工智能完全替代的工作，同时支持女性就业和家庭生育。"},{"id":135,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"可对普惠托位按每人每年1.2 万元给予中央和地方运营补助，1000 万个托位年度支出约1200亿元；家庭年度实际承担的托育费用原则上不高于当地居民年人均可支配收入的10%，不足部分由财政和用人单位合理分担。补助与人员资质、师幼比、开放时长和家长满意度挂钩。","previous":"可研究对实际提供普惠服务的托位，按每个每年1.2万元给予中央和地方运营补助；若覆盖1000万个托位，仅这一项年度支出约为1200亿元，建设及其他支持另行核算。家庭年度实际承担的托育费用，原则上可争取不高于当地居民年人均可支配收入的10%，不足部分以财政支持为主，并鼓励有条件的用人单位参与。补助与人员资质、服务质量、开放时长和实际使用情况挂钩。\n\n养育支持也应包括父亲和母亲都能实际使用的照护假、就业保护和重返岗位的安排。不能一方面希望家庭增加养育，另一方面又让照护者独自承担职业中断的代价。","changes":[{"id":"C052","paragraph":135,"start":6,"end":17,"before":"按每人每年1.2 万元","after":"按每个托位每年1.2万元","reason":"下文预算以1000万托位相乘，计量单位应与计算一致。1.2万元、1200亿元和收入10%上限均保留。","kind":"口径订正","impact":"保留原主张","sources":["S38"]}],"sourceIds":["S38"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["1.2","1000","1200","10%"],"suggested":"可对普惠托位按每个托位每年1.2万元给予中央和地方运营补助，1000 万个托位年度支出约1200亿元；家庭年度实际承担的托育费用原则上不高于当地居民年人均可支配收入的10%，不足部分由财政和用人单位合理分担。补助与人员资质、师幼比、开放时长和家长满意度挂钩。"},{"id":136,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"教育改革要减少家庭投入的时间、金钱和焦虑。在不降低基本素养和教学质量的前提下，可试点将小学至高中总学制由12 年逐步压缩至10 年，把重复训练时间转向真实项目、跨学科学习、体育、艺术和社会交往；学校评价更多考察学生从入学到毕业的能力增量。","previous":"教育改革要减少家庭投入的时间、金钱和焦虑。在不降低基本素养、教学质量和身心发展要求的前提下，可对优化学制开展独立论证，包括研究将小学至高中总学制由12年逐步压缩至10年的可行性。重点应是减少重复训练，把时间转向真实项目、跨学科学习、体育、艺术和社会交往，不能只压缩年限而把原有负担挤进更短时间。学校评价更多考察学生从入学到毕业的能力增量。","changes":[{"id":"C053","paragraph":136,"start":119,"end":119,"before":"","after":"\n\n压缩的应是重复和低效训练，不能把原有负担简单挤进更短年限；学制调整还须单独论证身心发展与教学质量的条件。","reason":"保留12年压缩至10年的原政策建议，不替作者撤回。仅写出“缩学制”与“减负”的逻辑差别，避免缩短年限成为提高学习强度。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S39"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["12","10"],"suggested":"教育改革要减少家庭投入的时间、金钱和焦虑。在不降低基本素养和教学质量的前提下，可试点将小学至高中总学制由12 年逐步压缩至10 年，把重复训练时间转向真实项目、跨学科学习、体育、艺术和社会交往；学校评价更多考察学生从入学到毕业的能力增量。\n\n压缩的应是重复和低效训练，不能把原有负担简单挤进更短年限；学制调整还须单独论证身心发展与教学质量的条件。"},{"id":137,"page":13,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"产业结构应向照护、教育、医疗、康复、文化、现场维修和社区服务等人机互补领域倾斜。人工智能可以处理标准化信息，却难以完全替代责任承担、情感联系和现场判断。提高普通家庭收入后，新增需求也更可能流入这些本地服务，从而形成不易被远程系统和国际贸易完全替代的就业。","previous":"产业结构应向照护、教育、医疗、康复、文化、现场维修和社区服务等人机互补领域倾斜。人工智能可以处理标准化信息，却难以完全替代责任承担、情感联系和现场判断。提高普通家庭收入后，新增需求也更可能流入这些本地服务，从而形成不易被远程系统和国际贸易完全替代的就业。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"产业结构应向照护、教育、医疗、康复、文化、现场维修和社区服务等人机互补领域倾斜。人工智能可以处理标准化信息，却难以完全替代责任承担、情感联系和现场判断。提高普通家庭收入后，新增需求也更可能流入这些本地服务，从而形成不易被远程系统和国际贸易完全替代的就业。"},{"id":138,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（二）把公共服务、教育和人本产业结合起来","original":"制造业政策也应从只补设备转向设备、现场技术人员和运维人员同步投资。产业调整不能只要求劳动者转行，而要先通过居民收入和公共采购创造真实需求，再让培训、岗位和服务供给跟随需求扩张，实现技术部门与人本服务部门相互支撑。","previous":"制造业政策也应从只补设备转向设备、现场技术人员和运维人员同步投资。产业调整不能只要求劳动者转行，而要先通过居民收入和公共采购创造真实需求，再让培训、岗位和服务供给跟随需求扩张，实现技术部门与人本服务部门相互支撑。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"制造业政策也应从只补设备转向设备、现场技术人员和运维人员同步投资。产业调整不能只要求劳动者转行，而要先通过居民收入和公共采购创造真实需求，再让培训、岗位和服务供给跟随需求扩张，实现技术部门与人本服务部门相互支撑。"},{"id":139,"page":14,"heading":true,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"（三）把效率提高转化为工资、工时和职业入口","previous":"（三）把效率提高转化为工资、工时和职业入口","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（三）把效率提高转化为工资、工时和职业入口"},{"id":140,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"建议首先严格落实每周44 小时法定工时和加班工资制度，在人工智能应用程度高、生产率提升明显的企业和地区试点四天工作制。2026 年上半年企业就业人员周平均工时为48.2 小时，若降至44 小时，单个劳动者工时减少约8.7%，可在不降低生活水平的前提下释放新的用工空间。","previous":"建议首先严格落实标准工时、加班报酬和休息休假制度。《国务院关于职工工作时间的规定》明确，标准工时为每日8小时、每周40小时；依法实行其他工时制度的，应按相应规定保障休息。在人工智能应用程度高、生产率提升明显的企业和地区，可试点不降薪的缩短工时安排，包括有条件的四天工作制。\n\n缩短工时的直接目的，是把效率提高转化为劳动者可以支配的时间，而不是机械地按减少多少小时推算能够增加多少岗位。能否扩大用工，还取决于需求、岗位可分性和生产组织。不得把五天的工作简单挤入四天，形成更高强度的隐性加班。","changes":[{"id":"C054","paragraph":140,"start":8,"end":19,"before":"每周44 小时法定工时","after":"每日8小时、每周40小时的标准工时","reason":"1995年修订的《国务院关于职工工作时间的规定》第三条规定8/40；原文44小时涉及另一法律文本口径，不能笼统当作统一实施的标准工时。国内法规订正，非国外经验替换。","kind":"口径订正","impact":"保留原主张","sources":["S40"]},{"id":"C055","paragraph":140,"start":59,"end":87,"before":"2026 年上半年企业就业人员周平均工时为48.2 小时","after":"以原稿所引2026年企业就业人员周平均工时48.2小时为基数","reason":"48.2小时保留，尚需把具体统计月与半年期间均值区分。先明确这是原稿的测算基数，不把尚未复核的半年口径写成已核实。原始发布期可在来源栏补齐。","kind":"口径订正","impact":"保留原主张","sources":["S18"]},{"id":"C056","paragraph":140,"start":88,"end":133,"before":"若降至44 小时，单个劳动者工时减少约8.7%，可在不降低生活水平的前提下释放新的用工空间","after":"即使先降至44小时，工时也减少约8.7%；进一步落实标准工时，则可让效率收益更多转化为闲暇。能否同时增加用工，还取决于需求和生产组织","reason":"保留44与8.7%的算例，但把44明确为说明性过渡情景，而非法定目标。缩短工时不自动等量增加岗位，也不能仅由乘除法推出工资不降。","kind":"逻辑补充","impact":"保留原主张","sources":["S40"]}],"sourceIds":["S18","S40"],"restoration":"保留48.2、44和8.7%的测算链；8/40标准工时以独立、可拒绝的法规订正呈现，不再抹去量化推演。","previousChanged":true,"chinaAnchors":[],"numbers":["44","2026","48.2","44","8.7%"],"suggested":"建议首先严格落实每日8小时、每周40小时的标准工时和加班工资制度，在人工智能应用程度高、生产率提升明显的企业和地区试点四天工作制。以原稿所引2026年企业就业人员周平均工时48.2小时为基数，即使先降至44小时，工时也减少约8.7%；进一步落实标准工时，则可让效率收益更多转化为闲暇。能否同时增加用工，还取决于需求和生产组织。"},{"id":141,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"青年政策应从一般培训转向\"真实岗位中的训练\"。对录用毕业三年以内青年和人工智能冲击行业转岗人员的企业，给予每人每月1000—1500 元、最长十二个月的岗位培训补助，并阶段性降低新增员工社保固定成本。若每年支持100 万个岗位，财政支出约120 亿—180 亿元。","previous":"青年政策应从一般培训转向“真实岗位中的训练”。对录用毕业三年以内青年和人工智能冲击行业转岗人员的企业，可给予每人每月1000—1500元、最长十二个月的岗位培训补助，并研究阶段性降低新增员工的社会保险固定成本。若每年支持100万个岗位、每个均补助十二个月，仅培训补助支出约为120亿—180亿元，社会保险支持另行核算。\n\n公共补助应购买真实的培养成果，要求有实际任务、导师、合理报酬和能力评价，并检查补助结束后的就业衔接。不能只按招聘人数发钱，诱使企业反复替换补贴对象，也不能为了保留“练手机会”而人为维持没有价值的工作。","changes":[{"id":"C057","paragraph":141,"start":114,"end":131,"before":"财政支出约120 亿—180 亿元","after":"仅此项培训补助支出约120亿—180亿元，社会保险支持另行核算","reason":"100万个岗位×1000—1500元×12个月的120—180亿元是培训补助，不含前句同时提出的社保优惠。所有参数保留，只明确预算边界。","kind":"口径订正","impact":"保留原主张","sources":["S41"]},{"id":"C058","paragraph":141,"start":132,"end":132,"before":"","after":"\n\n补助应对应真实任务、导师指导和能力成长，避免企业反复替换补贴对象，也避免为了保留练手机会而维持无价值工作。","reason":"前文已经反对为就业制造低效工作；此处需要说明购买的是培养成果，而不是招聘数字。与职业入口的论证呼应。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S41"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["1000","1500","100","120","180"],"suggested":"青年政策应从一般培训转向\"真实岗位中的训练\"。对录用毕业三年以内青年和人工智能冲击行业转岗人员的企业，给予每人每月1000—1500 元、最长十二个月的岗位培训补助，并阶段性降低新增员工社保固定成本。若每年支持100 万个岗位，仅此项培训补助支出约120亿—180亿元，社会保险支持另行核算。\n\n补助应对应真实任务、导师指导和能力成长，避免企业反复替换补贴对象，也避免为了保留练手机会而维持无价值工作。"},{"id":142,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"企业内部应建立人工智能收益分享机制。建议获得产业补助、税收优惠和政府采购支持的企业，披露应用人工智能前后的生产率、岗位数量、工资总额和实际工时；试点阶段可把经审计的降本增效收益的10%作为分享起点，用于增加一线工资、在不降薪前提下缩短工时或增加青年岗位。","previous":"企业内部应建立人工智能收益分享机制。建议获得产业补助、税收优惠和政府采购支持的企业，披露应用人工智能前后的生产率、岗位数量、工资总额和实际工时。在事先约定的支持条件中，可将经核算的技术净收益的10%作为试点分享起点，用于增加一线工资、在不降薪前提下缩短工时、支持转岗或增加青年培养机会，再根据效果调整比例。净收益核算应扣除相应设备、软件和组织调整成本，既让劳动者受益，也为企业继续创新留下空间。","changes":[{"id":"C059","paragraph":142,"start":78,"end":92,"before":"经审计的降本增效收益的10%","after":"扣除相应技术投入与组织调整成本后、经审计的净收益的10%","reason":"10%分享比例原样保留。明确收益需扣除对应投入，否则企业技术成本被忽略，分享基数无法核算。","kind":"口径订正","impact":"保留原主张","sources":[]}],"sourceIds":["S42"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["10%"],"suggested":"企业内部应建立人工智能收益分享机制。建议获得产业补助、税收优惠和政府采购支持的企业，披露应用人工智能前后的生产率、岗位数量、工资总额和实际工时；试点阶段可把扣除相应技术投入与组织调整成本后、经审计的净收益的10%作为分享起点，用于增加一线工资、在不降薪前提下缩短工时或增加青年岗位。"},{"id":143,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"建议把居民可支配收入增速不低于名义GDP 增速、劳动报酬份额稳步提高，列为人工智能示范区和产业支持项目的约束性指标。获得公共支持的企业若产出明显增长而工资总额下降，应把一定比例差额补入职工分享账户；连续两年大幅减少入门岗位且未缩短工时的，调减补助和采购权重。","previous":"人工智能示范区和产业支持项目，应把居民可支配收入增长、劳动者处境改善和公共收益增加纳入评价。地区层面可以把居民可支配收入增速不低于名义GDP增速作为努力方向，但不能要求每一家自动化企业的用工数量和工资总额只增不减。工资、缩短工时、转型安置和公共收益分享，应当综合观察；技术改变收入结构时，普通人获得的发展成果不能只用单一工资份额衡量。","changes":[{"id":"C060","paragraph":143,"start":129,"end":129,"before":"","after":"\n\n这类要求应在获得公共支持时事先约定，并综合计算工资、工时、转岗和公共收益。不能一面鼓励提高效率，另一面又仅因用工或工资总额下降就惩罚有价值的自动化。","reason":"保留原来对公共支持企业的约束方案供作者审议；补明单看工资总额会与自动化目标冲突。对“工资差额入账、调减采购”等具体条款仍需作者决定取舍，不自动替代原案。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S42"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"建议把居民可支配收入增速不低于名义GDP 增速、劳动报酬份额稳步提高，列为人工智能示范区和产业支持项目的约束性指标。获得公共支持的企业若产出明显增长而工资总额下降，应把一定比例差额补入职工分享账户；连续两年大幅减少入门岗位且未缩短工时的，调减补助和采购权重。\n\n这类要求应在获得公共支持时事先约定，并综合计算工资、工时、转岗和公共收益。不能一面鼓励提高效率，另一面又仅因用工或工资总额下降就惩罚有价值的自动化。"},{"id":144,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"对劳动报酬占增加值比重上升、青年招聘增加、工时下降且产出不降的企业，可提高研发抵扣、社保返还和政府采购权重；对依靠无偿加班和大规模替代普通岗位获得政策支持的企业，应减少补助。产业政策由此从只补机器转向机器和人共同受益。","previous":"对真正增加青年培养机会、改善一线待遇、缩短工时且保持有效产出的企业，可以提高相应政策支持；对依靠无偿加班、逃避劳动责任获得成本优势的企业，应依法纠正。公共资金不应无条件补贴机器替代劳动，却也不应惩罚有价值的技术进步。产业政策应从只看设备和产出，转向同时考察劳动者与社会能否分享收益。","changes":[{"id":"C061","paragraph":144,"start":54,"end":80,"before":"对依靠无偿加班和大规模替代普通岗位获得政策支持的企业","after":"对依靠无偿加班、逃避劳动责任获得成本优势的企业","reason":"将违法侵害劳动权益与技术替代任务分开。原文反对阻止机器替代低效任务，此处若单因替代规模大就处罚，会与总目标冲突。涉及政策边界，需作者确认。","kind":"制度选择","impact":"需作者确认","sources":[]}],"sourceIds":["S42"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"对劳动报酬占增加值比重上升、青年招聘增加、工时下降且产出不降的企业，可提高研发抵扣、社保返还和政府采购权重；对依靠无偿加班、逃避劳动责任获得成本优势的企业，应减少补助。产业政策由此从只补机器转向机器和人共同受益。"},{"id":145,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（三）把效率提高转化为工资、工时和职业入口","original":"高校和职业教育要按岗位任务而不是静态职业名称更新课程，重点培养情境判断、责任承担、跨角色协调、现场适应、伦理权衡和证据表达。但教育改革不能代替岗位供给；没有第一份工作，再多课堂培训也难以形成真正的职业经验。","previous":"高校和职业教育要按岗位任务而不是静态职业名称更新课程，重点培养情境判断、责任承担、跨角色协调、现场适应、伦理权衡和证据表达。但教育改革不能代替岗位供给；没有第一份工作，再多课堂培训也难以形成真正的职业经验。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"高校和职业教育要按岗位任务而不是静态职业名称更新课程，重点培养情境判断、责任承担、跨角色协调、现场适应、伦理权衡和证据表达。但教育改革不能代替岗位供给；没有第一份工作，再多课堂培训也难以形成真正的职业经验。"},{"id":146,"page":14,"heading":true,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"（四）建立公开可审计的资金、算法和评价体系","previous":"（四）建立公开可审计的资金、算法和评价体系","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"（四）建立公开可审计的资金、算法和评价体系"},{"id":147,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"起点收入、养育金和企业收益分享应分别核算。起点收入对应当期国内生产成果的分配，可由一般公共预算、增值环节固定比例划转和低效投资支出调整支持；养育金具有二十年以上回报周期，应通过中央财政、超长期人口特别国债和国家人口发展基金滚动核算。","previous":"起点收入、养育金和企业收益分享应分别核算，也要合并观察总体公共负担。一般公共预算、公共资产收益、税制调整和低效支出压减，都可成为资金来源的讨论方向，但必须逐项列明实际可用金额及原有用途。养育支持具有长期价值，也仍然需要长期收支安排；不能用基金名称或融资工具代替预算，更不能重复计算同一笔收益。","changes":[{"id":"C062","paragraph":147,"start":116,"end":116,"before":"","after":"\n\n分别核算之后，还应合并观察总负担，列明每笔收入原有用途，避免在起点收入、养育金和其他公共服务之间重复计算可用资金。","reason":"不能因为列成几个账户就认为没有争用同一税收或公共收益。本段财政、国债、基金及二十年以上周期全部保留，只补合并预算检查。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S33"],"restoration":"","previousChanged":true,"chinaAnchors":["国内"],"numbers":[],"suggested":"起点收入、养育金和企业收益分享应分别核算。起点收入对应当期国内生产成果的分配，可由一般公共预算、增值环节固定比例划转和低效投资支出调整支持；养育金具有二十年以上回报周期，应通过中央财政、超长期人口特别国债和国家人口发展基金滚动核算。\n\n分别核算之后，还应合并观察总负担，列明每笔收入原有用途，避免在起点收入、养育金和其他公共服务之间重复计算可用资金。"},{"id":148,"page":14,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"建议依托数字人民币或具备同等审计能力的支付基础设施建立个人公共收益账户。算法只使用就业工资、入门岗位、劳动报酬份额、生育率、地区成本和供给能力等必要指标，不追踪个人消费偏好；提取比例、调整条件、全国上限和地区差异规则全部公开，接受年度评估和独立审计。","previous":"建议依托数字人民币或具备同等安全与审计能力的支付基础设施，建立个人公共收益账户。调整依据主要采用就业、收入、职业入口、物价、地区成本和供给能力等必要统计指标，不以集中追踪所有人的日常消费为前提。提取比例、调整条件、全国上限和地区差异规则全部公开，接受年度评估与独立审计，并提供线下办理、异议申诉和差错纠正渠道。","changes":[{"id":"C063","paragraph":148,"start":125,"end":125,"before":"","after":"\n\n公开规则还应配有异议申诉、差错纠正和线下办理渠道，算法只执行依法确定的规则，不自行改变基本权利。","reason":"原段已有审计和隐私限制，补制度执行发生错误时谁负责、个人如何救济。没有再添加不必要的技术术语。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"建议依托数字人民币或具备同等审计能力的支付基础设施建立个人公共收益账户。算法只使用就业工资、入门岗位、劳动报酬份额、生育率、地区成本和供给能力等必要指标，不追踪个人消费偏好；提取比例、调整条件、全国上限和地区差异规则全部公开，接受年度评估和独立审计。\n\n公开规则还应配有异议申诉、差错纠正和线下办理渠道，算法只执行依法确定的规则，不自行改变基本权利。"},{"id":149,"page":15,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"资金规模必须与实际供给匹配。监测不能只看发放额和单月物价，还要同时观察居民实际收入增速、产能利用率、住房托育医疗供给和企业预期。某一领域供给不足时，应先增加供给，而不是只用现金竞价有限资源；外汇则主要用于进口资源、技术和境外资产。","previous":"资金规模必须与实际供给匹配。监测不能只看发放额和单月物价，还要同时观察居民实际收入、产能利用率、住房托育医疗供给和企业预期。某一领域供给不足时，应把扩大供给与收入支持结合起来，而不是只用现金竞价有限资源。评估也要计入筹资的负担，不能只计算领取者的消费增加，而不计算提供资金者和其他公共支出受到的影响。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"资金规模必须与实际供给匹配。监测不能只看发放额和单月物价，还要同时观察居民实际收入增速、产能利用率、住房托育医疗供给和企业预期。某一领域供给不足时，应先增加供给，而不是只用现金竞价有限资源；外汇则主要用于进口资源、技术和境外资产。"},{"id":150,"page":15,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"对外经济政策也应纳入人民生活指标。出口信贷、出口退税和产业补助不宜继续鼓励无底线低价竞争，可把品牌溢价、工资份额、研发强度和贸易条件改善纳入支持标准；外汇使用则更多投向能源资源、关键技术、全球资产和民众有真实需求的进口，使出口所得最终转化为国内生活改善。","previous":"对外经济政策也应纳入人民生活指标。出口信贷、出口退税和产业补助不宜继续鼓励无底线低价竞争，可把品牌溢价、工资份额、研发强度和贸易条件改善纳入支持标准；外汇使用则更多投向能源资源、关键技术、全球资产和民众有真实需求的进口，使出口所得最终转化为国内生活改善。","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":["国内"],"numbers":[],"suggested":"对外经济政策也应纳入人民生活指标。出口信贷、出口退税和产业补助不宜继续鼓励无底线低价竞争，可把品牌溢价、工资份额、研发强度和贸易条件改善纳入支持标准；外汇使用则更多投向能源资源、关键技术、全球资产和民众有真实需求的进口，使出口所得最终转化为国内生活改善。"},{"id":151,"page":15,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"人工智能产业和地方考核应增加普通人处境指标，包括高暴露行业入门岗位、22—30 岁青年就业率和起薪、劳动报酬占增加值比重、实际工时和带薪休假、中低收入群体可支配收入、育儿家庭收入和生育意愿、出生人口与公共服务密度。","previous":"人工智能产业和地方考核应增加普通人处境指标，包括高暴露行业入门岗位、分年龄青年就业率和起薪、劳动报酬与公共分享收入、实际工时和带薪休假、中低收入群体可支配收入、育儿家庭负担和生育计划实现程度、出生人口与公共服务可及性。指标应保持口径一致，不能只挑有利的结果解释政策。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":["22","30"],"suggested":"人工智能产业和地方考核应增加普通人处境指标，包括高暴露行业入门岗位、22—30 岁青年就业率和起薪、劳动报酬占增加值比重、实际工时和带薪休假、中低收入群体可支配收入、育儿家庭收入和生育意愿、出生人口与公共服务密度。"},{"id":152,"page":15,"heading":false,"section":"五、以养育金为切入点的具体建议","subsection":"（四）建立公开可审计的资金、算法和评价体系","original":"建议用三年地方试点形成统一核算规范，再由全国人大和有关部门研究基础制度安排。评价人工智能不能只看模型参数、算力、投资额和企业利润，而要看人民是否获得更高收入、更多闲暇、更稳定职业入口和更好的养育条件，看技术进步是否真正增强人口、国力和文明延续能力。","previous":"建议以三年地方试点形成较为统一的核算和评估规范，再由全国人大和有关部门研究更广泛的基础制度安排。相同预算下，要比较现金、托育服务以及二者结合的效果，观察哪些群体被遗漏、哪些障碍仍未解除。三年可以检验发放、使用和部分行为反应，却不能完整证明全国长期效果，更不能以试点结束为由中断已经承诺的养育支持。\n\n评价人工智能，不能只看模型参数、算力、投资额和企业利润，而要看人民是否获得更高收入、更多闲暇、更稳定的职业入口和更好的养育条件。经济增长低于预期时，基本承诺怎样维持；关键服务供给不足时，支出结构怎样调整，也应在扩大规模前说明。技术进步是否真正增强人口、国力和文明延续能力，最终要落实到这些可以观察的生活变化上。","changes":[{"id":"C064","paragraph":152,"start":124,"end":124,"before":"","after":"\n\n三年可以检验发放、使用和部分行为变化，却不能完整证明全国长期效果；尤其不能以试点结束为由中断已向家庭承诺的养育支持。","reason":"保留三年试点、全国人大研究的原安排。区分试验期限与家庭十几年的支持承诺，避免与前文稳定预期相冲突。","kind":"逻辑补充","impact":"保留原主张","sources":[]}],"sourceIds":["S43"],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"建议用三年地方试点形成统一核算规范，再由全国人大和有关部门研究基础制度安排。评价人工智能不能只看模型参数、算力、投资额和企业利润，而要看人民是否获得更高收入、更多闲暇、更稳定职业入口和更好的养育条件，看技术进步是否真正增强人口、国力和文明延续能力。\n\n三年可以检验发放、使用和部分行为变化，却不能完整证明全国长期效果；尤其不能以试点结束为由中断已向家庭承诺的养育支持。"},{"id":153,"page":15,"heading":true,"section":"结语","subsection":"","original":"结语","previous":"结语","changes":[],"sourceIds":[],"restoration":"","previousChanged":false,"chinaAnchors":[],"numbers":[],"suggested":"结语"},{"id":154,"page":15,"heading":false,"section":"结语","subsection":"","original":"人工智能不是人类的竞争者，而是减少人类必要劳动的工具。它越强，对人类整体越是好事。真正的风险从来不是机器越来越像人，而是分配制度仍只按一个人能为企业创造多少利润来决定其收入和尊严，把无法在市场上出售技能的人排除在共同发展成果之外。","previous":"人工智能是减少人类必要劳动、扩大生产和创造能力的工具。就就业与分配而言，真正需要警惕的，不是机器能够完成越来越多任务，而是制度仍主要按一个人能为企业创造多少当期收益来决定其生活保障，把无法在市场上出售技能的人排除在共同发展成果之外。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"人工智能不是人类的竞争者，而是减少人类必要劳动的工具。它越强，对人类整体越是好事。真正的风险从来不是机器越来越像人，而是分配制度仍只按一个人能为企业创造多少利润来决定其收入和尊严，把无法在市场上出售技能的人排除在共同发展成果之外。"},{"id":155,"page":15,"heading":false,"section":"结语","subsection":"","original":"如果强大的生产能力没有使人民生活更从容，却让财富集中、消费不足、青年失去入口并进一步放弃生育，就会同时形成经济、人口和政治风险。历史上的财富集中曾以王朝周期反复付出代价；社会主义中国更应主动建立制度，使人民作为国家主人在经济意义上分享共同生产能力，走出一条技术越进步、分配越公平、人口越稳定、生活越从容的现代化道路。","previous":"如果强大的生产能力没有使人民生活更从容，却伴随着财富集中、消费不足、青年失去入口并进一步放弃生育，就会同时形成经济、人口和社会风险。社会主义中国更应主动建立制度，使人民作为国家主人在经济意义上分享共同发展的成果，走出一条技术越进步、生活越有保障、养育越有支持的现代化道路。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["中国"],"numbers":[],"suggested":"如果强大的生产能力没有使人民生活更从容，却让财富集中、消费不足、青年失去入口并进一步放弃生育，就会同时形成经济、人口和政治风险。历史上的财富集中曾以王朝周期反复付出代价；社会主义中国更应主动建立制度，使人民作为国家主人在经济意义上分享共同生产能力，走出一条技术越进步、分配越公平、人口越稳定、生活越从容的现代化道路。"},{"id":156,"page":15,"heading":false,"section":"结语","subsection":"","original":"若不能配之以合理的分配机制改革，人工智能的发展会强化了收入、时间和预期的压力，使低生育率雪上加霜。让生育养育成为有收入、有尊严、受全社会支持的事业，既是降低社会内卷、释放家庭时间的现实机制，也是守住人口规模、需求市场、技术迭代和中华文明传承者的根本之策。越是能够用机器替代劳动，越有能力，也越应该把人的全面发展置于发展中心。","previous":"若不能配之以合理的分配机制改革，人工智能可能强化收入、时间和预期的压力，使低生育率雪上加霜。让生育养育成为有收入、有尊严、受全社会支持的事业，就是把下一代成长所需的成本与风险，从家庭独自承担转向合理的社会分担。越是能够用机器替代劳动，越有能力，也越应该把人的全面发展置于发展中心。","changes":[{"id":"C065","paragraph":156,"start":23,"end":27,"before":"会强化了","after":"会强化","reason":"仅改病句，不弱化原来关于收入、时间与预期压力的判断。","kind":"措辞","impact":"保留原主张","sources":[]}],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":[],"numbers":[],"suggested":"若不能配之以合理的分配机制改革，人工智能的发展会强化收入、时间和预期的压力，使低生育率雪上加霜。让生育养育成为有收入、有尊严、受全社会支持的事业，既是降低社会内卷、释放家庭时间的现实机制，也是守住人口规模、需求市场、技术迭代和中华文明传承者的根本之策。越是能够用机器替代劳动，越有能力，也越应该把人的全面发展置于发展中心。"},{"id":157,"page":15,"heading":false,"section":"结语","subsection":"","original":"\"投资于人\"的要义，不是把每个人训练成更适合机器的劳动者，而是让技术进步服务人的生活。以大规模普惠养育金切入，逐步建立起点收入，并配套公共服务、缩短工时、青年岗位和企业分享机制，一揽子回应经济下行、低生育危机和人工智能冲击，才能使我国人民真正过上与生产和创造能力相匹配的生活，使共同富裕从理念转化为可感可及的现实。","previous":"“投资于人”的要义，不是把每个人训练成更适合机器的劳动者，而是让技术进步服务人的生活。以大规模普惠养育金切入，逐步探索起点收入，并配套公共服务、缩短工时、青年岗位和企业分享机制，是为了使生产效率的提高，真正转化为普通人的收入、时间、机会和希望。一个社会不仅要有能力生产今天需要的商品，也要有能力支持人们过好今天的生活、培养明天的人。这才是共同富裕应当落实的地方。","changes":[],"sourceIds":[],"restoration":"","previousChanged":true,"chinaAnchors":["我国"],"numbers":[],"suggested":"\"投资于人\"的要义，不是把每个人训练成更适合机器的劳动者，而是让技术进步服务人的生活。以大规模普惠养育金切入，逐步建立起点收入，并配套公共服务、缩短工时、青年岗位和企业分享机制，一揽子回应经济下行、低生育危机和人工智能冲击，才能使我国人民真正过上与生产和创造能力相匹配的生活，使共同富裕从理念转化为可感可及的现实。"}],"sources":[{"id":"S01","paragraphs":[9,12,21],"title":"北大—智联招聘报告","claim":"2—5个百分点；31.9%→33.8%；11.3%→14.1%。","note":"请补2024原始报告页码、样本期及招聘占比分母。上一版也未取得发布方完整报告；保留数字，不以此判为错误。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S02","paragraphs":[10,21,36],"title":"上海科技大学招聘与任务分析","claim":"1267种职业、6.52万项任务；33.2%、26.6%、18.6%；5000—8000元、1—3年与1.2万元以上。","note":"需分开任务组合、招聘岗位和新增重组岗位的样本与时间窗；不能相加或直接换算全社会失业。完整保留国内数据。","url":"https://ceisd.shanghaitech.edu.cn/2026/0729/c16878a1125955/page.htm","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S03","paragraphs":[14],"title":"阿里巴巴｜标准化咨询解决率","claim":"原稿：解决率可达80%以上；人工转向复杂投诉、VIP等场景。","note":"需补阿里发布方材料、应用年份及“解决率”的分母。接待率、回答率和解决率不能互换；“人工规模收缩”亦需独立人力证据。没有出处不等于允许删掉中国案例。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S04","paragraphs":[14],"title":"Salesforce｜客服团队与交互量","claim":"原稿：约9000人→5000人；Agentforce承担约一半客户交互。","note":"核对统计日期、团队边界、实际裁员/转岗及“客户交互”的口径。作为原稿既有海外对照保留，不顶替中国案例。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S05","paragraphs":[14],"title":"甲骨文｜员工总数变化","claim":"原稿：2026财年16.2万人→14.1万人，约下降13%。","note":"应核对两个财年10-K的员工口径；公司总员工人数不是客服团队人数。AI风险披露不能单独证明全部2.1万人变化均由AI导致。","url":"https://www.sec.gov/Archives/edgar/data/1341439/000119312526277521/orcl-20260531.htm","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S06","paragraphs":[14],"title":"Challenger｜裁员公告原因","claim":"原稿：2026年截至7月，以AI为原因的裁员11.27万人，占24%。","note":"需核发布方同期报告。公告原因是企业陈述，不等于经济整体净就业变化；此提醒留在来源栏，不每段都加免责声明。","url":"https://www.challengergray.com/blog/challenger-report-layoffs-fall-hiring-picks-up-ai-leads-for-fifth-straight-month/","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S07","paragraphs":[15],"title":"中国银行网点与离柜业务","claim":"原稿：2020年22.7万个；2024年行业估算约19万个；离柜业务率90%以上。","note":"重点核查22.7万与19万是否同为全部营业网点，是否分别来自协会与行业机构、是否含不同机构范围；列出对应报告页码。数字原位保留，不能换为美国银行或无数据的概述。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S08","paragraphs":[15],"title":"财务、人力、供应链RPA应用率","claim":"原稿：调研应用率超过25%。","note":"需补调查机构、年份、行业范围，以及分母是企业、受访者还是流程。RPA并非全部属于本轮大模型应用，但可作为自动化背景；这一分界在校注中说明。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S09","paragraphs":[16],"title":"美的与富士康｜国内制造案例","claim":"原稿：美的2024年每万人1200台；富士康深圳2010年约30万人、2024年约5万人。","note":"保留企业、年份及数值。美的需明确工厂范围与密度分母；富士康需明确同一厂区范围，并区分自动化、业务外迁与经营变化，不把人数差全部归因于AI。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S10","paragraphs":[16],"title":"IFR｜中国工业机器人","claim":"原稿：2024新增29.5万台，全球占54%，保有量突破200万台。","note":"发布方资料线索来自上一版。本轮未重新逐表复核；新增安装、保有量与人数属于不同计量对象，不可直接等同裁员。","url":"https://ifr.org/ifr-press-releases/news/global-robot-demand-in-factories-doubles-over-10-years","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S11","paragraphs":[17],"title":"萝卜快跑与国内Robotaxi","claim":"原稿：2026Q1 320万、3月单周35万、4月累计2200万；小马智行、文远知行、AutoX。","note":"保留所有国内案例。需要确认operational rides是否都为收费订单，并分别查各企业与城市的运营范围；不以删除公司名单来回避核验。","url":"https://ir.baidu.com/news-releases/news-release-details/baidu-announces-first-quarter-2026-results/","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S12","paragraphs":[23],"title":"ILO｜男女职业暴露比例","claim":"女性就业中4.7%、男性就业中2.4%处于最高暴露类别。","note":"本轮核对发布方摘要：分母分别是女性就业与男性就业。只支持暴露程度，不是实际失业概率。","url":"https://www.ilo.org/publications/generative-ai-and-jobs-refined-global-index-occupational-exposure","status":"checked","location":"发布页摘要，Globally段","checkedAt":"2026-09-13","provenance":"本轮查看发布方原文"},{"id":"S13","paragraphs":[26],"title":"WEF｜2025版未来就业报告","claim":"2025—2030年：新增1.7亿、替代9200万、净增7800万；创造与消失合计22%。","note":"本轮核对Key Findings。原稿误写2023版和2023—2027年；22%是岗位变化占现有就业总量，而不是工作时间。多种宏观趋势共同作用。","url":"https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/","status":"checked","location":"Key Findings，第32—33行对应段落","checkedAt":"2026-09-13","provenance":"本轮查看发布方原文"},{"id":"S14","paragraphs":[20],"title":"斯坦福｜青年就业研究版本","claim":"原稿：22—25岁、相对下降16%；2026年年均3.8%。","note":"上一版替换为19%，但版本与基线并不相同。本轮保留原数据，要求分别补两项数字的论文版本、观察截止期、比较组；不把新旧数字自动串联。","url":"https://digitaleconomy.stanford.edu/app/uploads/2026/08/Canaries_August2026.pdf","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S15","paragraphs":[36],"title":"国家统计局｜工资性收入占比","claim":"原稿：2025年居民人均工资性收入占可支配收入56.6%。","note":"需保留年份及居民人均口径；不能由这个比例推出所有收入来自工资。原数字与中国论据保持。","url":"https://www.stats.gov.cn/sj/zxfb/202601/t20260119_1962321.html","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S16","paragraphs":[48],"title":"出生人口｜近期比较","claim":"原稿：2025年792万，2016年1786万，减少55.7%。","note":"核查两年出生人口是否按同一历史修订口径。按原数字计算降幅约55.66%，四舍五入55.7%成立；算术成立不代表两个源数据已核实。","url":"https://www.stats.gov.cn/sj/zxfbhjd/202602/t20260228_1962662.html","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S17","paragraphs":[48],"title":"育娲人口智库｜历史人口比较","claim":"原稿：约为清末民初一半，不到1963年出生高峰1/4。","note":"恢复上一版删去的历史尺度。需补《中国百年历史人口报告2026》页码、历史年份区间与估算方法；作为智库推算，应保留原稿“推算”的归属。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S18","paragraphs":[50,140],"title":"国家统计局｜周平均工作时间","claim":"原稿：48.2小时，写作2026年上半年。","note":"48.2保留。请查是某月观测、某次发布引用的上月值还是半年平均；不得把发布日期当统计期间。本轮未重新验证该发布页。","url":"https://www.stats.gov.cn/sj/xwfbh/fbhwd/202607/t20260715_1964121.html","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S19","paragraphs":[52,53,74,75],"title":"人口长期推演｜情景与因果","claim":"原稿：十分之一规模、一两代人口相对变化，以及更替水平目标。","note":"这是分析与推演，不是已发生统计。需要披露生育率、死亡率、迁移与基期假设；国家竞争力不能由人口一个变量自动推出。保留作者论证，在具体推演处补证。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S20","paragraphs":[70],"title":"中美、德日比较｜论断边界","claim":"原稿：中美领先；德日在AI“近乎缺位”，根源是人口规模。","note":"需要界定AI能力指标，并区分人口、产业、科研与资本条件。这里的建议只收窄单因素断言，不删除比较对象；不是本轮新增的国际排名。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S21","paragraphs":[71],"title":"《自然》｜递归合成数据","claim":"原稿：2024年模型崩溃论文。","note":"上一版已列论文，本轮仅作为出处线索保留。建议限定论文研究的递归替代条件，正式发表时核原文方法与结论页。","url":"https://www.nature.com/articles/s41586-024-07566-y","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S22","paragraphs":[72],"title":"OpenRouter｜中国模型调用量","claim":"原稿：2026年中国模型周调用量连续15周超过美国。","note":"恢复“15周”等原始信息。需提供起止周、指标是token还是请求、模型国别分类；平台样本不等同全球市场，更不能直接测量人口因果作用。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S23","paragraphs":[73],"title":"AI人才｜华人接近半数","claim":"原稿：美国AI顶尖人才中华人占比接近半数。","note":"需核“华人”是族裔、国籍、本科来源还是出生地；同时确认顶尖人才的样本定义。保留量级，不用另一种口径的数字强行替换。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S24","paragraphs":[81],"title":"韩国国民分红｜方案状态","claim":"原稿：2026年AI半导体税收分红、挪威模式、青年/农村/年金用途。","note":"保留原稿对照。需核是官员构想、政府正式方案还是已通过政策；缺少自动机制的评价需以方案文本为依据。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S25","paragraphs":[85],"title":"瑞士全民基本收入公投","claim":"原稿：2016年反对76.9%、赞成23.1%。","note":"保留投票数据，待补瑞士官方投票结果页。关于反对者动机需另有调查；结果比例本身不能证明所有投票者的动机。","url":"","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S26","paragraphs":[85,86],"title":"OpenResearch｜现金试验","claim":"原稿：3000人，1000人每月1000美元连续3年；少工作1.3小时、就业率低2个百分点。","note":"保留试验规模和效应量，需核版本及就业指标定义。局限与结果应同时保留，不能只留“国外经验不足以移植”的空话。","url":"https://www.openresearchlab.org/findings/key-findings-employment-and-income","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S27","paragraphs":[94],"title":"起点收入与UBI｜概念依据","claim":"原稿以数字支付和交易分享作为与UBI本质不同的依据。","note":"UBI定义资料仅作为上一版链接线索。此处是概念讨论：支付渠道与筹资来源属于不同层次，是否保留“本质区别”需作者裁定。","url":"https://basicincome.stanford.edu/about/what-is-basic-income/","status":"pending","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S28","paragraphs":[96,99],"title":"6%例子｜原始金额与基数","claim":"2000×6%=120；余额1880。420元/月、五口之家2100元。","note":"前一个算术成立。420×12÷6%=84000元，说明人均年产出基数约8.4万元；请补统计年份或明确情景。保留420与2100，拒绝无提示改成500与2500。","url":"","status":"calculation","location":"只核算术；统计基数待作者补充","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S29","paragraphs":[97,103,115],"title":"工资反馈｜待验证的制度机制","claim":"派发比例与工资反向调整，寻求劳动投入与产出平衡。","note":"属于构想，不是已验证控制系统。需给出工资指标、时滞、上下限，以及构成变化时的识别方式。作者可只采纳条件补充，不接受整体换方案。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S30","paragraphs":[116,117],"title":"全自动化｜100%分享思想实验","claim":"原稿以工资为零推出增加值100%派发。","note":"这是极端情景而非现实测量；工资、资本收益、维护成本与产权安排需区分。对100%的处理列为作者必须确认的制度选择。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S31","paragraphs":[128,131],"title":"养育金｜投入力度与孩次金额","claim":"GDP2%—5%；1000/2000/3000元每月，至16岁；一次性10万元；2029—2030约3%。","note":"保留全部原始方案参数。它们是政策建议，不是已完成精算的最优解；需要年龄、孩次、现有儿童、增量出生和过渡期人数表。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S32","paragraphs":[129],"title":"税费减免｜二孩减半三孩免除","claim":"第二孩相关负担减半，第三孩及以上原则免除。","note":"不再像上一版删去具体减免力度。需作者明确两位父母适用范围、期限、社保权益如何补足以及无税可抵家庭安排。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S33","paragraphs":[130,147],"title":"人口国债、基金与政策性金融","claim":"养育投入回报周期二十年以上；四种资金工具。","note":"长期回报是讨论跨期分担的理由，不能直接当作偿债收入。需要列示工具对应支出、实际资金、原有用途及债务偿付。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S34","paragraphs":[131],"title":"16周岁与成年｜承诺期限","claim":"第128段支持至16周岁；第131段写至少延续至成年。","note":"两处年龄期限并不完全一致。保留原文待作者选定，不静默把16改18或把成年删除。选择延长时需单独算追加预算。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S35","paragraphs":[131],"title":"中国育儿补贴｜既有制度","claim":"2025年起，3周岁以下婴幼儿，每孩每年3600元国家基础标准。","note":"本轮核对2025-07-28发布的实施方案第二部分。证明已存在这项制度，不声称覆盖此后所有地方提标或政策变化。","url":"https://www.nhsa.gov.cn/art/2025/7/28/art_14_17410.html","status":"checked","location":"第二部分（一）（二）","checkedAt":"2026-09-13","provenance":"本轮查看发布方原文"},{"id":"S36","paragraphs":[133],"title":"普惠公共教育｜政策建议","claim":"0—3岁托育、3—6岁学前教育及高中阶段公共教育。","note":"保留原年龄层和目标。应区分原稿的拟议普惠免费范围与现行政策已实施范围，按各项政策原文再核。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S37","paragraphs":[134],"title":"托位与人员｜总量测算","claim":"1000万托位×0.3—0.4=300万—400万服务人员。","note":"乘法可复算，属服务总配置；净新增需要扣除现有从业及替代安排。“约三分之一需求”另需来源和调查定义。","url":"","status":"calculation","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S38","paragraphs":[135],"title":"托育运营补助｜预算算例","claim":"1000万托位×1.2万元/年=1200亿元/年；家庭承担上限为当地人均收入10%。","note":"算术复核不包括建设支出，也未证明各地需求与收费上限均可实现。金额与10%政策参数原样保留。","url":"","status":"calculation","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S39","paragraphs":[136],"title":"学制12年→10年｜独立方案","claim":"压缩重复训练，同时改善学习质量。","note":"原政策主张保留，不与AI替代直接画必然等号；要独立论证课程量、身心发展和教师供给，不把缩年限等同于减负。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S40","paragraphs":[140],"title":"中国标准工时｜法规与算例","claim":"1995年修订规定：每日8小时、每周40小时。48.2→44约减少8.7%。","note":"本轮核对第三条、第五条。44小时另见《劳动法》条文，应区分文本与标准工时实施口径；8.7%是原稿算例，不等于可新增8.7%岗位。","url":"https://www.sz.gov.cn/cn/xxgk/zfxxgj/zcfg/content/post_8965237.html","status":"checked","location":"第三条、第五条；修订日期1995-03-25","checkedAt":"2026-09-13","provenance":"本轮查看发布方原文"},{"id":"S41","paragraphs":[141],"title":"青年培训｜120亿—180亿元","claim":"100万岗位×1000—1500元/月×12月=120亿—180亿元。","note":"仅核乘法；假设所有岗位补满12月。不包含社会保险支持和管理成本；所有原参数保留。","url":"","status":"calculation","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S42","paragraphs":[142,143,144],"title":"企业分享｜10%与公共支持条件","claim":"净收益10%作为分享起点；工资、工时、岗位和采购支持联动。","note":"10%是试点政策参数，不是已验证最优率。应明确净收益、技术成本、事先约定和劳动者受益形式，避免单因自动化减员而处罚。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"},{"id":"S43","paragraphs":[152],"title":"三年试点｜验证范围","claim":"原稿建议三年地方试点后研究全国制度。","note":"三年可考察执行与部分行为反应，无法完整验证长期人口或全国一般均衡效果。试点期不能自动终止已经承诺的儿童支持。","url":"","status":"proposal","location":"","checkedAt":"","provenance":"原稿及上一轮资料线索；不代表本轮核实"}]}</script>

 box.innerHTML=(r.restoration?`<section class="restoration"><h3>上轮删减已撤回</h3><p>${esc(r.restoration)}</p></section>`:'')+(!r.changes.length?`<div class="no-change"><h3>本轮不改这段文字</h3><p>保留原来的事实密度、论证对象和表达。${r.sourceIds.length?'需要补核的统计定义与出处，放在“数据与出处”中处理，不在正文堆入泛泛提醒。':'这里没有新增文字建议；你仍可直接改写或添加批注。'}</p>${r.sourceIds.length?`<button class="inline-link" data-action="inspector" data-tab="sources">查看 ${r.sourceIds.length} 条资料校注</button>`:''}</div>`:'')+r.changes.map(c=>{const d=decision(c);return `<section class="rationale ${selectedChange===c.id?'active':''}" id="reason-${c.id}"><div class="rationale-top"><span class="rationale-id">${c.id}</span><span class="pill ${d}">${d==='accepted'?'已接受':d==='rejected'?'保留原文':'待你取舍'}</span></div><h3>${esc(c.kind)}${c.impact==='需作者确认'?' · 需作者确认':''}</h3><div class="change-summary">${c.before?`<span class="from">${esc(shorten(c.before,100))}</span><br>`:'<span class="muted">段末增补：</span><br>'}<span class="to">${esc(shorten(c.after.trim(),170))||'建议删除此处'}</span></div><p class="rationale-text">${esc(c.reason)}</p>${c.impact==='需作者确认'?'<span class="impact">涉及论断或制度选择，不作为普通润色处理。</span>':''}${c.sources.length?`<button class="inline-link" data-action="inspector" data-tab="sources">查看对应资料 ${c.sources.join('、')}</button>`:''}<div class="rationale-actions"><button data-action="decision" data-id="${c.id}" data-value="accepted" class="${d==='accepted'?'primary':''}" ${S.manual[r.id]||editing?'disabled':''}>${d==='accepted'?'已接受':'接受这处'}</button><button data-action="decision" data-id="${c.id}" data-value="rejected" ${S.manual[r.id]||editing?'disabled':''}>${d==='rejected'?'已保留原文':'保留原文'}</button></div>${d!=='pending'?`<button class="inline-link" data-action="decision" data-id="${c.id}" data-value="pending" ${S.manual[r.id]?'disabled':''}>重新待议</button>`:''}${S.manual[r.id]?'<p class="tiny muted" style="margin-top:8px">此段已有手工稿，建议取舍暂不生效。</p>':''}</section>`}).join('');
 }else if(S.view.inspector==='sources'){
 box.innerHTML=`<p class="tiny muted" style="line-height:1.9;margin-bottom:18px">出处状态不等于整段结论已获证明。待核数据留在原位，作者可补来源后再决定修改。</p>`+r.sourceIds.map(id=>{const s=evidenceFor(sourceMap.get(id));return `<section class="source-mini"><div class="source-state"><span class="rationale-id">${s.id}</span><span class="pill ${statusClass(s.status)}">${statusLabel(s.status)}</span></div><h3>${esc(s.title)}</h3><p class="claim">${esc(s.claim)}</p><p class="note">${esc(s.note)}</p>${s.location?`<p class="note" style="margin-top:7px">定位：${esc(s.location)}</p>`:''}<div class="source-actions">${safeURL(s.url)?`<a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${s.status==='checked'?'查看已核出处':'打开资料线索'} ${icon('arrow')}</a>`:'<span class="tiny muted">尚缺具体出处</span>'}<button class="small" data-action="source-edit" data-id="${s.id}">补充 / 校核</button></div></section>`}).join('')+(r.sourceIds.length?'':'<div class="empty">本段未单列数据来源。<br>可在批注中补充具体论据。</div>');
 }else{
 box.innerHTML=`<form class="comment-form" id="comment-form"><label for="comment-author">署名</label><input id="comment-author" placeholder="你的称呼 / 黄老师" value="${esc(S.author)}" maxlength="100"><label for="comment-text">给这段留下具体意见</label><textarea id="comment-text" placeholder="例如：80%的出处见原报告第几页；这里应保留中国案例。" maxlength="30000" required></textarea><button type="submit" class="primary small">保存批注</button></form><div class="comment-list">${S.comments.filter(c=>c.paragraph===r.id).slice().reverse().map(c=>`<section class="comment-card"><div class="comment-head"><span>${esc(c.author)}</span><span>${dateShort(c.at)}</span></div><p>${esc(c.text)}</p><button class="quiet small" data-action="comment-delete" data-id="${esc(c.id)}">删除</button></section>`).join('')||'<p class="tiny muted">还没有批注。批注不会混入文章正文。</p>'}</div>`;
 }
}
function renderReading(){const v=S.view.readVariant;document.getElementById('workspace').innerHTML=`<section class="reading-work"><div class="reading-toolbar"><h1>全文通读</h1><select id="read-variant" aria-label="全文版本"><option value="current">当前稿 · 与正文导出一致</option><option value="suggested">本轮建议预览 · 含待定项</option><option value="original">原稿 · 只读基准</option></select></div><p class="reading-notice">${v==='suggested'?'这是全部本轮建议的预览，含尚未接受的修改，不能当作已经确认的稿件。':'当前稿只纳入已接受的建议与手工改写；未决定的部分仍保留原文。'}点击任一段，返回该段的修改理由、数据校注和编辑器。</p><article class="manuscript">${ROWS.map(r=>{const text=esc(textFor(r,v));let inner=text;if(r.heading)inner=r.id===1?`<h1>${text}</h1>`:/^[一二三四五]、|^结语$/.test(r.original)?`<h2>${text}</h2>`:`<h3>${text}</h3>`;return `<div class="document-paragraph" data-action="paragraph" data-id="${r.id}" tabindex="0" role="button" aria-label="编辑第${r.id}段"><span class="pid-margin">${String(r.id).padStart(3,'0')}</span>${inner}</div>`}).join('')}</article></section>`;document.getElementById('read-variant').value=v}
function renderSources(){const stats={};for(const s0 of SOURCES){const s=evidenceFor(s0);stats[s.status]=(stats[s.status]||0)+1}document.getElementById('workspace').innerHTML=`<section class="source-work"><header><div><h1>数据与来源</h1><p>数字不删掉，出处单独核。已核出处 ${stats.checked||0} 条 · 待补证 ${stats.pending||0} 条 · 方案或算例 ${(stats.proposal||0)+(stats.calculation||0)} 条。<br>“出处已核”仅覆盖标明的来源与口径，不代表相关段落全部成立。</p></div><button class="small" data-action="export-ledger">导出校注清单</button></header><div class="source-filters"><input id="source-search" aria-label="搜索数据与出处" placeholder="搜索机构、数字或待核问题" value="${esc(S.view.sourceSearch)}"><select id="source-filter" aria-label="出处状态筛选"><option value="all">全部资料</option><option value="pending">待补证</option><option value="checked">出处已核</option><option value="proposal">作者方案</option><option value="calculation">仅核算术</option></select></div><div class="source-table"><div class="source-table-head"><span>数据 / 案例</span><span>原稿信息与口径</span><span>需要说明或补核的地方</span><span>出处与操作</span></div><div id="source-rows"></div></div></section>`;document.getElementById('source-filter').value=S.view.sourceFilter;renderSourceRows()}
function renderSourceRows(){const q=S.view.sourceSearch.toLowerCase(),f=S.view.sourceFilter;const shown=SOURCES.map(evidenceFor).filter(s=>(f==='all'||s.status===f)&&`${s.title} ${s.claim} ${s.note} ${s.id}`.toLowerCase().includes(q));document.getElementById('source-rows').innerHTML=shown.map(s=>`<article class="source-row"><div><div class="source-id">${s.id}</div><div class="source-title">${esc(s.title)}</div><div class="source-locations">${s.paragraphs.map(n=>`<button class="inline-link" data-action="paragraph" data-id="${n}">段${n}</button>`).join(' · ')}</div></div><div class="claim">${esc(s.claim)}</div><div class="note">${esc(s.note)}${s.location?`<div style="margin-top:8px;color:#4b697b">定位：${esc(s.location)}</div>`:''}${s.reviewer?`<div>补核人：${esc(s.reviewer)}</div>`:''}</div><div class="source-controls"><span class="pill source-status ${statusClass(s.status)}">${statusLabel(s.status)}</span>${safeURL(s.url)?`<a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${s.status==='checked'?'查看出处':'资料线索'} ${icon('arrow')}</a>`:''}<button class="small" data-action="source-edit" data-id="${s.id}">补充 / 校核</button></div></article>`).join('')||'<div class="empty">没有匹配资料。</div>'}
function render(){updateHeader();renderSidebar();if(S.view.mode==='review')renderReview();else if(S.view.mode==='read')renderReading();else renderSources()}
function guardEdit(){if(!editing)return true;if(!confirm('当前改写尚未应用。放弃这次输入并继续？'))return false;editing=null;return true}
function goParagraph(n){if(!rowMap.has(n)||!guardEdit())return;S.view.selected=n;S.view.mode='review';selectedChange=null;drawer=false;persist();render();document.getElementById('review-main').scrollTop=0;document.querySelector('.paragraph-link.active')?.scrollIntoView({block:'nearest'})}
function goNext(delta){goParagraph(Math.min(ROWS.length,Math.max(1,S.view.selected+delta)))}
function setDecision(id,value){const c=CHANGES.find(c=>c.id===id);if(!c||S.manual[c.paragraph]||editing)return;selectedChange=id;const scroll=document.getElementById('review-main')?.scrollTop||0;const inspectorScroll=document.getElementById('inspector-body')?.scrollTop||0;transaction(()=>S.decisions[id]=value);document.getElementById('review-main').scrollTop=scroll;document.getElementById('inspector-body').scrollTop=inspectorScroll;toast(value==='accepted'?`${id} 已进入当前稿`:value==='rejected'?`${id} 已保留原文`:`${id} 已重新待议`)}
function startEdit(){const r=rowMap.get(S.view.selected);editing={paragraph:r.id,text:textFor(r),initial:textFor(r)};S.view.variant='current';renderReview();document.getElementById('manual-editor').focus()}
function applyEdit(){if(!editing)return;const box=document.getElementById('manual-editor');const text=box?box.value:editing.text;const id=editing.paragraph;if(!text.trim()&&!confirm('这将把当前稿中的整段设为空。原稿仍保留。继续？'))return;editing=null;transaction(()=>{S.manual[id]={text,at:now()}});toast('改写已应用并保存；原稿和建议仍可追溯。')}
function modal(title,body,foot=''){const root=document.getElementById('overlay-root');root.innerHTML=`<div class="modal-layer"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${esc(title)}</h2><button class="quiet icon-button" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}</section></div>`;root.querySelector('button')?.focus()}
function closeModal(){document.getElementById('overlay-root').innerHTML='';modalKind=null}
function showHelp(){modalKind='help';modal('如何使用这份审稿台',`<p>这不是自动改稿器。原文是只读基准，本轮建议逐处取舍；未接受的建议不进入当前稿。</p><table class="help-table"><tr><td>1　逐段审校</td><td>左右对照。点击文中编号，查看该处为什么改，以及是否涉及作者的观点。</td></tr><tr><td>2　决定或改写</td><td>可接受某一处、保留原文或重新待议。直接编辑当前稿时，手工文本优先，该段其他建议暂不覆盖它。</td></tr><tr><td>3　补证与批注</td><td>数据问题在右侧单列。补URL、报告页码、核验说明和署名；来源记录与正文取舍互不替代。</td></tr><tr><td>4　交给另一位审稿人</td><td>点“保存审稿副本”，生成含全部取舍、改写、批注与资料的单个HTML。对方用浏览器打开即可接着审。</td></tr></table><h3>保存与交接的边界</h3><p>自动保存只在当前设备、浏览器及文件环境中生效。清除浏览器数据、改路径或换设备可能读不到原存储。交接前请保存HTML副本或JSON记录。</p><p>这是离线文件，不提供云端同步或多人同时协作。不同副本的意见需要人工协调；导入JSON会替换当前记录，不做静默合并。</p><h3>三个版本各有用途</h3><p>“本轮建议”含未决定的建议；“当前稿”只含已接受的建议与改写；“上轮存档”保留旧修订用于追溯，不会直接发布。</p><p>本轮从原稿重新起步，${CHANGES.length}处建议位于${ROWS.filter(r=>r.changes.length).length}段。${ROWS.filter(r=>r.restoration).length}段附有恢复说明。全部${ROWS.length}段及原有国内案例保留在文件中。</p><h3>快捷键</h3><p>Ctrl / ⌘ + S：保存可交接副本。<br>Alt + 左 / 右：上一段 / 下一段。<br>编辑框内 Ctrl / ⌘ + Enter：应用改写。<br>非输入框内 Ctrl / ⌘ + Z：撤销本次打开期间的内容操作。重新打开后仍可逐项恢复原文，但不保留跨会话撤销栈。</p>`, '<button class="primary" data-action="close-modal">开始校阅</button>')}
function showExports(){if(editing){toast('请先应用或取消正在输入的改写，再导出。');return}modalKind='exports';const n=countStats(),pendingSources=SOURCES.map(evidenceFor).filter(s=>s.status==='pending').length;modal('导出与交接',`<div class="export-note">尚有 ${n.pending} 处文字建议待定、${pendingSources} 条资料待补证。正文导出采用“当前稿”，不自动采纳待定建议，也不标为已核定的发表稿。</div><div class="export-option"><div><strong>可继续编辑的审稿副本 · HTML</strong><p>含原稿、上轮稿、本轮建议、取舍、手工改写、批注和出处。发给另一位审稿人即可接着修改。</p></div><button class="primary small" data-action="snapshot">保存副本</button></div><div class="export-option"><div><strong>当前稿 · Markdown</strong><p>只导出正文，保留章节结构。不夹入修改理由和批注。</p></div><button class="small" data-action="export-md">导出正文</button></div><div class="export-option"><div><strong>当前稿 · 阅读 / 打印 HTML</strong><p>干净排版，无审稿工具。可在浏览器打印或另存PDF。</p></div><button class="small" data-action="export-clean">导出阅读稿</button></div><div class="export-option"><div><strong>审稿记录 · JSON</strong><p>备份取舍、改写、批注与出处。只可导入同一原稿；导入前会要求确认替换。</p></div><button class="small" data-action="export-json">备份</button><button class="small" data-action="import-json">导入</button></div><div class="export-option"><div><strong>校注清单 · Markdown</strong><p>逐处写明取舍与具体理由，并附全部数据出处的核对状态。</p></div><button class="small" data-action="export-ledger">导出校注</button></div><input type="file" id="import-file" accept="application/json,.json" hidden>`)}
function showSourceEdit(id){const s=evidenceFor(sourceMap.get(id));if(!s)return;modalKind='source';modal('补充数据与出处',`<div class="tiny muted">${s.id} · ${esc(s.title)}</div><p style="margin-top:9px;font-family:var(--serif)">${esc(s.claim)}</p><form id="source-form" data-id="${s.id}"><label for="source-status-edit">出处状态</label><select id="source-status-edit"><option value="pending">待补证</option><option value="checked">出处已核（须写明定位和核对范围）</option><option value="proposal">作者方案 / 推演，非观测事实</option><option value="calculation">仅核算术，统计基数仍待核</option></select><label for="source-url-edit">来源链接（可留空）</label><input type="url" id="source-url-edit" value="${esc(s.url)}" placeholder="https://…"><label for="source-location-edit">报告名称、页码或具体段落</label><input id="source-location-edit" value="${esc(s.location)}" placeholder="例如：2024年报告，第18页，表3"><label for="source-note-edit">核对说明与仍存的问题</label><textarea id="source-note-edit">${esc(s.note)}</textarea><label for="source-reviewer-edit">补核人</label><input id="source-reviewer-edit" value="${esc(s.reviewer||S.author)}" placeholder="署名"><p class="tiny muted" style="margin-top:14px">只更新这条出处记录，不替你改正文。“出处已核”须指明支持什么、没有证明什么。</p></form>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="source-save" data-id="${s.id}">保存资料记录</button>`);document.getElementById('source-status-edit').value=s.status}
function saveSource(id){const status=document.getElementById('source-status-edit').value,url=document.getElementById('source-url-edit').value.trim(),location=document.getElementById('source-location-edit').value.trim(),note=document.getElementById('source-note-edit').value.trim(),reviewer=document.getElementById('source-reviewer-edit').value.trim();if(url&&!safeURL(url)){toast('请填写http或https来源链接。');return}if(status==='checked'&&(!location||!note||!reviewer)){toast('标为出处已核时，请写明具体定位、核对说明和补核人。');return}transaction(()=>{S.evidence[id]={status,url,location,note,reviewer,at:now()};if(reviewer)S.author=reviewer});closeModal();toast('出处记录已保存，正文保持原样。')}
function toast(text){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',3800)}
function download(content,name,type){const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function fileStamp(){return new Date().toISOString().slice(0,19).replace(/[-:]/g,'').replace('T','_')}
function snapshot(){if(editing){toast('请先应用或取消当前改写，再保存审稿副本。');return}persist();const state=deep(S);state.workspaceId='copy-'+uid();state.snapshotAt=now();const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#overlay-root').innerHTML='';clone.querySelector('#toast-root').innerHTML='';clone.querySelector('#initial-state').textContent=jsonSafe(state);download('<!doctype html>\n'+clone.outerHTML,`文稿校订台_全文对照_审稿副本_${fileStamp()}.html`,'text/html;charset=utf-8');toast('已生成独立HTML副本，包含当前全部审稿记录。')}
function markdown(){return ROWS.map(r=>{const text=textFor(r);if(!r.heading)return text;return (r.id===1?'# ':/^[一二三四五]、|^结语$/.test(r.original)?'## ':'### ')+text}).join('\n\n')+'\n'}
function cleanHTML(){return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(DATA.title)} · 当前稿</title><style>body{max-width:820px;margin:45px auto;padding:0 30px;color:#1b2730;font:18px/2 "Songti SC","SimSun",serif}h1{font-size:27px;text-align:center}h2{font-size:23px;margin-top:35px}h3{font-size:20px;margin-top:25px}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0;max-width:none;font-size:12pt;line-height:1.85}h2,h3{break-after:avoid}} </style></head><body>${ROWS.map(r=>{const t=esc(textFor(r));if(!r.heading)return `<p>${t}</p>`;return r.id===1?`<h1>${t}</h1>`:/^[一二三四五]、|^结语$/.test(r.original)?`<h2>${t}</h2>`:`<h3>${t}</h3>`}).join('\n')}</body></html>`}
function ledger(){let text=`# 文稿校订记录\n\n文章：${DATA.title}\n\n导出时间：${now()}\n\n原稿指纹：${DATA.documentId}\n\n## 逐处取舍与理由\n\n`;for(const r of ROWS){if(!r.changes.length&&!r.restoration&&!S.manual[r.id]&&!S.comments.some(c=>c.paragraph===r.id))continue;text+=`### 原稿第${r.page}页 · 段${r.id}\n\n`;if(r.restoration)text+=`上轮恢复说明：${r.restoration}\n\n`;if(S.manual[r.id])text+=`**本段采用手工改写；逐项建议暂不生效。**\n\n${S.manual[r.id].text}\n\n${S.manual[r.id].reason?'手工修改理由：'+S.manual[r.id].reason+'\n\n':''}`;for(const c of r.changes)text+=`**${c.id}｜${c.kind}｜${c.impact}｜${({accepted:'已接受',rejected:'保留原文',pending:'待定'})[decision(c)]}**\n\n原文：${c.before||'（段末新增）'}\n\n建议：${c.after.trim()||'（删除）'}\n\n理由：${c.reason}\n\n`;for(const c of S.comments.filter(c=>c.paragraph===r.id))text+=`批注（${c.author}，${c.at}）：${c.text}\n\n`}
 text+='## 数据与出处\n\n';for(const s0 of SOURCES){const s=evidenceFor(s0);text+=`### ${s.id} ${s.title}\n\n段落：${s.paragraphs.join('、')}\n\n状态：${statusLabel(s.status)}\n\n信息：${s.claim}\n\n校注：${s.note}\n\n${s.url?'来源：'+s.url+'\n\n':''}${s.location?'定位：'+s.location+'\n\n':''}${s.reviewer?'补核人：'+s.reviewer+'\n\n':''}`;}return text}

// Full-manuscript comparison: source data and editorial decisions are unchanged.
const compareDiffCache = new Map();
const compareOpen = new Set();
let compareViewport = null, compareSelected = null, compareScrollTimer = null;
const compareKind = c => {const bits=diffStrings(c.before,c.after),a=bits.some(x=>x.kind==='add'),d=bits.some(x=>x.kind==='remove');return a&&d?'替换':a?'新增':d?'删除':'未改'};
const compareStatus = c => c.archive ? '仅供追溯' : c.manual ? '手工稿' : ({pending:'待取舍',accepted:'已接受',rejected:'保留原文'})[decision(c)];
const compareVariantLabel = () => S.view.variant==='previous'?'上轮存档':S.view.variant==='current'?'当前稿':'本轮建议';
function compareTokens(s){return s.match(/\d+(?:\.\d+)?%?|[A-Za-z][A-Za-z0-9_.-]*|[\s\S]/gu)||[]}
function diffStrings(before,after){
 const key=before+'\u0000'+after;if(compareDiffCache.has(key))return compareDiffCache.get(key);
 const a=compareTokens(before),b=compareTokens(after);let prefix=0,suffix=0;
 while(prefix<a.length&&prefix<b.length&&a[prefix]===b[prefix])prefix++;
 while(suffix<a.length-prefix&&suffix<b.length-prefix&&a[a.length-1-suffix]===b[b.length-1-suffix])suffix++;
 const A=a.slice(prefix,a.length-suffix),B=b.slice(prefix,b.length-suffix),n=A.length,m=B.length;
 const out=[];const push=(kind,text)=>{if(!text)return;const last=out[out.length-1];if(last&&last.kind===kind)last.text+=text;else out.push({kind,text})};
 push('same',a.slice(0,prefix).join(''));
 if(n*m>1500000){push('remove',A.join(''));push('add',B.join(''))}else{
  const width=m+1,table=new Uint32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)table[i*width+j]=A[i]===B[j]?1+table[(i+1)*width+j+1]:Math.max(table[(i+1)*width+j],table[i*width+j+1]);
  let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){push('same',A[i]);i++;j++}else if(table[(i+1)*width+j]>=table[i*width+j+1])push('remove',A[i++]);else push('add',B[j++])}
  push('remove',A.slice(i).join(''));push('add',B.slice(j).join(''));
 }
 push('same',suffix?a.slice(a.length-suffix).join(''):'');
 if(compareDiffCache.size>600)compareDiffCache.clear();compareDiffCache.set(key,out);return out;
}
function compareFragments(c){
 let pos=c.start||0,group=null;const out=[];
 for(const bit of diffStrings(c.before,c.after)){
  if(bit.kind==='same'){if(group){out.push(group);group=null}pos+=bit.text.length;continue}
  if(!group)group={start:pos,end:pos,before:'',after:''};
  if(bit.kind==='remove'){group.before+=bit.text;pos+=bit.text.length;group.end=pos}else group.after+=bit.text;
 }if(group)out.push(group);return out;
}
function compareLocation(c){
 if(!c.before)return c.start===0?'原稿段首':c.start===rowMap.get(c.paragraph).original.length?'原稿段末':`原稿第 ${c.start} 字符后`;
 if(c.start===0&&c.end===rowMap.get(c.paragraph).original.length)return '本段内'+compareKind(c);

}
function comparisonChanges(r){
 const v=S.view.variant;
 if(v==='previous')return r.original===r.previous?[]:[{id:'H'+r.id,paragraph:r.id,start:0,end:r.original.length,before:r.original,after:r.previous,archive:true,kind:'上轮存档差异',impact:'仅追溯',reason:r.restoration||'此处展示上轮存档与原稿的文字差异，不代表本轮建议，也不会自动进入当前稿。该轮没有留下逐处修改理由，不能补写为当时已记录的理由。',sources:r.sourceIds}];
 if(S.manual[r.id]){const manual=S.manual[r.id];return r.original===manual.text?[]:[{id:'M'+r.id,paragraph:r.id,start:0,end:r.original.length,before:r.original,after:manual.text,manual:true,kind:'手工改写',impact:'编辑者决定',reason:manual.reason||'本段为编辑者手工改写。文字差异已自动标出；编辑者尚未填写修改理由，可在“编辑”中补充。',sources:r.sourceIds}]}

function compareChip(c,side,anchor=false){
 const symbol=compareKind(c)==='新增'?'+':compareKind(c)==='删除'?'−':'↔';
 return `<sup class="full-diff-chip${anchor?' full-anchor':''}" data-action="full-focus" data-id="${c.id}" data-row="${c.paragraph}" data-side="${side}" data-diff-ui tabindex="0" role="button" aria-label="${c.id}，${compareKind(c)}，查看具体改动与理由" title="${c.id} · ${compareKind(c)} · ${compareLocation(c)}"><span class="op-symbol">${symbol}</span>${c.id}</sup>`;
}
function compareMarkup(r,side){
 const cs=comparisonChanges(r);if(!cs.length)return numeric(side==='left'?r.original:textFor(r,S.view.variant));
 let out='',pos=0;
 for(const c of cs){out+=numeric(r.original.slice(pos,c.start));let labeled=false;const kind=compareKind(c);
  for(const bit of diffStrings(c.before,c.after)){
   if(bit.kind!=='same'&&!labeled){out+=compareChip(c,side,side==='left'&&kind==='新增'||side==='right'&&kind==='删除');labeled=true}
   if(bit.kind==='same')out+=numeric(bit.text);
   else if(side==='left'&&bit.kind==='remove'||side==='right'&&bit.kind==='add'){
    const tag=bit.kind==='remove'?'del':'ins';const space=/^\s+$/.test(bit.text)?' space-diff':'';
    out+=`<${tag} class="${space}${selectedChange===c.id?' diff-focused':''}" data-action="full-focus" data-id="${c.id}" data-row="${r.id}" data-change="${c.id}" tabindex="0" role="button" title="${c.id} · ${bit.kind==='remove'?'删除':'新增'}${space?'空白字符':''} · 点击查看理由">${numeric(bit.text)}</${tag}>`;
   }
  }pos=c.end;
 }return out+numeric(r.original.slice(pos));

}

}
