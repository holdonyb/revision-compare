 const box=document.getElementById('comparison-work');if(!box)return;
 const entries=[...box.querySelectorAll('.full-diff-chip[data-side="right"]')];if(!entries.length){toast('此版本尚无文字差异。切换“本轮建议”可查看待定建议。');return}
 const top=box.getBoundingClientRect().top+box.querySelector('.full-toolbar').getBoundingClientRect().height+8;
 let index=entries.findIndex(x=>x.dataset.id===compareSelected);let target;
 if(index>=0&&Math.abs(entries[index].getBoundingClientRect().top-top)<box.clientHeight)target=entries[index+delta];
 if(!target){const ordered=delta>0?entries:entries.slice().reverse();target=ordered.find(x=>delta>0?x.getBoundingClientRect().top>top+8:x.getBoundingClientRect().top<top-8)}
 if(!target){toast(delta>0?'已经到最后一处修改。':'已经到第一处修改。');return}
 compareSelected=target.dataset.id;selectedChange=compareSelected;
 box.scrollTop+=target.getBoundingClientRect().top-top-12;
 document.querySelectorAll('.diff-focused').forEach(x=>x.classList.remove('diff-focused'));document.querySelectorAll(`[data-change="${compareSelected}"]`).forEach(x=>{if(x.matches('ins,del'))x.classList.add('diff-focused')});
 updateComparePosition();
}
function openComparisonPanel(id,tab){
 if(!guardEdit())return;S.view.selected=Number(id);S.view.inspector=tab;modalKind='compare-inspector';
 modal(`段 ${String(id).padStart(3,'0')} · 校订说明`,`<nav class="inspector-tabs">${[['reasons','修改理由'],['sources','数据与出处'],['comments','批注']].map(([k,l])=>`<button class="inspector-tab ${tab===k?'active':''}" data-action="full-panel-tab" data-tab="${k}">${l}</button>`).join('')}</nav><div id="inspector-body"></div>`);
 document.querySelector('.modal-layer').classList.add('compare-modal');renderInspector();
}
function editComparisonRow(id){
 if(!guardEdit())return;const r=rowMap.get(Number(id));S.view.selected=r.id;
 editing={paragraph:r.id,text:textFor(r),initial:textFor(r),reason:S.manual[r.id]?.reason||'',initialReason:S.manual[r.id]?.reason||'',compare:true};modalKind='compare-edit';
 modal(`段 ${String(id).padStart(3,'0')} · 编辑当前稿`,`<div class="compare-editor-hint">从当前稿开始编辑，不自动采纳待定建议。应用后，这一段采用你的手工稿，并在全文对照中标出实际增删。</div><div class="compare-editor-toolbar"><span>原稿第 ${r.page} 页 · ${esc(titleFor(r))}</span><button class="small" data-action="full-edit-suggested">以本轮建议为底稿</button></div><label for="manual-editor">正文</label><textarea id="manual-editor" spellcheck="false" aria-label="编辑当前段落">${esc(editing.text)}</textarea><label for="manual-reason">这次改动的理由（可补充）</label><textarea id="manual-reason" placeholder="说明具体改了哪里、为什么改；不写进文章正文。">${esc(editing.reason)}</textarea>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="edit-save">应用改写</button>`);
 document.querySelector('.modal-layer').classList.add('compare-modal');document.getElementById('manual-editor').focus();
}
function compareRestoration(id){const r=rowMap.get(Number(id));modalKind='restore-note';modal(`段 ${String(id).padStart(3,'0')} · 上轮删减已撤回`,`<p>${esc(r.restoration)}</p><p class="tiny muted">这条说明是对上一轮改稿的撤回记录，不是本轮新改动。左栏原稿与右栏本轮建议相同的文字不应着色；上轮存档可另行切换查看。</p>`,`<button data-action="close-modal">关闭</button><button class="primary" data-action="full-show-archive" data-id="${id}">查看上轮存档对照</button>`)}
function handleComparisonClick(el,e){
 const a=el.dataset.action,id=el.dataset.id;
 if(a==='section'&&S.view.mode==='compare'){
  S.view.section=el.dataset.section;S.view.search='';document.getElementById('paragraph-search').value='';persist();renderSidebar();const r=S.view.section==='all'?ROWS[0]:ROWS.find(r=>r.section===S.view.section);if(r)scrollCompareRow(r.id);return true;
 }
 if(a==='inspector'&&S.view.mode==='compare'&&modalKind==='compare-inspector'){S.view.inspector=el.dataset.tab;document.querySelectorAll('.dialog .inspector-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.view.inspector));renderInspector();persist();return true}
 if(a==='decision'&&modalKind==='compare-inspector'){setDecision(id,el.dataset.value);renderInspector();return true}
 if(!a.startsWith('full-'))return false;
 if(a==='full-focus'){focusComparisonChange(id,el.dataset.row,true);return true}
 if(a==='full-variant'){if(!guardEdit())return true;S.view.variant=el.dataset.variant;selectedChange=null;compareSelected=null;persist();render();return true}
 if(a==='full-marks'){S.view.compareMarks=S.view.compareMarks==='off'?'on':'off';persist();render();return true}
 if(a==='full-reasons'){S.view.compareReasons=S.view.compareReasons==='all'?'hidden':S.view.compareReasons==='hidden'?'compact':'all';if(S.view.compareReasons==='hidden')selectedChange=null;if(S.view.compareReasons==='all')CHANGES.forEach(c=>compareOpen.add(c.id));else compareOpen.clear();document.querySelectorAll('.full-reason').forEach(x=>x.open=S.view.compareReasons==='all');persist();render();return true}
 if(a==='full-font'){S.view.compareFont=Math.min(23,Math.max(15,(S.view.compareFont||18)+Number(el.dataset.delta)));persist();render();return true}
 if(a==='full-prev-change'||a==='full-next-change'){navigateComparisonChange(a==='full-next-change'?1:-1);return true}
 if(a==='full-notes'){const row=document.getElementById('full-row-'+id),notes=[...row.querySelectorAll('.full-reason')],open=notes.some(n=>!n.open);if(S.view.compareReasons==='hidden'){S.view.compareReasons='compact';persist();document.getElementById('comparison-work').classList.remove('hide-reasons');document.querySelector('[data-action="full-reasons"]').textContent='理由：简要'}notes.forEach(n=>{n.open=open;if(open)compareOpen.add(n.dataset.change);else compareOpen.delete(n.dataset.change)});if(notes.length)notes[0].scrollIntoView({block:'nearest'});return true}
 if(a==='full-panel'){openComparisonPanel(id,el.dataset.tab);return true}
 if(a==='full-panel-tab'){S.view.inspector=el.dataset.tab;document.querySelectorAll('.dialog .inspector-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.view.inspector));renderInspector();persist();return true}
 if(a==='full-edit'){editComparisonRow(id);return true}
 if(a==='full-edit-suggested'){if(!editing)return true;const text=textFor(rowMap.get(editing.paragraph),'suggested');if(editing.text!==editing.initial&&!confirm('用本轮建议替换编辑框中的未应用文字？'))return true;editing.text=text;document.getElementById('manual-editor').value=text;toast('已将建议放入编辑框；点击“应用改写”才会进入当前稿。');return true}
 if(a==='full-clear-manual'){if(confirm('撤下本段手工稿，恢复此前保存的逐项取舍？可撤销。')){transaction(()=>delete S.manual[Number(id)]);toast('已恢复逐项审校。')}return true}
 if(a==='full-detail'){if(!guardEdit())return true;compareViewport=getCompareAnchor();S.view.selected=Number(id);S.view.mode='review';persist();render();return true}
 if(a==='full-restoration'){compareRestoration(id);return true}
 if(a==='full-show-archive'){closeModal();S.view.variant='previous';selectedChange=null;persist();render();scrollCompareRow(Number(id));return true}
 return false;
}
const originalMatchedRows=matchedRows;
matchedRows=function(){const out=originalMatchedRows(),q=S.view.search.trim();if(/^\d+$/.test(q)&&rowMap.has(Number(q))){const id=Number(q);return out.slice().sort((a,b)=>(a.id===id?-1:0)-(b.id===id?-1:0))}return out};
// Keep the existing one-paragraph workspace, source registry, and export contracts.
const renderBeforeFull=render;
render=function(){
 document.getElementById('app').classList.toggle('full-compare-mode',S.view.mode==='compare');
 if(S.view.mode==='compare'){updateHeader();renderSidebar();renderComparison();if(modalKind==='compare-inspector'&&document.getElementById('inspector-body'))renderInspector()}
 else renderBeforeFull();
};
const originalGoParagraph=goParagraph;
goParagraph=function(n){
 if(S.view.mode==='review'){originalGoParagraph(n);return}
 if(!rowMap.has(n)||!guardEdit())return;S.view.selected=n;drawer=false;const needsRender=S.view.mode!=='compare';S.view.mode='compare';selectedChange=null;persist();if(needsRender)render();else renderSidebar();scrollCompareRow(n);
};
const originalDecision=setDecision;
setDecision=function(id,value){
 if(S.view.mode!=='compare'){originalDecision(id,value);return}
 const c=CHANGES.find(c=>c.id===id);if(!c||S.manual[c.paragraph]||editing)return;
 selectedChange=id;compareSelected=id;transaction(()=>S.decisions[id]=value);
 toast(value==='accepted'?`${id} 已进入当前稿。`:value==='rejected'?`${id} 保留原文，建议与理由仍留在本段。`:`${id} 重新待议，不纳入当前稿。`);
};
const originalApplyEdit=applyEdit;
applyEdit=function(){
 if(!editing?.compare){originalApplyEdit();return}
 const id=editing.paragraph,text=document.getElementById('manual-editor').value,reason=document.getElementById('manual-reason').value.trim();
 if(text===editing.initial&&reason===editing.initialReason){editing=null;closeModal();toast('文字和理由没有变化，当前稿未改动。');return}
 if(!text.trim()&&!confirm('当前稿将删除整段；左栏原稿仍保留。继续？'))return;
 editing=null;closeModal();S.view.variant='current';transaction(()=>S.manual[id]={text,reason,at:now()});
 toast('手工稿已应用；全文右栏已切换为当前稿，实际增删均已标出。');
};
const originalCloseModal=closeModal;
closeModal=function(){
 if(editing?.compare){if((editing.text!==editing.initial||editing.reason!==editing.initialReason)&&!confirm('放弃尚未应用的文字与理由？'))return;editing=null}
 originalCloseModal();
};
const originalShowHelp=showHelp;
showHelp=function(){
 originalShowHelp();const body=document.querySelector('.dialog-body');if(body)body.insertAdjacentHTML('afterbegin',`<h3 style="margin-top:0">全文对照是默认工作区</h3><p>左原稿、右所选版本，${ROWS.length}段全部展开，按段对齐，共用一个上下滚动区。目录和搜索只负责定位，不会隐藏其余正文。窄屏按每段“原稿 → 修订稿”顺序排列。</p><p>红色删除线是删去的字，绿色下划线是新增的字；替换在两栏使用同一修改编号。点击编号或着色文字，即可在原位置展开具体增删片段、修改理由与取舍按钮。手工稿也会与原稿重新比对。</p><p>上方可切换修改标记、展开或隐藏理由，或跳到上一处 / 下一处修改。未修改的句段始终完整显示。原来的“逐段审校”和“单栏通读”仍然保留。</p>`);
};
const originalImportJSON=importJSON;
importJSON=async function(file){const oldMode=S.view.mode;await originalImportJSON(file);if(oldMode==='compare'&&S.view.mode!=='compare'){S.view.mode='compare';persist();render()}};
// Precise differences also remain available for manually edited / archived single-paragraph views.
const originalHighlighter=highlightText;
highlightText=function(r,side,variant){
 if(variant!=='previous'&&!S.manual[r.id])return originalHighlighter(r,side,variant);
 const target=variant==='previous'?r.previous:S.manual[r.id].text;
 return diffStrings(r.original,target).filter(x=>x.kind==='same'||side==='original'&&x.kind==='remove'||side!=='original'&&x.kind==='add').map(x=>x.kind==='same'?numeric(x.text):x.kind==='remove'?`<del>${numeric(x.text)}</del>`:`<mark>${numeric(x.text)}</mark>`).join('');
};
document.addEventListener('input',e=>{if(e.target.id==='manual-reason'&&editing?.compare)editing.reason=e.target.value});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.full-diff-chip,ins[data-action="full-focus"],del[data-action="full-focus"]')){e.preventDefault();focusComparisonChange(e.target.dataset.id,e.target.dataset.row,true)}});

// A single delegated router keeps all controls live after state changes.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;
 if(handleComparisonClick(el,e))return;
 switch(a){
 case 'mode':if(!guardEdit())break;S.view.mode=el.dataset.mode;drawer=false;persist();render();break;
 case 'paragraph':goParagraph(Number(id));break;case 'prev':goNext(-1);break;case 'next':goNext(1);break;
 case 'section':S.view.section=el.dataset.section;S.view.search='';document.getElementById('paragraph-search').value='';persist();renderSidebar();break;
 case 'clear-filter':S.view.search='';S.view.section='all';S.view.filter='all';document.getElementById('paragraph-search').value='';document.getElementById('paragraph-filter').value='all';persist();renderSidebar();break;
 case 'variant':S.view.variant=el.dataset.variant;persist();renderReview();break;
 case 'inspector':S.view.inspector=el.dataset.tab;persist();renderReview();break;
 case 'change-focus':selectedChange=id;S.view.inspector='reasons';renderReview();document.getElementById('reason-'+id)?.scrollIntoView({block:'nearest',behavior:'smooth'});break;
 case 'decision':setDecision(id,el.dataset.value);break;
 case 'accept-paragraph':{const r=rowMap.get(S.view.selected),n=r.changes.filter(c=>decision(c)==='pending').length;const major=r.changes.some(c=>c.impact==='需作者确认');if(confirm(`将本段${r.changes.length}处建议全部纳入当前稿。${major?'其中包含观点或制度选择。':''}确认接受？`)){transaction(()=>r.changes.forEach(c=>S.decisions[c.id]='accepted'));toast('本段建议已接受。')}break}
 case 'reject-paragraph':{const r=rowMap.get(S.view.selected);if(confirm('本段全部建议将设为“保留原文”。仍可逐处重新待议。')){transaction(()=>r.changes.forEach(c=>S.decisions[c.id]='rejected'));toast('本段已保留原文。')}break}
 case 'edit':startEdit();break;case 'edit-save':applyEdit();break;case 'edit-cancel':if(editing&&editing.text!==editing.initial&&!confirm('放弃当前尚未应用的改写？'))break;editing=null;renderReview();break;
 case 'clear-manual':if(confirm('将撤下本段手工稿，恢复原有逐项取舍。此操作可撤销。')){transaction(()=>delete S.manual[S.view.selected]);toast('已恢复逐项审校。')}break;
 case 'comment-delete':if(confirm('删除这条批注？'))transaction(()=>S.comments=S.comments.filter(c=>c.id!==id));break;
 case 'source-edit':showSourceEdit(id);break;case 'source-save':saveSource(id);break;
 case 'undo':undo();break;case 'redo':undo(true);break;case 'drawer':drawer=!drawer;renderSidebar();break;
 case 'help':showHelp();break;case 'exports':showExports();break;case 'close-modal':closeModal();break;case 'snapshot':snapshot();break;
 case 'export-md':download(markdown(),`投资于人_当前稿_${fileStamp()}.md`,'text/markdown;charset=utf-8');toast('已导出当前稿；未接受的建议仍为原文。');break;
 case 'export-clean':download(cleanHTML(),`投资于人_当前阅读稿_${fileStamp()}.html`,'text/html;charset=utf-8');toast('已导出阅读稿，可用浏览器打印。');break;
 case 'export-json':download(JSON.stringify({format:'manuscript-review/v2',documentId:DATA.documentId,savedAt:now(),state:S},null,2),`投资于人_审稿记录_${fileStamp()}.json`,'application/json;charset=utf-8');toast('审稿记录已备份。');break;
 case 'import-json':document.getElementById('import-file').click();break;
 case 'export-ledger':download(ledger(),`投资于人_逐处校注_${fileStamp()}.md`,'text/markdown;charset=utf-8');toast('已导出逐处理由、取舍、批注与出处。');break;
 case 'copy-paragraph':copyParagraph();break;
 }
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='paragraph-search'){S.view.search=t.value;persist();renderSidebar()}if(t.id==='source-search'){S.view.sourceSearch=t.value;persist();renderSourceRows()}if(t.id==='manual-editor'&&editing)editing.text=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='paragraph-filter'){S.view.filter=t.value;persist();renderSidebar()}if(t.id==='read-variant'){S.view.readVariant=t.value;persist();renderReading()}if(t.id==='source-filter'){S.view.sourceFilter=t.value;persist();renderSourceRows()}if(t.id==='import-file')importJSON(t.files[0])});
document.addEventListener('submit',e=>{if(e.target.id==='comment-form'){e.preventDefault();const text=document.getElementById('comment-text').value.trim(),author=document.getElementById('comment-author').value.trim()||'审稿人';if(!text)return;transaction(()=>{S.author=author;S.comments.push({id:uid(),paragraph:S.view.selected,text,author,at:now()})});toast('批注已保存，不进入正文。')}if(e.target.id==='source-form'){e.preventDefault();saveSource(e.target.dataset.id)}});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
 if(e.key==='Escape'){if(modalKind)closeModal();else if(drawer){drawer=false;renderSidebar()}return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();snapshot();return}
 if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&editing){e.preventDefault();applyEdit();return}
 if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey);return}
 if(!typing&&e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();goNext(e.key==='ArrowRight'?1:-1);return}
 if(e.key==='Enter'&&e.target.classList.contains('document-paragraph'))goParagraph(Number(e.target.dataset.id));
 if(e.key==='Enter'&&e.target.id==='paragraph-search'){const m=matchedRows();if(m.length)goParagraph(m[0].id)}
 if(e.key==='Tab'&&modalKind){const focusable=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog textarea,.dialog select,.dialog a')].filter(x=>!x.hidden);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
});
window.addEventListener('beforeunload',e=>{if(editing&&editing.text!==editing.initial){e.preventDefault();e.returnValue=''}});
try{for(const r of ROWS)for(const c of r.changes)if(r.original.slice(c.start,c.end)!==c.before)throw new Error('段'+r.id+'的修订定位不一致，已停止加载以保护原稿。');bootShell();render();document.querySelector('.paragraph-link.active')?.scrollIntoView({block:'nearest'});if(!storageOK)toast(storageMessage)}catch(e){document.getElementById('app').innerHTML=`<section class="fatal"><h1>校订台未能加载</h1><p>${esc(e.message)}</p><p>请保留当前文件，勿覆盖原稿。</p></section>`;console.error(e)}
// Expose a read-only snapshot for local integrity checks, not a network interface.
window.ReviewIntegrity={snapshot:()=>deep(S),currentText:id=>textFor(rowMap.get(id)),originalText:id=>rowMap.get(id).original,suggestedText:id=>textFor(rowMap.get(id),'suggested'),diffStrings:(a,b)=>deep(diffStrings(a,b)),paragraphCount:ROWS.length,changeCount:CHANGES.length,documentId:DATA.documentId};
})();
</script>
